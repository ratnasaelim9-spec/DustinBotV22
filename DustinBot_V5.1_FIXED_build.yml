name: Build DustinBot V5.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app gradle build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v51
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV51"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.dustinbot.v51"
              compileSdk 35

              defaultConfig {
                  applicationId "com.dustinbot.v51"
                  minSdk 26
                  targetSdk 35
                  versionCode 51
                  versionName "5.1"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="false"
                  android:label="DustinBot V5.1"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MainActivity$AccessService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".MainActivity$CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".MainActivity$VisionService"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v51/MainActivity.java <<'EOF'
          package com.dustinbot.v51;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.nio.ByteBuffer;

          public class MainActivity extends Activity {

              static final int CAPTURE = 5101;

              int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView label(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setPadding(dp(8), dp(8), dp(8), dp(8));
                  return t;
              }

              Button button(String s, View.OnClickListener listener) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(listener);
                  return b;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), dp(8), dp(12), dp(20));

                  box.addView(label("DUSTIN BOT V5.1", 26));
                  box.addView(label("VISION TEST", 18));
                  box.addView(label(
                      "ทดสอบ Screen Capture + เลือก Monster + ค้นหาภาพ",
                      14
                  ));

                  box.addView(button("1. เปิด Accessibility", v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  ));

                  box.addView(button("2. เปิด Overlay", v -> {
                      Intent i = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName())
                      );
                      startActivity(i);
                  }));

                  box.addView(button("3. SCREEN CAPTURE", v -> requestCapture()));

                  box.addView(button("4. เปิด VISION", v -> startVision()));

                  box.addView(button("5. เลือก MONSTER", v -> {
                      startVision();
                      new Handler().postDelayed(() -> {
                          if (VisionService.instance != null) {
                              VisionService.instance.selectTarget();
                          }
                      }, 600);
                  }));

                  box.addView(button("6. VISION START", v -> {
                      startVision();
                      new Handler().postDelayed(() -> {
                          if (VisionService.instance != null) {
                              VisionService.instance.startVision();
                          }
                      }, 600);
                  }));

                  box.addView(button("7. VISION STOP", v -> {
                      if (VisionService.instance != null) {
                          VisionService.instance.stopVision();
                      }
                  }));

                  box.addView(label(
                      "ขั้นตอน:\n" +
                      "เปิดเกม → Screen Capture → เปิด Vision → " +
                      "เลือก Monster → แตะตัว Monster → Vision Start\n\n" +
                      "ระบบจะค้นหาภาพที่เลือกและแสดงกรอบตำแหน่งที่พบ",
                      14
                  ));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(box);
                  setContentView(scroll);
              }

              void requestCapture() {
                  MediaProjectionManager manager =
                      (MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);

                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      CAPTURE
                  );
              }

              void startVision() {
                  Intent i = new Intent(this, VisionService.class);
                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(i);
                  } else {
                      startService(i);
                  }
              }

              @Override
              protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);

                  if (request != CAPTURE || result != RESULT_OK || data == null) {
                      return;
                  }

                  Intent i = new Intent(this, CaptureService.class);
                  i.putExtra("resultCode", result);
                  i.putExtra("data", data);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(i);
                  } else {
                      startService(i);
                  }
              }

              public static class AccessService extends AccessibilityService {

                  public static volatile AccessService instance;

                  @Override
                  public void onServiceConnected() {
                      super.onServiceConnected();
                      instance = this;
                  }

                  public boolean tap(float x, float y) {
                      Path path = new Path();
                      path.moveTo(x, y);

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path, 0, 60
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      return dispatchGesture(gesture, null, null);
                  }

                  public boolean swipe(
                          float x1, float y1,
                          float x2, float y2,
                          long duration) {

                      Path path = new Path();
                      path.moveTo(x1, y1);
                      path.lineTo(x2, y2);

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path, 0, duration
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      return dispatchGesture(gesture, null, null);
                  }

                  @Override
                  public void onAccessibilityEvent(
                          android.view.accessibility.AccessibilityEvent event) {
                  }

                  @Override
                  public void onInterrupt() {
                  }

                  @Override
                  public void onDestroy() {
                      instance = null;
                      super.onDestroy();
                  }
              }

              public static class CaptureService extends Service {

                  static volatile Bitmap latest;
                  static volatile int W = 1;
                  static volatile int H = 1;

                  MediaProjection projection;
                  ImageReader reader;
                  android.hardware.display.VirtualDisplay display;

                  HandlerThread thread;
                  Handler handler;

                  @Override
                  public void onCreate() {
                      super.onCreate();

                      NotificationManager nm =
                          (NotificationManager)getSystemService(NOTIFICATION_SERVICE);

                      nm.createNotificationChannel(new NotificationChannel(
                          "capture51",
                          "DustinBot Capture",
                          NotificationManager.IMPORTANCE_LOW
                      ));

                      Notification n = new Notification.Builder(this, "capture51")
                          .setContentTitle("DustinBot V5.1")
                          .setContentText("Screen Capture")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .build();

                      startForeground(5102, n);

                      thread = new HandlerThread("Capture51");
                      thread.start();
                      handler = new Handler(thread.getLooper());
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int id) {
                      if (intent == null) {
                          return START_STICKY;
                      }

                      int result = intent.getIntExtra("resultCode", 0);
                      Intent data;

                      if (Build.VERSION.SDK_INT >= 33) {
                          data = intent.getParcelableExtra("data", Intent.class);
                      } else {
                          data = intent.getParcelableExtra("data");
                      }

                      if (data != null) {
                          startCapture(result, data);
                      }

                      return START_STICKY;
                  }

                  void startCapture(int result, Intent data) {
                      try {
                          MediaProjectionManager manager =
                              (MediaProjectionManager)getSystemService(
                                  MEDIA_PROJECTION_SERVICE
                              );

                          projection = manager.getMediaProjection(result, data);

                          android.util.DisplayMetrics dm =
                              getResources().getDisplayMetrics();

                          W = dm.widthPixels;
                          H = dm.heightPixels;

                          reader = ImageReader.newInstance(
                              W, H, PixelFormat.RGBA_8888, 2
                          );

                          reader.setOnImageAvailableListener(
                              r -> captureFrame(r),
                              handler
                          );

                          display = projection.createVirtualDisplay(
                              "DustinBotV51",
                              W,
                              H,
                              dm.densityDpi,
                              android.hardware.display.DisplayManager
                                  .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                              reader.getSurface(),
                              null,
                              handler
                          );

                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }

                  void captureFrame(ImageReader r) {
                      Image image = null;

                      try {
                          image = r.acquireLatestImage();
                          if (image == null) return;

                          Image.Plane plane = image.getPlanes()[0];
                          ByteBuffer buffer = plane.getBuffer();

                          int pixelStride = plane.getPixelStride();
                          int rowStride = plane.getRowStride();

                          int realWidth = W +
                              (rowStride - pixelStride * W) / pixelStride;

                          Bitmap full = Bitmap.createBitmap(
                              realWidth, H, Bitmap.Config.ARGB_8888
                          );

                          buffer.rewind();
                          full.copyPixelsFromBuffer(buffer);

                          Bitmap clean = Bitmap.createBitmap(
                              full, 0, 0, W, H
                          );

                          full.recycle();

                          Bitmap old = latest;
                          latest = clean;

                          if (old != null && !old.isRecycled()) {
                              old.recycle();
                          }

                      } catch (Exception e) {
                          e.printStackTrace();
                      } finally {
                          if (image != null) {
                              image.close();
                          }
                      }
                  }

                  static Bitmap copy() {
                      Bitmap b = latest;

                      if (b == null || b.isRecycled()) {
                          return null;
                      }

                      try {
                          return b.copy(Bitmap.Config.ARGB_8888, false);
                      } catch (Exception e) {
                          return null;
                      }
                  }

                  @Override
                  public void onDestroy() {
                      if (display != null) display.release();
                      if (reader != null) reader.close();
                      if (projection != null) projection.stop();
                      if (thread != null) thread.quitSafely();

                      Bitmap b = latest;
                      latest = null;

                      if (b != null && !b.isRecycled()) {
                          b.recycle();
                      }

                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }
              }

              public static class VisionService extends Service {

                  static volatile VisionService instance;

                  WindowManager wm;
                  View selector;
                  VisionView visionView;

                  Bitmap template;
                  boolean running;

                  HandlerThread thread;
                  Handler ai;

                  @Override
                  public void onCreate() {
                      super.onCreate();

                      instance = this;

                      NotificationManager nm =
                          (NotificationManager)getSystemService(NOTIFICATION_SERVICE);

                      nm.createNotificationChannel(new NotificationChannel(
                          "vision51",
                          "DustinBot Vision",
                          NotificationManager.IMPORTANCE_LOW
                      ));

                      Notification n = new Notification.Builder(this, "vision51")
                          .setContentTitle("DustinBot V5.1")
                          .setContentText("Vision Engine")
                          .setSmallIcon(android.R.drawable.ic_menu_search)
                          .build();

                      startForeground(5103, n);

                      wm = (WindowManager)getSystemService(WINDOW_SERVICE);

                      thread = new HandlerThread("Vision51");
                      thread.start();
                      ai = new Handler(thread.getLooper());
                  }

                  WindowManager.LayoutParams params(int w, int h) {
                      return new WindowManager.LayoutParams(
                          w,
                          h,
                          Build.VERSION.SDK_INT >= 26
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT
                      );
                  }

                  void panel() {
                      if (visionView != null) return;

                      visionView = new VisionView();

                      WindowManager.LayoutParams p = params(-1, -1);
                      p.gravity = Gravity.TOP | Gravity.LEFT;

                      try {
                          wm.addView(visionView, p);
                      } catch (Exception e) {
                          visionView = null;
                      }
                  }

                  void selectTarget() {
                      if (selector != null) return;

                      final FrameSelect frame = new FrameSelect();
                      selector = frame;

                      WindowManager.LayoutParams p =
                          new WindowManager.LayoutParams(
                              -1,
                              -1,
                              Build.VERSION.SDK_INT >= 26
                                  ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                  : WindowManager.LayoutParams.TYPE_PHONE,
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                          );

                      try {
                          wm.addView(frame, p);
                      } catch (Exception e) {
                          selector = null;
                      }
                  }

                  void saveTemplate(float x, float y) {
                      Bitmap screen = CaptureService.copy();

                      if (screen == null) {
                          closeSelector();
                          return;
                      }

                      int sw = Math.max(1, selector.getWidth());
                      int sh = Math.max(1, selector.getHeight());

                      int sx = Math.round(
                          x * screen.getWidth() / (float)sw
                      );

                      int sy = Math.round(
                          y * screen.getHeight() / (float)sh
                      );

                      int size = 80;

                      int left = Math.max(
                          0,
                          Math.min(
                              screen.getWidth() - size,
                              sx - size / 2
                          )
                      );

                      int top = Math.max(
                          0,
                          Math.min(
                              screen.getHeight() - size,
                              sy - size / 2
                          )
                      );

                      Bitmap old = template;
                      template = Bitmap.createBitmap(
                          screen,
                          left,
                          top,
                          size,
                          size
                      );

                      if (old != null && !old.isRecycled()) {
                          old.recycle();
                      }

                      screen.recycle();

                      closeSelector();
                      panel();
                  }

                  void closeSelector() {
                      if (selector != null) {
                          try {
                              wm.removeView(selector);
                          } catch (Exception ignored) {
                          }
                          selector = null;
                      }
                  }

                  void startVision() {
                      if (template == null) {
                          panel();
                          return;
                      }

                      panel();
                      running = true;
                      ai.removeCallbacksAndMessages(null);
                      ai.post(scanRunnable);
                  }

                  void stopVision() {
                      running = false;
                      ai.removeCallbacksAndMessages(null);

                      if (visionView != null) {
                          visionView.clearResult();
                      }
                  }

                  final Runnable scanRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!running) return;

                          Bitmap screen = CaptureService.copy();

                          if (screen != null && template != null) {
                              Match m = findBest(screen, template);
                              if (visionView != null) {
                                  visionView.setResult(m);
                              }
                              screen.recycle();
                          }

                          ai.postDelayed(this, 250);
                      }
                  };

                  Match findBest(Bitmap screen, Bitmap tpl) {
                      int sw = screen.getWidth();
                      int sh = screen.getHeight();

                      int tw = tpl.getWidth();
                      int th = tpl.getHeight();

                      if (sw < tw || sh < th) {
                          return new Match(-1, -1, 0);
                      }

                      int[] src = new int[sw * sh];
                      int[] ref = new int[tw * th];

                      screen.getPixels(
                          src, 0, sw, 0, 0, sw, sh
                      );

                      tpl.getPixels(
                          ref, 0, tw, 0, 0, tw, th
                      );

                      long bestScore = Long.MAX_VALUE;
                      int bestX = -1;
                      int bestY = -1;

                      int step = 12;

                      for (int y = 0; y <= sh - th; y += step) {
                          for (int x = 0; x <= sw - tw; x += step) {

                              long diff = 0;

                              for (int ty = 0; ty < th; ty += 4) {
                                  int srcBase = (y + ty) * sw + x;
                                  int refBase = ty * tw;

                                  for (int tx = 0; tx < tw; tx += 4) {
                                      int a = src[srcBase + tx];
                                      int b = ref[refBase + tx];

                                      int ar = (a >> 16) & 255;
                                      int ag = (a >> 8) & 255;
                                      int ab = a & 255;

                                      int br = (b >> 16) & 255;
                                      int bg = (b >> 8) & 255;
                                      int bb = b & 255;

                                      diff += Math.abs(ar - br);
                                      diff += Math.abs(ag - bg);
                                      diff += Math.abs(ab - bb);
                                  }
                              }

                              if (diff < bestScore) {
                                  bestScore = diff;
                                  bestX = x;
                                  bestY = y;
                              }
                          }
                      }

                      long samples =
                          ((tw + 3) / 4) *
                          ((th + 3) / 4);

                      long maxDiff = samples * 765L;

                      float score = maxDiff == 0
                          ? 0
                          : 1f - (bestScore / (float)maxDiff);

                      return new Match(bestX, bestY, score);
                  }

                  @Override
                  public void onDestroy() {
                      running = false;

                      if (ai != null) {
                          ai.removeCallbacksAndMessages(null);
                      }

                      closeSelector();

                      if (visionView != null) {
                          try {
                              wm.removeView(visionView);
                          } catch (Exception ignored) {
                          }
                          visionView = null;
                      }

                      if (template != null && !template.isRecycled()) {
                          template.recycle();
                      }

                      template = null;
                      instance = null;

                      if (thread != null) {
                          thread.quitSafely();
                      }

                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }

                  class FrameSelect extends View {

                      Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);

                      FrameSelect() {
                          super(VisionService.this);
                          paint.setStrokeWidth(4);
                          paint.setStyle(Paint.Style.STROKE);
                          paint.setColor(Color.GREEN);
                          setBackgroundColor(0x22000000);
                      }

                      @Override
                      protected void onDraw(Canvas c) {
                          super.onDraw(c);

                          float cx = getWidth() / 2f;
                          float cy = getHeight() / 2f;

                          paint.setColor(Color.GREEN);
                          paint.setStyle(Paint.Style.STROKE);

                          c.drawRect(
                              cx - 40,
                              cy - 40,
                              cx + 40,
                              cy + 40,
                              paint
                          );

                          paint.setStyle(Paint.Style.FILL);
                          paint.setTextSize(28);
                          c.drawText(
                              "แตะ MONSTER",
                              30,
                              60,
                              paint
                          );
                      }

                      @Override
                      public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              saveTemplate(e.getX(), e.getY());
                              return true;
                          }
                          return true;
                      }
                  }

                  class VisionView extends View {

                      Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);

                      int x = -1;
                      int y = -1;
                      float score = 0;

                      VisionView() {
                          super(VisionService.this);
                          setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                      }

                      void setResult(Match m) {
                          x = m.x;
                          y = m.y;
                          score = m.score;
                          postInvalidate();
                      }

                      void clearResult() {
                          x = -1;
                          y = -1;
                          score = 0;
                          postInvalidate();
                      }

                      @Override
                      protected void onDraw(Canvas c) {
                          super.onDraw(c);

                          if (x < 0 || y < 0) return;

                          paint.setColor(Color.GREEN);
                          paint.setStyle(Paint.Style.STROKE);
                          paint.setStrokeWidth(5);

                          c.drawRect(
                              x,
                              y,
                              x + 80,
                              y + 80,
                              paint
                          );

                          paint.setStyle(Paint.Style.FILL);
                          paint.setTextSize(28);

                          String text =
                              "TARGET X:" + x +
                              " Y:" + y +
                              " SCORE:" +
                              String.format("%.2f", score);

                          c.drawText(text, 20, 50, paint);
                      }
                  }

                  static class Match {
                      final int x;
                      final int y;
                      final float score;

                      Match(int x, int y, float score) {
                          this.x = x;
                          this.y = y;
                          this.score = score;
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-V5.1-FIXED
          path: app/build/outputs/apk/debug/app-debug.apk
