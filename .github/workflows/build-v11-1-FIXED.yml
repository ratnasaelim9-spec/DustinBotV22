name: Build DustinBot V11.1 - Rune Classic

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate DustinBot V11.1 project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname "gradle.properties")"
          base64 -d > "gradle.properties" <<'__V11_FILE__'
          b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==
          __V11_FILE__

          mkdir -p "$(dirname "build.gradle")"
          base64 -d > "build.gradle" <<'__V11_FILE__'
          cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNi4xJyBhcHBseSBmYWxzZQp9Cg==
          __V11_FILE__

          mkdir -p "$(dirname "settings.gradle")"
          base64 -d > "settings.gradle" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/build.gradle")"
          base64 -d > "app/build.gradle" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          base64 -d > "app/src/main/AndroidManifest.xml" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/res/values/themes.xml")"
          base64 -d > "app/src/main/res/values/themes.xml" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          base64 -d > "app/src/main/res/values/strings.xml" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/res/xml/accessibility_service_config.xml")"
          base64 -d > "app/src/main/res/xml/accessibility_service_config.xml" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MapScanner.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/MapScanner.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/CaptureService.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/CaptureService.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/RuntimeScanner.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/RuntimeScanner.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MainActivity.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/MainActivity.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/TargetSelector.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/TargetSelector.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/BotAccessibilityService.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/BotAccessibilityService.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/Monster.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/Monster.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/BotController.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/BotController.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MonsterDatabase.java")"
          base64 -d > "app/src/main/java/com/dustinbot/v11/MonsterDatabase.java" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p "$(dirname "README.md")"
          base64 -d > "README.md" <<'__V11_FILE__'
          
          __V11_FILE__

          mkdir -p app/src/main/assets
          cat > /tmp/monster_database.json.gz.b64 <<'__V11_DB__'
          
          __V11_DB__
          base64 -d /tmp/monster_database.json.gz.b64 > /tmp/monster_database.json.gz
          gzip -dc /tmp/monster_database.json.gz > app/src/main/assets/monster_database.json


      - name: Validate V11.1
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/dustinbot/v11/RuntimeScanner.java
          test -f app/src/main/assets/monster_database.json
          grep -q "DustinBot V11.1" app/src/main/java/com/dustinbot/v11/MainActivity.java || true
          echo "V11.1 source validation OK"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11.1-RuneClassic
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
