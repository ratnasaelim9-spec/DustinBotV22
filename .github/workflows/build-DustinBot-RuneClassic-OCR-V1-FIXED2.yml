                    private void add(int id, String name, String code) {
                    monsters.add(new M(id, name, code));
                    }
                    
                    public ArrayList<M> search(String query) {
                    ArrayList<M> result = new ArrayList<>();
                    
                    String q = query == null
                    ? ""
                    : query.trim().toLowerCase(Locale.US);
                    
                    for (M monster : monsters) {
                    if (q.isEmpty()
                    || monster.name.toLowerCase(Locale.US).contains(q)
                    || monster.code.toLowerCase(Locale.US).contains(q)
                    || String.valueOf(monster.id).equals(q)) {
                    result.add(monster);
                    }
                    }
                    
                    return result;
                    }
                    
                    public static String norm(String value) {
                    if (value == null) {
                    return "";
                    }
                    
                    return value
                    .toLowerCase(Locale.US)
                    .replaceAll("[^a-z0-9]", "");
                    }
                    }
