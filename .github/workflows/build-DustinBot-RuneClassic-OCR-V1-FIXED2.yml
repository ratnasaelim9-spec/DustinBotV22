name: Build DustinBot RuneClassic OCR V1
run-name: DustinBot OCR V1 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
                    set -euo pipefail
                    
                    rm -rf app
                    mkdir -p app/src/main/java/com/dustinbot/v1
                    mkdir -p app/src/main/res/values
                    mkdir -p app/src/main/res/xml
                    
                    cat > settings.gradle <<'EOF'
                    pluginManagement {
                    repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                    }
                    }
                    
                    dependencyResolutionManagement {
                    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                    repositories {
                    google()
                    mavenCentral()
                    }
                    }
                    
                    rootProject.name = "DustinBotOCR"
                    include(":app")
                    EOF
                    
                    cat > build.gradle <<'EOF'
                    plugins {
                    id "com.android.application" version "8.6.1" apply false
                    }
                    EOF
                    
                    cat > app/build.gradle <<'EOF'
                    plugins {
                    id "com.android.application"
                    }
                    
                    android {
                    namespace "com.dustinbot.v1"
                    compileSdk 35
                    
                    defaultConfig {
                    applicationId "com.dustinbot.v1"
                    minSdk 26
                    targetSdk 35
                    versionCode 1
                    versionName "1.0"
                    }
                    }
                    
                    dependencies {
                    implementation "com.google.mlkit:text-recognition:16.0.1"
                    }
                    EOF
                    
                    cat > app/src/main/res/values/strings.xml <<'EOF'
                    <resources>
                    <string name="app_name">DustinBot OCR</string>
                    </resources>
                    EOF
                    
                    cat > app/src/main/res/values/themes.xml <<'EOF'
                    <resources>
                    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                    <item name="android:fontFamily">sans</item>
                    <item name="android:colorAccent">#42A5F5</item>
                    <item name="android:navigationBarColor">#07111F</item>
                    <item name="android:statusBarColor">#07111F</item>
                    </style>
                    </resources>
                    EOF
                    
                    cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
                    <accessibility-service
                    xmlns:android="http://schemas.android.com/apk/res/android"
                    android:accessibilityEventTypes="typeAllMask"
                    android:accessibilityFeedbackType="feedbackGeneric"
                    android:canRetrieveWindowContent="true"
                    android:canPerformGestures="true"
                    android:description="@string/app_name" />
                    EOF
                    
                    cat > app/src/main/AndroidManifest.xml <<'EOF'
                    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                    
                    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
                    
                    <application
                    android:allowBackup="false"
                    android:label="@string/app_name"
                    android:theme="@style/AppTheme">
                    
                    <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    
                    <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                    
                    </activity>
                    
                    <service
                    android:name=".BotAccessibilityService"
                    android:exported="true"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                    
                    <intent-filter>
                    <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    
                    <meta-data
                    android:name="android.accessibilityservice"
                    android:resource="@xml/accessibility_service_config" />
                    
                    </service>
                    
                    <service
                    android:name=".CaptureService"
                    android:exported="false"
                    android:foregroundServiceType="mediaProjection" />
                    
                    </application>
                    
                    </manifest>
                    EOF
                    
                    cat > app/src/main/java/com/dustinbot/v1/BotAccessibilityService.java <<'EOF'
                    package com.dustinbot.v1;
                    
                    import android.accessibilityservice.AccessibilityService;
                    import android.accessibilityservice.GestureDescription;
                    import android.graphics.Path;
                    import android.view.accessibility.AccessibilityEvent;
                    
                    public class BotAccessibilityService extends AccessibilityService {
                    
                    static volatile BotAccessibilityService instance;
                    
                    @Override
                    protected void onServiceConnected() {
                    super.onServiceConnected();
                    instance = this;
                    }
                    
                    @Override
                    public void onAccessibilityEvent(AccessibilityEvent event) {
                    }
                    
                    @Override
                    public void onInterrupt() {
                    instance = null;
                    }
                    
                    static boolean tap(float x, float y) {
                    BotAccessibilityService service = instance;
                    
                    if (service == null) {
                    return false;
                    }
                    
                    Path path = new Path();
                    path.moveTo(x, y);
                    
                    GestureDescription gesture =
                    new GestureDescription.Builder()
                    .addStroke(
                    new GestureDescription.StrokeDescription(
                    path,
                    0,
                    70
                    )
                    )
                    .build();
                    
                    return service.dispatchGesture(
                    gesture,
                    null,
                    null
                    );
                    }
                    }
                    EOF
                    
                    cat > app/src/main/java/com/dustinbot/v1/MonsterDatabase.java <<'EOF'
