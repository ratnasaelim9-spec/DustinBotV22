name: Build DustinBot RuneClassic OCR V1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare clean OCR project
        shell: bash
        run: |
          set -euo pipefail

          # Keep the existing monster database from the repository.
          mkdir -p /tmp/dustinbot-backup
          if [ -f app/src/main/assets/monster_database.json ]; then
            cp app/src/main/assets/monster_database.json /tmp/dustinbot-backup/monster_database.json
          fi

          rm -rf app
          mkdir -p app/src/main/java/com/dustinbot/v1
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          if [ -f /tmp/dustinbot-backup/monster_database.json ]; then
            cp /tmp/dustinbot-backup/monster_database.json app/src/main/assets/monster_database.json
          else
            echo "monster_database.json is missing from the repository."
            exit 1
          fi

          cat > settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='DustinBotOCR'
include ':app'
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
EOF

          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }

android { namespace 'com.dustinbot.v1'; compileSdk 35
    defaultConfig { applicationId 'com.dustinbot.v1'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
 <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
 <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
 <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
 <application android:allowBackup="false" android:label="DustinBot OCR" android:theme="@style/AppTheme">
  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
   <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
  </activity>
  <service android:name=".BotAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
   <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
   <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>
  </service>
  <service android:name=".CaptureService" android:exported="false" android:foregroundServiceType="mediaProjection"/>
 </application>
</manifest>
EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#42A5F5</item><item name="android:navigationBarColor">#07111F</item><item name="android:statusBarColor">#07111F</item></style></resources>
EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
<resources><string name="app_name">DustinBot OCR</string></resources>
EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
 android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric"
 android:canRetrieveWindowContent="true" android:canPerformGestures="true" android:description="DustinBot game control" />
EOF

          cat > app/src/main/java/com/dustinbot/v1/BotAccessibilityService.java <<'EOF'
package com.dustinbot.v1;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;
import android.graphics.Path;
import android.view.accessibility.AccessibilityEvent;

public class BotAccessibilityService extends AccessibilityService {
    static volatile BotAccessibilityService instance;
    @Override protected void onServiceConnected(){ instance=this; }
    @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
    @Override public void onInterrupt(){ instance=null; }
    static boolean tap(float x,float y){
        BotAccessibilityService s=instance; if(s==null) return false;
        Path p=new Path(); p.moveTo(x,y);
        GestureDescription g=new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p,0,70)).build();
        return s.dispatchGesture(g,null,null);
    }
}
EOF
          cat > app/src/main/java/com/dustinbot/v1/CaptureService.java <<'EOF'
package com.dustinbot.v1;

import android.app.*;import android.content.*;import android.graphics.*;import android.hardware.display.*;import android.media.*;import android.media.projection.*;import android.util.DisplayMetrics;import android.os.*;import com.google.mlkit.vision.common.InputImage;import com.google.mlkit.vision.text.*;import java.util.*;

public class CaptureService extends Service {
 static final String EXTRA_RESULT="result", EXTRA_DATA="data"; static volatile boolean running=false; static volatile Set<String> targets=Collections.emptySet();
 MediaProjection projection; ImageReader reader; Handler handler; TextRecognizer recognizer; long lastTap=0; String lastHit="";
 @Override public int onStartCommand(Intent i,int flags,int id){
  createChannel(); startForeground(1101,new Notification.Builder(this,"dustinbot_capture").setContentTitle("DustinBot OCR").setContentText("กำลังตรวจจับ Monster บนหน้าจอ").setSmallIcon(android.R.drawable.ic_menu_view).build());
  if(i!=null && i.hasExtra(EXTRA_RESULT)){ int rc=i.getIntExtra(EXTRA_RESULT,0); Intent data=(Intent)i.getParcelableExtra(EXTRA_DATA); startCapture(rc,data); }
  return START_STICKY;
 }
 void startCapture(int rc,Intent data){
  if(projection!=null)return; DisplayMetrics dm=getResources().getDisplayMetrics();int w=dm.widthPixels,h=dm.heightPixels,d=dm.densityDpi;
  reader=ImageReader.newInstance(w,h,PixelFormat.RGBA_8888,2); projection=((MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE)).getMediaProjection(rc,data);
  recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);handler=new Handler(Looper.getMainLooper());running=true;
  projection.createVirtualDisplay("DustinBotOCR",w,h,d,DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,reader.getSurface(),null,handler);
  reader.setOnImageAvailableListener(r->{Image im=r.acquireLatestImage();if(im==null)return; process(im,w,h);},handler);
 }
 void process(Image im,int w,int h){
  Image.Plane p=im.getPlanes()[0]; InputImage input=InputImage.fromMediaImage(im,0); recognizer.process(input).addOnSuccessListener(result->{
   long now=System.currentTimeMillis(); if(now-lastTap<900)return;
   for(Text.TextBlock b:result.getTextBlocks())for(Text.Line line:b.getLines()){
    String raw=line.getText();String key=MonsterDatabase.norm(raw);if(key.length()<3)continue;
    for(String target:targets){String tk=MonsterDatabase.norm(target);if(tk.length()>=3 && (key.equals(tk)||key.contains(tk)||tk.contains(key))){Rect box=line.getBoundingBox();if(box!=null){float x=box.centerX(),y=box.centerY();if(BotAccessibilityService.tap(x,y)){lastTap=now;lastHit=raw;MainActivity.postStatus("พบ "+raw+" → แตะ "+(int)x+","+(int)y);return;}}}
    }
   }
  }).addOnCompleteListener(x->im.close());
 }
 void createChannel(){NotificationManager nm=getSystemService(NotificationManager.class);nm.createNotificationChannel(new NotificationChannel("dustinbot_capture","DustinBot Capture",NotificationManager.IMPORTANCE_LOW));}
 @Override public void onDestroy(){running=false;try{if(reader!=null)reader.close();if(projection!=null)projection.stop();if(recognizer!=null)recognizer.close();}catch(Exception e){}super.onDestroy();}
 @Override public IBinder onBind(Intent i){return null;}
}
EOF
          cat > app/src/main/java/com/dustinbot/v1/MainActivity.java <<'EOF'
package com.dustinbot.v1;

import android.app.*;import android.content.*;import android.graphics.Color;import android.media.projection.MediaProjectionManager;import android.net.Uri;import android.os.*;import android.provider.Settings;import android.view.*;import android.widget.*;import java.util.*;

public class MainActivity extends Activity {
 static MainActivity instance; MonsterDatabase db; LinearLayout list; EditText search; TextView status; ArrayList<MonsterDatabase.M> selected=new ArrayList<>();
 int dp(int x){return (int)(x*getResources().getDisplayMetrics().density+.5f);} TextView t(String s,int z){TextView v=new TextView(this);v.setText(s);v.setTextColor(Color.WHITE);v.setTextSize(z);v.setPadding(dp(8),dp(8),dp(8),dp(8));return v;}
 @Override public void onCreate(Bundle b){super.onCreate(b);instance=this;db=new MonsterDatabase(this);build();}
 void build(){
  LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setPadding(dp(14),dp(10),dp(14),dp(20));r.setBackgroundColor(Color.rgb(7,17,31));
  TextView title=t("DustinBot OCR V1",26);title.setTextColor(Color.rgb(80,170,255));r.addView(title);r.addView(t("Rune Classic • อ่านชื่อ Monster จากหน้าจอจริง",14));
  status=t("สถานะ: READY\nMonster DB: "+db.search("").size(),15);r.addView(status);
  Button acc=new Button(this);acc.setText("1. เปิด Accessibility (จำเป็นสำหรับแตะเป้าหมาย)");acc.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));r.addView(acc);
  Button cap=new Button(this);cap.setText("2. เริ่มจับหน้าจอ + ตรวจ Monster");cap.setOnClickListener(v->requestCapture());r.addView(cap);
  search=new EditText(this);search.setHint("พิมพ์ชื่อ เช่น Poring");search.setTextColor(Color.WHITE);search.setHintTextColor(Color.GRAY);r.addView(search);
  Button find=new Button(this);find.setText("ค้นหา Monster");find.setOnClickListener(v->render());r.addView(find);
  list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);r.addView(list);
  Button stop=new Button(this);stop.setText("หยุดบอท");stop.setOnClickListener(v->stopService(new Intent(this,CaptureService.class)));r.addView(stop);
  ScrollView sv=new ScrollView(this);sv.addView(r);setContentView(sv);render();
 }
 void render(){list.removeAllViews();String q=search.getText().toString();int n=0;for(MonsterDatabase.M m:db.search(q)){CheckBox c=new CheckBox(this);c.setText(m.name+" ["+m.id+"]");c.setTextColor(Color.WHITE);c.setChecked(selected.contains(m));c.setOnCheckedChangeListener((b,x)->{if(x&&!selected.contains(m))selected.add(m);if(!x)selected.remove(m);});list.addView(c);if(++n>=100)break;}}
 void requestCapture(){if(selected.isEmpty()){status.setText("สถานะ: เลือก Monster ก่อน เช่น Poring");return;}ArrayList<String> names=new ArrayList<>();for(MonsterDatabase.M m:selected)names.add(m.name);CaptureService.targets=new HashSet<>(names);MediaProjectionManager m=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);startActivityForResult(m.createScreenCaptureIntent(),9001);}
 @Override protected void onActivityResult(int req,int res,Intent data){super.onActivityResult(req,res,data);if(req==9001&&res==RESULT_OK){Intent i=new Intent(this,CaptureService.class);i.putExtra(CaptureService.EXTRA_RESULT,res);i.putExtra(CaptureService.EXTRA_DATA,data);startForegroundService(i);status.setText("สถานะ: กำลังหา "+CaptureService.targets);}}
 static void postStatus(String s){if(instance!=null)instance.runOnUiThread(()->instance.status.setText("สถานะ: "+s));}
}
EOF
          cat > app/src/main/java/com/dustinbot/v1/MonsterDatabase.java <<'EOF'
package com.dustinbot.v1;
import android.content.Context; import org.json.*; import java.io.*; import java.util.*;
public class MonsterDatabase {
 public static class M { public int id; public String name,code; M(int i,String n,String c){id=i;name=n;code=c;} }
 private final ArrayList<M> list=new ArrayList<>();
 public MonsterDatabase(Context c){try(InputStream in=c.getAssets().open("monster_database.json")){byte[] b=new byte[in.available()];in.read(b);JSONArray a=new JSONObject(new String(b,"UTF-8")).getJSONArray("monsters");for(int i=0;i<a.length();i++){JSONObject o=a.getJSONObject(i);list.add(new M(o.optInt("id"),o.optString("name"),o.optString("code")));}}catch(Exception e){}}
 public ArrayList<M> search(String q){ArrayList<M> r=new ArrayList<>();String x=q==null?"":q.trim().toLowerCase(Locale.US);for(M m:list)if(x.isEmpty()||m.name.toLowerCase(Locale.US).contains(x)||m.code.toLowerCase(Locale.US).contains(x)||String.valueOf(m.id).equals(x))r.add(m);return r;}
 public M find(String name){String x=norm(name);M best=null;for(M m:list){String n=norm(m.name);if(n.equals(x))return m;if(n.contains(x)||x.contains(n))best=m;}return best;}
 public static String norm(String s){return s.toLowerCase(Locale.US).replaceAll("[^a-z0-9]","");}
}
EOF

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-RuneClassic-OCR-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
