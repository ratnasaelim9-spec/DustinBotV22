name: Build DustinBot V11 - Rune Classic

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate V11 project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname "build.gradle")"
          cat > "build.gradle" <<'__V11_EOF__'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          __V11_EOF__

          mkdir -p "$(dirname "settings.gradle")"
          cat > "settings.gradle" <<'__V11_EOF__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'DustinBotV11'
          include ':app'

          __V11_EOF__

          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'__V11_EOF__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true

          __V11_EOF__

          mkdir -p "$(dirname "app/build.gradle")"
          cat > "app/build.gradle" <<'__V11_EOF__'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.dustinbot.v11'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v11'
                  minSdk 26
                  targetSdk 35
                  versionCode 11
                  versionName '11.0'
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'__V11_EOF__'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application android:allowBackup="false" android:label="@string/app_name" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          cat > "app/src/main/res/values/strings.xml" <<'__V11_EOF__'
          <resources>
              <string name="app_name">DustinBot V11</string>
              <string name="accessibility_description">DustinBot V11 accessibility controller for Rune Classic</string>
              <string name="capture_description">DustinBot V11 screen capture service</string>
          </resources>

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/res/values/themes.xml")"
          cat > "app/src/main/res/values/themes.xml" <<'__V11_EOF__'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/res/xml/accessibility_service_config.xml")"
          cat > "app/src/main/res/xml/accessibility_service_config.xml" <<'__V11_EOF__'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true" />

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/BotAccessibilityService.java")"
          cat > "app/src/main/java/com/dustinbot/v11/BotAccessibilityService.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class BotAccessibilityService extends AccessibilityService {
              public static volatile BotAccessibilityService instance;
              @Override protected void onServiceConnected(){ super.onServiceConnected(); instance=this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}

              public AccessibilityNodeInfo getRootNode() {
                  return getRootInActiveWindow();
              }
              @Override public void onInterrupt() { instance=null; }
              public static boolean tap(float x,float y){
                  BotAccessibilityService s=instance; if(s==null) return false;
                  Path p=new Path(); p.moveTo(x,y);
                  GestureDescription g=new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p,0,70)).build();
                  return s.dispatchGesture(g,null,null);
              }
              public static boolean swipe(float x1,float y1,float x2,float y2,long duration){
                  BotAccessibilityService s=instance; if(s==null) return false;
                  Path p=new Path(); p.moveTo(x1,y1); p.lineTo(x2,y2);
                  GestureDescription g=new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p,0,duration)).build();
                  return s.dispatchGesture(g,null,null);
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/CaptureService.java")"
          cat > "app/src/main/java/com/dustinbot/v11/CaptureService.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.media.projection.MediaProjection;
          import android.os.IBinder;

          /** Screen-capture host. The actual frame analyzer is intentionally isolated in MapScanner. */
          public class CaptureService extends Service {
              public static volatile MediaProjection projection;
              @Override public int onStartCommand(Intent intent,int flags,int startId){
                  createChannel();
                  startForeground(1101, new Notification.Builder(this,"dustinbot_capture")
                      .setContentTitle("DustinBot V11")
                      .setContentText("Screen capture ready")
                      .setSmallIcon(android.R.drawable.ic_menu_view).build());
                  return START_NOT_STICKY;
              }
              private void createChannel(){
                  NotificationManager nm=getSystemService(NotificationManager.class);
                  if(nm!=null) nm.createNotificationChannel(new NotificationChannel("dustinbot_capture","DustinBot Capture",NotificationManager.IMPORTANCE_LOW));
              }
              @Override public IBinder onBind(Intent i){return null;}
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MainActivity.java")"
          cat > "app/src/main/java/com/dustinbot/v11/MainActivity.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.*;
          import java.util.List;

          public class MainActivity extends Activity {
              private MonsterDatabase db;
              private TargetSelector selector;
              private BotController controller;
              private LinearLayout list;
              private TextView status, live;
              private EditText search;
              private List<Monster> current;

              int dp(int v){return (int)(v*getResources().getDisplayMetrics().density+.5f);}
              TextView text(String s,int size){ TextView t=new TextView(this); t.setText(s); t.setTextSize(size); t.setTextColor(Color.WHITE); t.setPadding(dp(10),dp(8),dp(10),dp(8)); return t; }
              Button button(String s){ Button b=new Button(this); b.setText(s); return b; }

              @Override public void onCreate(Bundle b){
                  super.onCreate(b);
                  db=new MonsterDatabase(this);
                  selector=new TargetSelector();
                  controller=new BotController(db, selector);
                  controller.setListener(new BotController.Listener(){
                      @Override public void onScan(String map,List<MapScanner.DetectedMonster> found,MapScanner.DetectedMonster target){
                          StringBuilder s=new StringBuilder();
                          s.append("Map: ").append(map).append("\n");
                          s.append("ตรวจพบ Monster: ").append(found.size());
                          if(target!=null) s.append("\nเป้าหมาย: ID ").append(target.id)
                                  .append(" @ ").append(Math.round(target.x)).append(",").append(Math.round(target.y));
                          else if(!selector.selectedIds().isEmpty()) s.append("\nยังไม่พบเป้าหมายที่เลือก");
                          live.setText(s.toString());
                      }
                      @Override public void onError(String message){ live.setText("Scanner error: "+message); }
                  });
                  build();
              }

              void build(){
                  ScrollView sv=new ScrollView(this);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(12),dp(10),dp(12),dp(20));
                  root.setBackgroundColor(Color.rgb(7,17,31));

                  TextView title=text("DustinBot V11",28); title.setTextColor(Color.rgb(80,170,255)); root.addView(title);
                  TextView sub=text("Rune Classic • Map Scanner + Monster Database",14); root.addView(sub);
                  status=text("สถานะ: READY\nMonster Database: "+db.all().size()+" entries",15); root.addView(status);

                  Button acc=button("1. เปิด Accessibility");
                  acc.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))); root.addView(acc);
                  Button overlay=button("2. เปิด Overlay");
                  overlay.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:"+getPackageName())))); root.addView(overlay);

                  TextView map=text("MAP SCANNER",18); map.setTextColor(Color.rgb(100,190,255)); root.addView(map);
                  live=text("Map: ยังไม่สแกน\nตรวจพบ Monster: 0",15); live.setBackgroundColor(Color.rgb(16,31,50)); root.addView(live);

                  LinearLayout scanButtons=new LinearLayout(this); scanButtons.setGravity(Gravity.CENTER); 
                  Button scan=button("SCAN NOW"); scan.setOnClickListener(v->{ if(!controller.isRunning()){controller.start(); status.setText("สถานะ: SCANNING");} }); scanButtons.addView(scan);
                  Button stop=button("STOP SCAN"); stop.setOnClickListener(v->{controller.stop(); status.setText("สถานะ: STOP");}); scanButtons.addView(stop);
                  root.addView(scanButtons);

                  TextView mt=text("เลือก Monster เป้าหมาย",18); mt.setTextColor(Color.rgb(100,190,255)); root.addView(mt);
                  search=new EditText(this); search.setHint("ค้นชื่อ / ID Monster"); search.setTextColor(Color.WHITE); search.setHintTextColor(Color.GRAY); root.addView(search);
                  Button find=button("ค้นหา"); find.setOnClickListener(v->render(search.getText().toString())); root.addView(find);
                  list=new LinearLayout(this); list.setOrientation(LinearLayout.VERTICAL); root.addView(list);
                  Button clear=button("ล้างเป้าหมาย"); clear.setOnClickListener(v->{selector.clear(); render(search.getText().toString());}); root.addView(clear);

                  sv.addView(root); setContentView(sv); render("");
              }

              void render(String q){
                  list.removeAllViews(); current=db.search(q); int n=0;
                  for(Monster m:current){
                      CheckBox cb=new CheckBox(this); cb.setText(m.toString()); cb.setTextColor(Color.WHITE); cb.setTextSize(15); cb.setChecked(selector.accepts(m.id));
                      cb.setOnCheckedChangeListener((b,c)->selector.setSelected(m.id,c)); list.addView(cb); if(++n>=120) break;
                  }
                  if(current.size()>120){ TextView more=text("แสดง 120 รายการแรก — ใช้ช่องค้นหาเพื่อหา Monster เพิ่มเติม",13); list.addView(more); }
              }

              @Override protected void onDestroy(){
                  if(controller!=null) controller.stop();
                  super.onDestroy();
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MapScanner.java")"
          cat > "app/src/main/java/com/dustinbot/v11/MapScanner.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          /**
           * Runtime map/mob detection boundary. V11 deliberately keeps this separate
           * from the UI so OCR/image recognition or a verified game-data adapter can be
           * added without changing TargetSelector or Combat.
           */
          public interface MapScanner {
              String currentMap();
              java.util.List<DetectedMonster> scan();

              final class DetectedMonster {
                  public final int id; public final float x; public final float y; public final float distance;
                  public DetectedMonster(int id,float x,float y,float distance){this.id=id;this.x=x;this.y=y;this.distance=distance;}
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/Monster.java")"
          cat > "app/src/main/java/com/dustinbot/v11/Monster.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          public final class Monster {
              public final int id;
              public final String code;
              public final String name;
              public Monster(int id, String code, String name) { this.id=id; this.code=code; this.name=name; }
              @Override public String toString() { return name + "  (ID: " + id + ")"; }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/MonsterDatabase.java")"
          cat > "app/src/main/java/com/dustinbot/v11/MonsterDatabase.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.content.Context;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          public final class MonsterDatabase {
              private final List<Monster> monsters = new ArrayList<>();
              public MonsterDatabase(Context c) {
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(c.getAssets().open("monster_database.json")))) {
                      StringBuilder s = new StringBuilder(); String line;
                      while ((line=r.readLine())!=null) s.append(line);
                      JSONArray a = new JSONObject(s.toString()).getJSONArray("monsters");
                      for (int i=0;i<a.length();i++) {
                          JSONObject o=a.getJSONObject(i);
                          monsters.add(new Monster(o.getInt("id"),o.getString("code"),o.getString("name")));
                      }
                  } catch (Exception ignored) {}
              }
              public List<Monster> all() { return new ArrayList<>(monsters); }
              public List<Monster> search(String q) {
                  if (q==null || q.trim().isEmpty()) return all();
                  String x=q.toLowerCase(); List<Monster> out=new ArrayList<>();
                  for (Monster m:monsters) if (m.name.toLowerCase().contains(x)||m.code.toLowerCase().contains(x)||String.valueOf(m.id).equals(x)) out.add(m);
                  return out;
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/RuntimeScanner.java")"
          cat > "app/src/main/java/com/dustinbot/v11/RuntimeScanner.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.graphics.Rect;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /** First runtime adapter: reads visible game UI nodes when Rune Classic exposes text/accessibility bounds. */
          public final class RuntimeScanner implements MapScanner {
              private final MonsterDatabase db;
              private volatile String lastMap = "UNKNOWN";

              public RuntimeScanner(MonsterDatabase db) { this.db = db; }

              @Override public String currentMap() { return lastMap; }

              @Override public List<DetectedMonster> scan() {
                  ArrayList<DetectedMonster> out = new ArrayList<>();
                  BotAccessibilityService svc = BotAccessibilityService.instance;
                  if (svc == null) return out;
                  AccessibilityNodeInfo root = svc.getRootNode();
                  if (root == null) return out;
                  try {
                      walk(root, out);
                  } finally {
                      root.recycle();
                  }
                  return out;
              }

              private void walk(AccessibilityNodeInfo n, List<DetectedMonster> out) {
                  if (n == null) return;
                  CharSequence cs = n.getText();
                  if (cs != null) {
                      String text = cs.toString().trim();
                      if (!text.isEmpty()) {
                          String lower = text.toLowerCase(Locale.ROOT);
                          if (looksLikeMap(text)) lastMap = text;
                          Monster m = findMonster(text, lower);
                          if (m != null) {
                              Rect r = new Rect(); n.getBoundsInScreen(r);
                              if (!r.isEmpty()) {
                                  float x = r.centerX(), y = r.centerY();
                                  out.add(new DetectedMonster(m.id, x, y, 0f));
                              }
                          }
                      }
                  }
                  for (int i=0; i<n.getChildCount(); i++) walk(n.getChild(i), out);
              }

              private Monster findMonster(String text, String lower) {
                  for (Monster m : db.all()) {
                      String name = m.name == null ? "" : m.name.trim();
                      String code = m.code == null ? "" : m.code.trim();
                      if ((!name.isEmpty() && (text.equalsIgnoreCase(name) || lower.contains(name.toLowerCase(Locale.ROOT))))
                              || (!code.isEmpty() && lower.contains(code.toLowerCase(Locale.ROOT)))) return m;
                  }
                  return null;
              }

              private boolean looksLikeMap(String text) {
                  String x = text.toLowerCase(Locale.ROOT);
                  return x.contains("field") || x.contains("prontera") || x.contains("geffen")
                          || x.contains("payon") || x.contains("morocc") || x.contains("alberta")
                          || x.contains("izlude") || x.contains("comodo") || x.contains("map");
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/TargetSelector.java")"
          cat > "app/src/main/java/com/dustinbot/v11/TargetSelector.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public final class TargetSelector {
              private final Set<Integer> selected = new HashSet<>();
              public void setSelected(int id, boolean value) { if (value) selected.add(id); else selected.remove(id); }
              public boolean accepts(int id) { return selected.contains(id); }
              public Set<Integer> selectedIds() { return Collections.unmodifiableSet(selected); }
              public void clear() { selected.clear(); }

              /** Chooses the first selected detected monster. Distance can be used when a real map coordinate adapter is available. */
              public MapScanner.DetectedMonster choose(List<MapScanner.DetectedMonster> detected) {
                  MapScanner.DetectedMonster best = null;
                  for (MapScanner.DetectedMonster d : detected) {
                      if (!accepts(d.id)) continue;
                      if (best == null || d.distance < best.distance) best = d;
                  }
                  return best;
              }
          }

          __V11_EOF__

          mkdir -p "$(dirname "app/src/main/java/com/dustinbot/v11/BotController.java")"
          cat > "app/src/main/java/com/dustinbot/v11/BotController.java" <<'__V11_EOF__'
          package com.dustinbot.v11;

          import android.os.Handler;
          import android.os.Looper;
          import java.util.List;

          /** Runtime loop: scan -> filter selected target -> expose target position to UI/caller. */
          public final class BotController {
              public interface Listener {
                  void onScan(String map, List<MapScanner.DetectedMonster> detected, MapScanner.DetectedMonster target);
                  void onError(String message);
              }

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final RuntimeScanner scanner;
              private final TargetSelector selector;
              private Listener listener;
              private boolean running;

              public BotController(MonsterDatabase db, TargetSelector selector) {
                  this.scanner = new RuntimeScanner(db);
                  this.selector = selector;
              }

              public void setListener(Listener listener) { this.listener = listener; }
              public boolean isRunning() { return running; }

              public void start() {
                  if (running) return;
                  running = true;
                  tick();
              }

              public void stop() {
                  running = false;
                  handler.removeCallbacksAndMessages(null);
              }

              private void tick() {
                  if (!running) return;
                  try {
                      List<MapScanner.DetectedMonster> found = scanner.scan();
                      MapScanner.DetectedMonster target = selector.choose(found);
                      if (listener != null) listener.onScan(scanner.currentMap(), found, target);
                  } catch (Exception e) {
                      if (listener != null) listener.onError(e.getMessage() == null ? "scanner error" : e.getMessage());
                  }
                  handler.postDelayed(this::tick, 350);
              }
          }

          __V11_EOF__

          mkdir -p app/src/main/assets
          cat > /tmp/monster_database.json.gz.b64 <<'__DB_EOF__'
          
          __DB_EOF__
          base64 -d /tmp/monster_database.json.gz.b64 > /tmp/monster_database.json.gz
          gzip -dc /tmp/monster_database.json.gz > app/src/main/assets/monster_database.json
          python3 - <<'PY'
          import json
          p='app/src/main/assets/monster_database.json'
          with open(p,encoding='utf-8') as f:
              d=json.load(f)
          print("Monster database entries:", len(d.get("monsters", [])))
          PY


      - name: Validate V11
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/dustinbot/v11/MainActivity.java
          test -f app/src/main/java/com/dustinbot/v11/RuntimeScanner.java
          test -f app/src/main/assets/monster_database.json
          grep -q "versionName '11.0'" app/build.gradle
          echo "DUSTIN BOT V11 source validation OK"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11-RuneClassic
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
