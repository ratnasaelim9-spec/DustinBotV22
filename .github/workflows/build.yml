package com.dustinbot.v41;

import android.graphics.Bitmap;
import android.graphics.Color;

public class TemplateMatcher {

    public static class Result {

        public boolean found;

        public float score;

        public int centerX;

        public int centerY;

        public int width;

        public int height;
    }


    public static Result find(
            Bitmap screen,
            Bitmap template,
            float threshold) {


        Result result =
                new Result();


        if (screen == null ||
            template == null) {

            return result;
        }


        if (screen.isRecycled() ||
            template.isRecycled()) {

            return result;
        }


        int tw =
                Math.min(
                        72,
                        template.getWidth()
                );


        int th =
                Math.min(
                        72,
                        template.getHeight()
                );


        if (tw < 16 ||
            th < 16) {

            return result;
        }


        if (screen.getWidth() < tw ||
            screen.getHeight() < th) {

            return result;
        }


        Bitmap smallTemplate =
                Bitmap.createScaledBitmap(
                        template,
                        tw,
                        th,
                        false
                );


        int scanStep = 7;

        int featureStep = 4;


        double best =
                Double.MAX_VALUE;


        int bestX = 0;

        int bestY = 0;


        for (
                int y = 0;
                y <= screen.getHeight() - th;
                y += scanStep
        ) {


            for (
                    int x = 0;
                    x <= screen.getWidth() - tw;
                    x += scanStep
            ) {


                double total = 0;

                int count = 0;


                for (
                        int yy = featureStep;
                        yy < th - featureStep;
                        yy += featureStep
                ) {


                    for (
                            int xx = featureStep;
                            xx < tw - featureStep;
                            xx += featureStep
                    ) {


                        int tc =
                                smallTemplate.getPixel(
                                        xx,
                                        yy
                                );


                        int sc =
                                screen.getPixel(
                                        x + xx,
                                        y + yy
                                );


                        int tr =
                                Color.red(tc);

                        int tg =
                                Color.green(tc);

                        int tb =
                                Color.blue(tc);


                        int sr =
                                Color.red(sc);

                        int sg =
                                Color.green(sc);

                        int sb =
                                Color.blue(sc);


                        int colorDifference =
                                Math.abs(tr - sr) +
                                Math.abs(tg - sg) +
                                Math.abs(tb - sb);


                        int templateGray =
                                gray(tc);


                        int screenGray =
                                gray(sc);


                        int localDifference =
                                Math.abs(
                                        templateGray -
                                        screenGray
                                );


                        total +=
                                colorDifference * 0.35 +
                                localDifference * 0.65;


                        count++;
                    }
                }


                double score =
                        total /
                        Math.max(
                                1,
                                count
                        );


                if (score < best) {

                    best = score;

                    bestX = x;

                    bestY = y;
                }
            }
        }


        smallTemplate.recycle();


        result.score =
                (float) best;


        result.width = tw;

        result.height = th;


        result.centerX =
                bestX + tw / 2;


        result.centerY =
                bestY + th / 2;


        result.found =
                best <= threshold;


        return result;
    }


    private static int gray(
            int color) {

        return (
                Color.red(color) * 30 +
                Color.green(color) * 59 +
                Color.blue(color) * 11
        ) / 100;
    }
}
