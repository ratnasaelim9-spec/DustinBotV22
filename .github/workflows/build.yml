    private void openAccessibility() {

        try {

            Intent intent =
                    new Intent(
                            Settings.ACTION_ACCESSIBILITY_SETTINGS
                    );


            startActivity(
                    intent
            );

        } catch (Exception ignored) {
        }
    }


    private void openOverlaySettings() {

        try {

            Intent intent =
                    new Intent(
                            Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                            Uri.parse(
                                    "package:" +
                                    getPackageName()
                            )
                    );


            startActivity(
                    intent
            );

        } catch (Exception ignored) {
        }
    }


    private void requestScreenCapture() {

        MediaProjectionManager manager =
                (MediaProjectionManager)
                        getSystemService(
                                MEDIA_PROJECTION_SERVICE
                        );


        Intent intent =
                manager.createScreenCaptureIntent();


        startActivityForResult(
                intent,
                CAPTURE_REQUEST
        );
    }


    private void startOverlay() {

        Intent intent =
                new Intent(
                        this,
                        BotOverlayService.class
                );


        if (Build.VERSION.SDK_INT >= 26) {

            startForegroundService(
                    intent
            );

        } else {

            startService(
                    intent
            );
        }
    }


    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );


        if (requestCode ==
                CAPTURE_REQUEST &&
            resultCode ==
                RESULT_OK &&
            data != null) {


            Intent intent =
                    new Intent(
                            this,
                            CaptureService.class
                    );


            intent.putExtra(
                    "resultCode",
                    resultCode
            );


            intent.putExtra(
                    "data",
                    data
            );


            if (Build.VERSION.SDK_INT >= 26) {

                startForegroundService(
                        intent
                );

            } else {

                startService(
                        intent
                );
            }
        }
    }
}
