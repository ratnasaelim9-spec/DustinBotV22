name: Build DustinBot V7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/dustinbot/v7
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV7"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v7'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v7'
                  minSdk 26
                  targetSdk 35
                  versionCode 70
                  versionName '7.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DustinBot V7</string>
              <string name="accessibility_description">DustinBot V7</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v7/MainActivity.java <<'EOF'
          package com.dustinbot.v7;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

              TextView status;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30,30,30,30);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("DUSTINBOT V7");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "\nเดิน → เกมล็อกเป้าเอง → ตี → เก็บของ → เดินต่อ\n\n" +
                      "ไม่ค้นหา Monster\n" +
                      "ไม่ล็อก Monster เอง"
                  );
                  info.setTextSize(17);
                  info.setTextColor(Color.DKGRAY);
                  info.setGravity(Gravity.CENTER);
                  root.addView(info);

                  status = new TextView(this);
                  status.setText("\nสถานะ: READY");
                  status.setTextSize(18);
                  status.setTextColor(Color.BLACK);
                  status.setGravity(Gravity.CENTER);
                  root.addView(status);

                  Button access = new Button(this);
                  access.setText("เปิด ACCESSIBILITY");
                  access.setOnClickListener(v ->
                      startActivity(
                          new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      )
                  );
                  root.addView(access);

                  Button start = new Button(this);
                  start.setText("START BOT");
                  start.setOnClickListener(v -> {

                      if (BotAccessibilityService.instance == null) {
                          status.setText(
                              "สถานะ: กรุณาเปิด ACCESSIBILITY ก่อน"
                          );
                          return;
                      }

                      BotAccessibilityService.instance.startBot();

                      status.setText(
                          "BOT RUNNING\n\n" +
                          "เดิน → ตี → เก็บของ → เดินต่อ"
                      );
                  });
                  root.addView(start);

                  Button stop = new Button(this);
                  stop.setText("STOP BOT");
                  stop.setOnClickListener(v -> {

                      if (BotAccessibilityService.instance != null) {
                          BotAccessibilityService.instance.stopBot();
                      }

                      status.setText("สถานะ: STOP");
                  });
                  root.addView(stop);

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v7/BotAccessibilityService.java <<'EOF'
          package com.dustinbot.v7;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService extends AccessibilityService {

              public static volatile BotAccessibilityService instance;

              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private volatile boolean running = false;

              private boolean right = true;

              private int cycle = 0;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
                  stopBot();
              }

              public void startBot() {

                  if (running) return;

                  running = true;
                  cycle = 0;
                  right = true;

                  loop();
              }

              public void stopBot() {

                  running = false;

                  handler.removeCallbacksAndMessages(null);
              }

              public boolean isBotRunning() {
                  return running;
              }

              private void loop() {

                  if (!running) return;

                  /*
                   * ค่าทดสอบ
                   *
                   * MOVE   = ปุ่ม/จุดควบคุมการเดิน
                   * ATTACK = ปุ่มโจมตี
                   * LOOT   = ปุ่มเก็บของ
                   */

                  final float MOVE_X = 360;
                  final float MOVE_Y = 1450;

                  final float ATTACK_X = 650;
                  final float ATTACK_Y = 1350;

                  final float LOOT_X = 360;
                  final float LOOT_Y = 1450;

                  float endX =
                      right
                      ? MOVE_X + 220
                      : MOVE_X - 220;

                  // เดิน
                  swipe(
                      MOVE_X,
                      MOVE_Y,
                      endX,
                      MOVE_Y,
                      1000
                  );

                  handler.postDelayed(() -> {

                      if (!running) return;

                      // ตี
                      tap(ATTACK_X, ATTACK_Y);

                      handler.postDelayed(() -> {

                          if (!running) return;

                          tap(ATTACK_X, ATTACK_Y);

                          handler.postDelayed(() -> {

                              if (!running) return;

                              tap(ATTACK_X, ATTACK_Y);

                              // รอ
                              handler.postDelayed(() -> {

                                  if (!running) return;

                                  // เก็บของ
                                  tap(LOOT_X, LOOT_Y);

                                  handler.postDelayed(() -> {

                                      if (!running) return;

                                      cycle++;

                                      if (cycle >= 3) {
                                          cycle = 0;
                                          right = !right;
                                      }

                                      // เดินต่อ
                                      loop();

                                  }, 700);

                              }, 700);

                          }, 450);

                      }, 450);

                  }, 900);
              }

              public boolean tap(float x, float y) {

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  80
                              )
                          )
                          .build();

                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public boolean swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                              )
                          )
                          .build();

                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              @Override
              public void onDestroy() {

                  stopBot();

                  instance = null;

                  super.onDestroy();
              }
          }
          EOF


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace


      # ==========================================
      # CHECK APK
      # ==========================================

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # APK ARTIFACT
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: DustinBot-V7-APK

          path: app/build/outputs/apk/debug/app-debug.apk
