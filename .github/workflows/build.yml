name: Build DustinBot V7

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout

        uses: actions/checkout@v4


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java

        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # CREATE PROJECT
      # =========================================================

      - name: Create Android Project

        shell: bash

        run: |

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v7
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


          # =====================================================
          # settings.gradle
          # =====================================================

          cat > settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name =
              "DustinBotV7"


          include(":app")

          EOF


          # =====================================================
          # build.gradle
          # =====================================================

          cat > build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
                  version '8.6.1'
                  apply false

          }

          EOF


          # =====================================================
          # gradle.properties
          # =====================================================

          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          EOF


          # =====================================================
          # APP BUILD
          # =====================================================

          cat > app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.dustinbot.v7'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.dustinbot.v7'

                  minSdk 26

                  targetSdk 35

                  versionCode 70

                  versionName '7.0'

              }

          }

          EOF


          # =====================================================
          # STRINGS
          # =====================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'

          <resources>

              <string name="app_name">
                  DustinBot V7
              </string>

              <string name="accessibility_description">
                  DustinBot V7
              </string>

          </resources>

          EOF


          # =====================================================
          # THEME
          # =====================================================

          cat > app/src/main/res/values/themes.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

              </style>

          </resources>

          EOF


          # =====================================================
          # ACCESSIBILITY CONFIG
          # =====================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service

              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              />

          EOF


          # =====================================================
          # MANIFEST
          # =====================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <application

                  android:allowBackup="false"

                  android:label="@string/app_name"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>


                  </activity>


                  <service

                      android:name=".BotAccessibilityService"

                      android:permission=
                      "android.permission.BIND_ACCESSIBILITY_SERVICE"

                      android:exported="false">


                      <intent-filter>

                          <action
                              android:name=
                              "android.accessibilityservice.AccessibilityService"/>

                      </intent-filter>


                      <meta-data

                          android:name=
                          "android.accessibilityservice"

                          android:resource=
                          "@xml/accessibility_service_config"/>


                  </service>


              </application>


          </manifest>

          EOF


          # =====================================================
          # MAIN ACTIVITY
          # =====================================================

          cat > app/src/main/java/com/dustinbot/v7/MainActivity.java <<'EOF'

          package com.dustinbot.v7;


          import android.app.Activity;

          import android.content.Intent;

          import android.graphics.Color;

          import android.os.Bundle;

          import android.provider.Settings;

          import android.view.Gravity;

          import android.widget.Button;

          import android.widget.LinearLayout;

          import android.widget.TextView;


          public class MainActivity
                  extends Activity {


              private TextView status;


              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {


                  super.onCreate(
                      savedInstanceState
                  );


                  LinearLayout root =
                      new LinearLayout(this);


                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );


                  root.setGravity(
                      Gravity.CENTER_HORIZONTAL
                  );


                  root.setPadding(
                      30,
                      30,
                      30,
                      30
                  );


                  root.setBackgroundColor(
                      Color.WHITE
                  );


                  TextView title =
                      new TextView(this);


                  title.setText(
                      "DUSTINBOT V7"
                  );


                  title.setTextSize(
                      28
                  );


                  title.setTextColor(
                      Color.BLACK
                  );


                  title.setGravity(
                      Gravity.CENTER
                  );


                  root.addView(
                      title
                  );


                  TextView info =
                      new TextView(this);


                  info.setText(
                      "\n" +

                      "เดิน → ล็อกเป้าโดยเกม → ตี → " +
                      "เก็บของ → เดินต่อ\n\n" +

                      "โหมด CONTINUOUS\n\n" +

                      "ไม่ค้นหา Monster\n" +

                      "ไม่ล็อก Monster เอง"
                  );


                  info.setTextSize(
                      17
                  );


                  info.setTextColor(
                      Color.DKGRAY
                  );


                  info.setGravity(
                      Gravity.CENTER
                  );


                  root.addView(
                      info
                  );


                  status =
                      new TextView(this);


                  status.setText(
                      "สถานะ: READY"
                  );


                  status.setTextSize(
                      18
                  );


                  status.setTextColor(
                      Color.BLACK
                  );


                  status.setGravity(
                      Gravity.CENTER
                  );


                  root.addView(
                      status
                  );


                  Button access =
                      new Button(this);


                  access.setText(
                      "1. เปิด ACCESSIBILITY"
                  );


                  access.setOnClickListener(
                      v -> {

                          Intent i =
                              new Intent(
                                  Settings
                                  .ACTION_ACCESSIBILITY_SETTINGS
                              );


                          startActivity(i);

                      }
                  );


                  root.addView(
                      access
                  );


                  Button start =
                      new Button(this);


                  start.setText(
                      "2. START BOT"
                  );


                  start.setOnClickListener(
                      v -> {


                          if (
                              BotAccessibilityService
                              .instance == null
                          ) {


                              status.setText(
                                  "กรุณาเปิด ACCESSIBILITY ก่อน"
                              );


                              return;

                          }


                          BotAccessibilityService
                              .instance
                              .startBot();


                          status.setText(
                              "BOT RUNNING\n\n" +

                              "เดิน → ตี → เก็บ → เดิน"
                          );

                      }
                  );


                  root.addView(
                      start
                  );


                  Button stop =
                      new Button(this);


                  stop.setText(
                      "3. STOP BOT"
                  );


                  stop.setOnClickListener(
                      v -> {


                          if (
                              BotAccessibilityService
                              .instance != null
                          ) {


                              BotAccessibilityService
                                  .instance
                                  .stopBot();

                          }


                          status.setText(
                              "สถานะ: STOP"
                          );

                      }
                  );


                  root.addView(
                      stop
                  );


                  setContentView(
                      root
                  );

              }


              @Override

              protected void onResume() {

                  super.onResume();


                  if (
                      BotAccessibilityService
                      .instance == null
                  ) {

                      status.setText(
                          "สถานะ: ACCESSIBILITY OFF"
                      );

                  }

              }

          }

          EOF


          # =====================================================
          # BOT ACCESSIBILITY SERVICE
          # =====================================================

          cat > app/src/main/java/com/dustinbot/v7/BotAccessibilityService.java <<'EOF'

          package com.dustinbot.v7;


          import android.accessibilityservice.AccessibilityService;

          import android.accessibilityservice.GestureDescription;

          import android.graphics.Path;

          import android.os.Handler;

          import android.os.Looper;

          import android.view.Display;

          import android.view.WindowManager;

          import android.view.accessibility.AccessibilityEvent;


          public class BotAccessibilityService
                  extends AccessibilityService {


              public static volatile
              BotAccessibilityService instance;


              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );


              private volatile boolean running =
                  false;


              private boolean moveRight =
                  true;


              private int cycle =
                  0;


              @Override

              protected void onServiceConnected() {


                  super.onServiceConnected();


                  instance =
                      this;

              }


              @Override

              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  /*
                   *
                   * ไม่ใช้ Event
                   * เพื่อค้นหา Monster
                   *
                   * เกมเป็นคนล็อกเป้า
                   *
                   */

              }


              @Override

              public void onInterrupt() {

                  stopBot();

              }


              // =================================================
              // START
              // =================================================

              public void startBot() {


                  if (running) {

                      return;

                  }


                  running =
                      true;


                  cycle =
                      0;


                  moveRight =
                      true;


                  botLoop();

              }


              // =================================================
              // STOP
              // =================================================

              public void stopBot() {


                  running =
                      false;


                  handler.removeCallbacksAndMessages(
                      null
                  );

              }


              // =================================================
              // STATUS
              // =================================================

              public boolean isBotRunning() {

                  return running;

              }


              // =================================================
              // GET SCREEN SIZE
              // =================================================

              private int screenWidth() {


                  WindowManager wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );


                  Display display =
                      wm.getDefaultDisplay();


                  android.graphics.Point p =
                      new android.graphics.Point();


                  display.getRealSize(p);


                  return p.x;

              }


              private int screenHeight() {


                  WindowManager wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );


                  Display display =
                      wm.getDefaultDisplay();


                  android.graphics.Point p =
                      new android.graphics.Point();


                  display.getRealSize(p);


                  return p.y;

              }


              // =================================================
              // BOT LOOP
              // =================================================

              private void botLoop() {


                  if (!running) {

                      return;

                  }


                  int w =
                      screenWidth();


                  int h =
                      screenHeight();


                  /*
                   *
                   * หน้าจอ Dustin RO เป็นแนวนอน
                   *
                   * ใช้เปอร์เซ็นต์แทน Pixel
                   *
                   */


                  // ---------------------------------------------
                  // JOYSTICK
                  // ---------------------------------------------

                  float moveX =
                      w * 0.115f;


                  float moveY =
                      h * 0.79f;


                  // ---------------------------------------------
                  // ATTACK
                  // ---------------------------------------------

                  float attackX =
                      w * 0.82f;


                  float attackY =
                      h * 0.79f;


                  // ---------------------------------------------
                  // LOOT HAND
                  // ---------------------------------------------

                  float lootX =
                      w * 0.165f;


                  float lootY =
                      h * 0.79f;


                  // =================================================
                  // WALK
                  // =================================================


                  float directionX;


                  if (moveRight) {

                      directionX =
                          w * 0.25f;

                  } else {

                      directionX =
                          w * 0.02f;

                  }


                  swipe(

                      moveX,

                      moveY,

                      directionX,

                      moveY,

                      1300

                  );


                  // =================================================
                  // ATTACK
                  // =================================================


                  handler.postDelayed(

                      () -> {


                          if (!running) {

                              return;

                          }


                          tap(

                              attackX,

                              attackY

                          );


                          handler.postDelayed(

                              () -> {


                                  if (!running) {

                                      return;

                                  }


                                  tap(

                                      attackX,

                                      attackY

                                  );


                                  handler.postDelayed(

                                      () -> {


                                          if (!running) {

                                              return;

                                          }


                                          tap(

                                              attackX,

                                              attackY

                                          );


                                          // =================================
                                          // WAIT
                                          // =================================

                                          handler.postDelayed(

                                              () -> {


                                                  if (!running) {

                                                      return;

                                                  }


                                                  // =========================
                                                  // LOOT
                                                  // =========================

                                                  tap(

                                                      lootX,

                                                      lootY

                                                  );


                                                  // =========================
                                                  // NEXT WALK
                                                  // =========================

                                                  handler.postDelayed(

                                                      () -> {


                                                          if (!running) {

                                                              return;

                                                          }


                                                          cycle++;


                                                          /*
                                                           *
                                                           * เปลี่ยนทิศ
                                                           * ทุก 6 รอบ
                                                           *
                                                           */

                                                          if (
                                                              cycle >= 6
                                                          ) {


                                                              cycle =
                                                                  0;


                                                              moveRight =
                                                                  !moveRight;

                                                          }


                                                          botLoop();


                                                      },

                                                      700

                                                  );


                                              },

                                              900

                                          );


                                      },

                                      500

                                  );


                              },

                              500

                          );


                      },

                      1200

                  );

              }


              // =================================================
              // TAP
              // =================================================

              private boolean tap(

                      float x,

                      float y

              ) {


                  if (!running) {

                      return false;

                  }


                  Path path =
                      new Path();


                  path.moveTo(
                      x,
                      y
                  );


                  GestureDescription gesture =

                      new GestureDescription.Builder()

                          .addStroke(

                              new GestureDescription
                                  .StrokeDescription(

                                      path,

                                      0,

                                      80

                                  )

                          )

                          .build();


                  return dispatchGesture(

                      gesture,

                      null,

                      null

                  );

              }


              // =================================================
              // SWIPE
              // =================================================

              private boolean swipe(

                      float x1,

                      float y1,

                      float x2,

                      float y2,

                      long duration

              ) {


                  if (!running) {

                      return false;

                  }


                  Path path =
                      new Path();


                  path.moveTo(

                      x1,

                      y1

                  );


                  path.lineTo(

                      x2,

                      y2

                  );


                  GestureDescription gesture =

                      new GestureDescription.Builder()

                          .addStroke(

                              new GestureDescription
                                  .StrokeDescription(

                                      path,

                                      0,

                                      duration

                                  )

                          )

                          .build();


                  return dispatchGesture(

                      gesture,

                      null,

                      null

                  );

              }


              // =================================================
              // DESTROY
              // =================================================

              @Override

              public void onDestroy() {


                  stopBot();


                  instance =
                      null;


                  super.onDestroy();

              }

          }

          EOF


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build APK

        shell: bash

        run: |

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace


      # =========================================================
      # VERIFY
      # =========================================================

      - name: Verify APK

        shell: bash

        run: |

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk


      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: DustinBot-V7-APK

          path:
            app/build/outputs/apk/debug/app-debug.apk
