name: Build DustinBot V5.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v51
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV51"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.dustinbot.v51"
              compileSdk 35

              defaultConfig {
                  applicationId "com.dustinbot.v51"
                  minSdk 26
                  targetSdk 35
                  versionCode 51
                  versionName "5.1"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="false"
                  android:label="DustinBot V5.1"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MainActivity$AccessService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".MainActivity$CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".MainActivity$VisionService"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v51/MainActivity.java <<'EOF'
          package com.dustinbot.v51;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.nio.ByteBuffer;
          import java.util.Locale;

          public class MainActivity extends Activity {

              static final int REQUEST_CAPTURE = 5101;

              int dp(int n) {
                  return (int)(n *
                      getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView text(String s, int size) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setPadding(
                      dp(10), dp(10),
                      dp(10), dp(10)
                  );
                  return v;
              }

              Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(l);
                  return b;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                      dp(12), dp(12),
                      dp(12), dp(24)
                  );

                  root.addView(text(
                      "DUSTIN BOT V5.1",
                      26
                  ));

                  root.addView(text(
                      "Vision Test / Target Lock",
                      18
                  ));

                  root.addView(text(
                      "ทดสอบ Screen Capture + Vision + Accessibility",
                      14
                  ));

                  root.addView(button(
                      "1. เปิด Accessibility",
                      v -> startActivity(
                          new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          )
                      )
                  ));

                  root.addView(button(
                      "2. เปิด Overlay",
                      v -> {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse(
                                  "package:" + getPackageName()
                              )
                          );
                          startActivity(i);
                      }
                  ));

                  root.addView(button(
                      "3. SCREEN CAPTURE",
                      v -> requestCapture()
                  ));

                  root.addView(button(
                      "4. START VISION",
                      v -> startVision()
                  ));

                  root.addView(button(
                      "5. SELECT MONSTER",
                      v -> {
                          startVision();

                          new Handler().postDelayed(() -> {
                              if (VisionService.instance != null) {
                                  VisionService.instance.selectTarget();
                              }
                          }, 500);
                      }
                  ));

                  root.addView(button(
                      "6. VISION START",
                      v -> {
                          startVision();

                          new Handler().postDelayed(() -> {
                              if (VisionService.instance != null) {
                                  VisionService.instance.startScan();
                              }
                          }, 500);
                      }
                  ));

                  root.addView(button(
                      "7. VISION STOP",
                      v -> {
                          if (VisionService.instance != null) {
                              VisionService.instance.stopScan();
                          }
                      }
                  ));

                  root.addView(text(
                      "วิธีทดสอบ\n\n" +
                      "1. เปิดเกม\n" +
                      "2. เปิด Accessibility\n" +
                      "3. เปิด Overlay\n" +
                      "4. กด SCREEN CAPTURE\n" +
                      "5. กด SELECT MONSTER\n" +
                      "6. แตะตัว Monster ในเกม\n" +
                      "7. กด VISION START\n\n" +
                      "ระบบจะค้นหาภาพ Monster ที่เลือก " +
                      "และแสดงกรอบตำแหน่งที่พบ",
                      14
                  ));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              void requestCapture() {
                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                          getSystemService(
                              MEDIA_PROJECTION_SERVICE
                          );

                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      REQUEST_CAPTURE
                  );
              }

              void startVision() {
                  Intent i = new Intent(
                      this,
                      VisionService.class
                  );

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(i);
                  } else {
                      startService(i);
                  }
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data) {

                  super.onActivityResult(
                      request,
                      result,
                      data
                  );

                  if (request != REQUEST_CAPTURE ||
                      result != RESULT_OK ||
                      data == null) {
                      return;
                  }

                  Intent i = new Intent(
                      this,
                      CaptureService.class
                  );

                  i.putExtra("resultCode", result);
                  i.putExtra("data", data);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(i);
                  } else {
                      startService(i);
                  }
              }

              public static class AccessService
                      extends AccessibilityService {

                  static volatile AccessService instance;

                  @Override
                  public void onServiceConnected() {
                      super.onServiceConnected();
                      instance = this;
                  }

                  public boolean tap(
                          float x,
                          float y) {

                      Path path = new Path();
                      path.moveTo(x, y);

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              60
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      return dispatchGesture(
                          gesture,
                          null,
                          null
                      );
                  }

                  public boolean swipe(
                          float x1,
                          float y1,
                          float x2,
                          float y2,
                          long duration) {

                      Path path = new Path();
                      path.moveTo(x1, y1);
                      path.lineTo(x2, y2);

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              duration
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      return dispatchGesture(
                          gesture,
                          null,
                          null
                      );
                  }

                  @Override
                  public void
