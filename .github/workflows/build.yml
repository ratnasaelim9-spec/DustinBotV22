name: Build DustinBot V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV3"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v2'
                  minSdk 26
                  targetSdk 35
                  versionCode 30
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Dustin Bot V3</string>
              <string name="accessibility_description">Dustin Bot V3 Accessibility</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>

                  </service>

                  <service
                      android:name=".BotOverlayService"
                      android:exported="false"/>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v2/BotAccessibilityService.java <<'EOF'
          package com.dustinbot.v2;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService
                  extends AccessibilityService {

              public static volatile BotAccessibilityService instance;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  if (instance == this) {
                      instance = null;
                  }
                  super.onDestroy();
              }

              public boolean tap(float x, float y) {

                  if (instance == null) {
                      return false;
                  }

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  80))
                          .build();

                  return dispatchGesture(
                      gesture,
                      null,
                      null);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/CaptureService.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;

          import java.nio.ByteBuffer;

          public class CaptureService extends Service {

              public static volatile Bitmap latest;

              private MediaProjection projection;
              private VirtualDisplay display;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler handler;

              private static final String CHANNEL =
                  "dustin_capture";

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  createChannel();

                  Notification notification =
                      new Notification.Builder(
                          this,
                          CHANNEL)
                          .setContentTitle(
                              "Dustin Bot V3")
                          .setContentText(
                              "Screen Capture Active")
                          .setSmallIcon(
                              android.R.drawable.ic_menu_view)
                          .build();

                  startForeground(
                      20,
                      notification);

                  if (projection == null &&
                      intent != null) {

                      int resultCode =
                          intent.getIntExtra(
                              "resultCode",
                              0);

                      Intent data =
                          intent.getParcelableExtra(
                              "data");

                      if (data != null) {

                          MediaProjectionManager manager =
                              (MediaProjectionManager)
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE);

                          projection =
                              manager.getMediaProjection(
                                  resultCode,
                                  data);

                          if (projection != null) {
                              startCapture();
                          }
                      }
                  }

                  return START_NOT_STICKY;
              }

              private void startCapture() {

                  DisplayMetrics dm =
                      getResources()
                          .getDisplayMetrics();

                  final int width =
                      dm.widthPixels;

                  final int height =
                      dm.heightPixels;

                  final int density =
                      dm.densityDpi;

                  thread =
                      new HandlerThread(
                          "DustinCapture");

                  thread.start();

                  handler =
                      new Handler(
                          thread.getLooper());

                  reader =
                      ImageReader.newInstance(
                          width,
                          height,
                          android.graphics.PixelFormat.RGBA_8888,
                          2);

                  projection.registerCallback(
                      new MediaProjection.Callback() {

                          @Override
                          public void onStop() {
                              stopCapture();
                          }

                      },
                      handler);

                  reader.setOnImageAvailableListener(
                      r -> {

                          Image image = null;

                          try {

                              image =
                                  r.acquireLatestImage();

                              if (image == null) {
                                  return;
                              }

                              Image.Plane plane =
                                  image.getPlanes()[0];

                              ByteBuffer buffer =
                                  plane.getBuffer();

                              int pixelStride =
                                  plane.getPixelStride();

                              int rowStride =
                                  plane.getRowStride();

                              int rowPadding =
                                  rowStride -
                                  pixelStride * width;

                              Bitmap full =
                                  Bitmap.createBitmap(
                                      width +
                                          rowPadding /
                                          pixelStride,
                                      height,
                                      Bitmap.Config.ARGB_8888);

                              full.copyPixelsFromBuffer(
                                  buffer);

                              Bitmap cropped =
                                  Bitmap.createBitmap(
                                      full,
                                      0,
                                      0,
                                      width,
                                      height);

                              full.recycle();

                              Bitmap old =
                                  latest;

                              latest =
                                  cropped;

                              if (old != null &&
                                  !old.isRecycled()) {
                                  old.recycle();
                              }

                          } catch (Exception ignored) {

                          } finally {

                              if (image != null) {
                                  image.close();
                              }
                          }

                      },
                      handler);

                  display =
                      projection.createVirtualDisplay(
                          "DustinBotV3",
                          width,
                          height,
                          density,
                          DisplayManager
                              .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(),
                          null,
                          handler);
              }

              public static Bitmap getLatestCopy() {

                  Bitmap bitmap = latest;

                  if (bitmap == null ||
                      bitmap.isRecycled()) {
                      return null;
                  }

                  return bitmap.copy(
                      Bitmap.Config.ARGB_8888,
                      false);
              }

              private void stopCapture() {

                  if (display != null) {
                      display.release();
                      display = null;
                  }

                  if (reader != null) {
                      reader.close();
                      reader = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  if (thread != null) {
                      thread.quitSafely();
                      thread = null;
                  }
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "Dustin Bot Capture",
                              NotificationManager
                                  .IMPORTANCE_LOW);

                      NotificationManager manager =
                          (NotificationManager)
                              getSystemService(
                                  NOTIFICATION_SERVICE);

                      manager.createNotificationChannel(
                          channel);
                  }
              }

              @Override
              public void onDestroy() {
                  stopCapture();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/TemplateMatcher.java <<'EOF'
          package com.dustinbot.v2;

          import android.graphics.Bitmap;
          import android.graphics.Rect;

          public class TemplateMatcher {

              public static Rect find(
                      Bitmap screen,
                      Bitmap template,
                      int step,
                      double threshold) {

                  if (screen == null ||
                      template == null) {
                      return null;
                  }

                  int tw =
                      template.getWidth();

                  int th =
                      template.getHeight();

                  if (tw < 5 ||
                      th < 5 ||
                      tw >= screen.getWidth() ||
                      th >= screen.getHeight()) {
                      return null;
                  }

                  int sample =
                      Math.max(
                          2,
                          Math.min(tw, th) / 10);

                  double best =
                      Double.MAX_VALUE;

                  int bestX = -1;
                  int bestY = -1;

                  int scan =
                      Math.max(4, step);

                  for (int y = 0;
                       y <= screen.getHeight() - th;
                       y += scan) {

                      for (int x = 0;
                           x <= screen.getWidth() - tw;
                           x += scan) {

                          double sum = 0;
                          int count = 0;

                          for (int ty = 0;
                               ty < th;
                               ty += sample) {

                              for (int tx = 0;
                                   tx < tw;
                                   tx += sample) {

                                  int a =
                                      template.getPixel(
                                          tx,
                                          ty);

                                  int b =
                                      screen.getPixel(
                                          x + tx,
                                          y + ty);

                                  int ar =
                                      (a >> 16) & 255;

                                  int ag =
                                      (a >> 8) & 255;

                                  int ab =
                                      a & 255;

                                  int br =
                                      (b >> 16) & 255;

                                  int bg =
                                      (b >> 8) & 255;

                                  int bb =
                                      b & 255;

                                  sum +=
                                      (Math.abs(ar - br) +
                                       Math.abs(ag - bg) +
                                       Math.abs(ab - bb))
                                      / 3.0;

                                  count++;
                              }
                          }

                          double score =
                              sum /
                              Math.max(
                                  1,
                                  count);

                          if (score < best) {

                              best = score;
                              bestX = x;
                              bestY = y;
                          }
                      }
                  }

                  if (bestX < 0 ||
                      best > threshold) {
                      return null;
                  }

                  return new Rect(
                      bestX,
                      bestY,
                      bestX + tw,
                      bestY + th);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MediaProjectionManagerHelper.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Context;
          import android.media.projection.MediaProjectionManager;

          public class MediaProjectionManagerHelper {

              public static void request(
                      Activity activity) {

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                          activity.getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);

                  activity.startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      500);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity
                  extends Activity {

              public static long walkDelay = 1800;
              public static long scanDelay = 900;
              public static long attackWait = 900;

              public static String waypoints =
                  "300,500;500,500;700,500;700,800;500,800;300,800";

              private EditText walkField;
              private EditText scanField;
              private EditText attackWaitField;
              private EditText waypointField;

              private EditText mx;
              private EditText my;
              private EditText mw;
              private EditText mh;

              private EditText ix;
              private EditText iy;
              private EditText iw;
              private EditText ih;

              private TextView status;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                      savedInstanceState);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL);

                  root.setPadding(
                      18,
                      18,
                      18,
                      18);

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "DUSTIN BOT V3\n" +
                      "TARGET LOCK / ATTACK / LOOT");

                  title.setTextSize(22);

                  root.addView(title);

                  root.addView(
                      button(
                          "1. เปิด ACCESSIBILITY",
                          v -> startActivity(
                              new Intent(
                                  Settings
                                      .ACTION_ACCESSIBILITY_SETTINGS))));

                  root.addView(
                      button(
                          "2. อนุญาต OVERLAY",
                          v -> {

                              if (Build.VERSION.SDK_INT >= 23) {

                                  startActivity(
                                      new Intent(
                                          Settings
                                              .ACTION_MANAGE_OVERLAY_PERMISSION,
                                          Uri.parse(
                                              "package:" +
                                              getPackageName())));
                              }
                          }));

                  root.addView(
                      button(
                          "3. SCREEN CAPTURE",
                          v -> requestCapture()));

                  TextView note =
                      new TextView(this);

                  note.setText(
                      "\nV3 ไม่ใช้ Attack X/Y\n" +
                      "เมื่อเจอ Monster จะกดตรงตัว Monster");

                  root.addView(note);

                  walkField =
                      field(
                          "เดินทุก ms",
                          "1800");

                  scanField =
                      field(
                          "สแกนทุก ms",
                          "900");

                  attackWaitField =
                      field(
                          "รอหลังแตะ Monster ms",
                          "900");

                  root.addView(walkField);
                  root.addView(scanField);
                  root.addView(attackWaitField);

                  waypointField =
                      field(
                          "Waypoint x,y;x,y...",
                          waypoints);

                  root.addView(
                      waypointField);

                  TextView monsterTitle =
                      new TextView(this);

                  monsterTitle.setText(
                      "\nMONSTER TEMPLATE\n" +
                      "ครอบเฉพาะตัว Monster");

                  root.addView(
                      monsterTitle);

                  mx = field(
                      "Monster X",
                      "0");

                  my = field(
                      "Monster Y",
                      "0");

                  mw = field(
                      "Monster W",
                      "60");

                  mh = field(
                      "Monster H",
                      "60");

                  root.addView(mx);
                  root.addView(my);
                  root.addView(mw);
                  root.addView(mh);

                  root.addView(
                      button(
                          "จับภาพ MONSTER",
                          v -> captureTemplate(
                              "monster.png",
                              mx,
                              my,
                              mw,
                              mh)));

                  TextView itemTitle =
                      new TextView(this);

                  itemTitle.setText(
                      "\nITEM TEMPLATE\n" +
                      "ครอบเฉพาะ Item");

                  root.addView(
                      itemTitle);

                  ix = field(
                      "Item X",
                      "0");

                  iy = field(
                      "Item Y",
                      "0");

                  iw = field(
                      "Item W",
                      "50");

                  ih = field(
                      "Item H",
                      "50");

                  root.addView(ix);
                  root.addView(iy);
                  root.addView(iw);
                  root.addView(ih);

                  root.addView(
                      button(
                          "จับภาพ ITEM",
                          v -> captureTemplate(
                              "item.png",
                              ix,
                              iy,
                              iw,
                              ih)));

                  root.addView(
                      button(
                          "บันทึก BOT",
                          v -> save()));

                  root.addView(
                      button(
                          "เปิดปุ่ม BOT",
                          v -> {

                              save();

                              if (!Settings
                                  .canDrawOverlays(this)) {

                                  toast(
                                      "ต้องเปิด Overlay ก่อน");

                                  return;
                              }

                              startService(
                                  new Intent(
                                      this,
                                      BotOverlayService.class));
                          }));

                  status =
                      new TextView(this);

                  status.setText(
                      "\nสถานะ: พร้อม");

                  root.addView(
                      status);

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.setFillViewport(
                      true);

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private Button button(
                      String text,
                      View.OnClickListener listener) {

                  Button button =
                      new Button(this);

                  button.setText(text);
                  button.setOnClickListener(
                      listener);

                  return button;
              }

              private EditText field(
                      String hint,
                      String value) {

                  EditText edit =
                      new EditText(this);

                  edit.setHint(hint);
                  edit.setText(value);

                  edit.setInputType(
                      InputType.TYPE_CLASS_NUMBER |
                      InputType.TYPE_NUMBER_FLAG_DECIMAL);

                  return edit;
              }

              private long number(
                      EditText edit) {

                  return Long.parseLong(
                      edit.getText()
                          .toString()
                          .trim());
              }

              private void save() {

                  try {

                      walkDelay =
                          number(walkField);

                      scanDelay =
                          number(scanField);

                      attackWait =
                          number(attackWaitField);

                      waypoints =
                          waypointField
                              .getText()
                              .toString()
                              .trim();

                      toast(
                          "บันทึก BOT แล้ว");

                  } catch (Exception e) {

                      toast(
                          "กรุณาตรวจสอบค่า");
                  }
              }

              private void captureTemplate(
                      String filename,
                      EditText ex,
                      EditText ey,
                      EditText ew,
                      EditText eh) {

                  try {

                      Bitmap screen =
                          CaptureService
                              .getLatestCopy();

                      if (screen == null) {

                          toast(
                              "ต้องเปิด SCREEN CAPTURE ก่อน");

                          return;
                      }

                      int x =
                          (int) number(ex);

                      int y =
                          (int) number(ey);

                      int w =
                          (int) number(ew);

                      int h =
                          (int) number(eh);

                      if (x < 0 ||
                          y < 0 ||
                          w < 5 ||
                          h < 5 ||
                          x + w > screen.getWidth() ||
                          y + h > screen.getHeight()) {

                          screen.recycle();

                          toast(
                              "กรอบอยู่นอกหน้าจอ");

                          return;
                      }

                      Bitmap crop =
                          Bitmap.createBitmap(
                              screen,
                              x,
                              y,
                              w,
                              h);

                      File file =
                          new File(
                              getFilesDir(),
                              filename);

                      FileOutputStream output =
                          new FileOutputStream(
                              file);

                      crop.compress(
                          Bitmap.CompressFormat.PNG,
                          100,
                          output);

                      output.close();

                      crop.recycle();
                      screen.recycle();

                      toast(
                          "บันทึก " +
                          filename +
                          " แล้ว");

                      if (status != null) {

                          status.setText(
                              "\n" +
                              filename +
                              " พร้อมใช้งาน");
                      }

                  } catch (Exception e) {

                      toast(
                          "จับภาพไม่สำเร็จ");
                  }
              }

              private void requestCapture() {

                  MediaProjectionManagerHelper
                      .request(this);
              }

              private void toast(
                      String text) {

                  Toast.makeText(
                      this,
                      text,
                      Toast.LENGTH_SHORT)
                      .show();
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data);

                  if (requestCode == 500 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      Intent service =
                          new Intent(
                              this,
                              CaptureService.class);

                      service.putExtra(
                          "resultCode",
                          resultCode);

                      service.putExtra(
                          "data",
                          data);

                      if (Build.VERSION.SDK_INT >= 26) {

                          startForegroundService(
                              service);

                      } else {

                          startService(service);
                      }

                      toast(
                          "กำลังเริ่ม Screen Capture");
                  }
              }
          }
          EOF

