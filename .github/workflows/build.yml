package com.dustinbot.v42;

import android.graphics.Bitmap;
import android.graphics.Color;

public class TemplateMatcher {

    public static class Result {

        public boolean found;
        public float score;
        public int x;
        public int y;
        public int width;
        public int height;
    }

    public static Result find(
            Bitmap screen,
            Bitmap template,
            float threshold) {

        Result result =
                new Result();

        if (screen == null ||
            template == null ||
            screen.isRecycled() ||
            template.isRecycled()) {

            return result;
        }

        int tw =
                Math.min(
                        64,
                        template.getWidth()
                );

        int th =
                Math.min(
                        64,
                        template.getHeight()
                );

        if (tw < 12 ||
            th < 12 ||
            screen.getWidth() < tw ||
            screen.getHeight() < th) {

            return result;
        }

        Bitmap t =
                Bitmap.createScaledBitmap(
                        template,
                        tw,
                        th,
                        false
                );

        double best =
                Double.MAX_VALUE;

        int bestX = 0;
        int bestY = 0;

        for (
                int y = 0;
                y <= screen.getHeight() - th;
                y += 6
        ) {

            for (
                    int x = 0;
                    x <= screen.getWidth() - tw;
                    x += 6
            ) {

                double total = 0;
                int count = 0;

                for (
                        int yy = 3;
                        yy < th - 3;
                        yy += 5
                ) {

                    for (
                            int xx = 3;
                            xx < tw - 3;
                            xx += 5
                    ) {

                        int a =
                                t.getPixel(
                                        xx,
                                        yy
                                );

                        int b =
                                screen.getPixel(
                                        x + xx,
                                        y + yy
                                );

                        int da =
                                Math.abs(
                                        Color.red(a) -
                                        Color.red(b)
                                );

                        int db =
                                Math.abs(
                                        Color.green(a) -
                                        Color.green(b)
                                );

                        int dc =
                                Math.abs(
                                        Color.blue(a) -
                                        Color.blue(b)
                                );

                        total +=
                                da +
                                db +
                                dc;

                        count++;
                    }
                }

                double score =
                        total /
                        Math.max(1, count);

                if (score < best) {

                    best = score;
                    bestX = x;
                    bestY = y;
                }
            }
        }

        t.recycle();

        result.score =
                (float) best;

        result.width = tw;
        result.height = th;

        result.x =
                bestX + tw / 2;

        result.y =
                bestY + th / 2;

        result.found =
                best <= threshold;

        return result;
    }
}
