      - name: Build APK
        shell: bash
        run: |

          set -e

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV9.2-RANDOM-LOOT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSTIN-BOT-V9.2-RANDOM-LOOT
          path: output/DustinBotV9.2-RANDOM-LOOT.apk
          if-no-files-found: error
