name: Build DustinBot V4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # ============================================================
      # CREATE PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo " DUSTIN BOT V4.1"
          echo " CREATE PROJECT"
          echo "=========================================="

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -rf gradle


          # --------------------------------------------------------
          # DIRECTORIES
          # --------------------------------------------------------

          mkdir -p app/src/main/java/com/dustinbot/v41
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


          # ========================================================
          # SETTINGS
          # ========================================================

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "DustinBotV41"

include(":app")
EOF


