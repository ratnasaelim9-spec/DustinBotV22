          package com.dustinbot.v2;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;

          public class BotOverlayService
                  extends Service {

              private WindowManager windowManager;
              private LinearLayout overlay;
              private TextView console;

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper());

              private volatile boolean running =
                  false;

              private int waypointIndex =
                  0;

              private Bitmap monsterTemplate;
              private Bitmap itemTemplate;

              private final Runnable botLoop =
                  new Runnable() {

                      @Override
                      public void run() {

                          if (!running) {
                              return;
                          }

                          try {

                              BotAccessibilityService
                                  accessibility =
                                  BotAccessibilityService
                                      .instance;

                              if (accessibility == null) {

                                  status(
                                      "WAITING ACCESSIBILITY");

                                  schedule(1000);

                                  return;
                              }

                              Bitmap screen =
                                  CaptureService
                                      .getLatestCopy();

                              if (screen == null) {

                                  status(
                                      "WAITING SCREEN");

                                  schedule(1000);

                                  return;
                              }

                              if (monsterTemplate == null) {

                                  monsterTemplate =
                                      load(
                                          "monster.png");
                              }

                              if (itemTemplate == null) {

                                  itemTemplate =
                                      load(
                                          "item.png");
                              }

                              status(
                                  "SCANNING MONSTER");

                              Rect target = null;

                              if (monsterTemplate != null) {

                                  target =
                                      TemplateMatcher.find(
                                          screen,
                                          monsterTemplate,
                                          10,
                                          55);
                              }

                              if (target != null) {

                                  int x =
                                      target.centerX();

                                  int y =
                                      target.centerY();

                                  status(
                                      "TARGET LOCK\n" +
                                      "X=" + x +
                                      " Y=" + y);

                                  accessibility.tap(
                                      x,
                                      y);

                                  status(
                                      "ATTACKING");

                                  screen.recycle();

                                  schedule(
                                      Math.max(
                                          500,
                                          MainActivity
                                              .attackWait));

                                  return;
                              }

                              if (itemTemplate != null) {

                                  status(
                                      "SCANNING ITEM");

                                  Rect loot =
                                      TemplateMatcher.find(
                                          screen,
                                          itemTemplate,
                                          10,
                                          55);

                                  if (loot != null) {

                                      int x =
                                          loot.centerX();

                                      int y =
                                          loot.centerY();

                                      status(
                                          "LOOTING\n" +
                                          "X=" + x +
                                          " Y=" + y);

                                      accessibility.tap(
                                          x,
                                          y);

                                      screen.recycle();

                                      schedule(600);

                                      return;
                                  }
                              }

                              screen.recycle();

                              status(
                                  "WALKING");

                              walk(
                                  accessibility);

                              schedule(
                                  Math.max(
                                      500,
                                      MainActivity
                                          .scanDelay));

                          } catch (Exception e) {

                              status(
                                  "ERROR");

                              schedule(1000);
                          }
                      }
                  };

              private void schedule(
                      long delay) {

                  if (!running) {
                      return;
                  }

                  handler.postDelayed(
                      botLoop,
                      delay);
              }

              private Bitmap load(
                      String filename) {

                  try {

                      File file =
                          new File(
                              getFilesDir(),
                              filename);

                      if (!file.exists()) {
                          return null;
                      }

                      return BitmapFactory
                          .decodeFile(
                              file.getAbsolutePath());

                  } catch (Exception e) {

                      return null;
                  }
              }

              private void walk(
                      BotAccessibilityService
                          accessibility) {

                  String route =
                      MainActivity.waypoints;

                  if (route == null ||
                      route.trim().isEmpty()) {

                      status(
                          "NO WAYPOINT");

                      return;
                  }

                  String[] points =
                      route.split(";");

                  if (points.length == 0) {
                      return;
                  }

                  try {

                      String point =
                          points[
                              waypointIndex %
                              points.length]
                          .trim();

                      String[] xy =
                          point.split(",");

                      if (xy.length != 2) {
                          return;
                      }

                      float x =
                          Float.parseFloat(
                              xy[0].trim());

                      float y =
                          Float.parseFloat(
                              xy[1].trim());

                      status(
                          "WALKING → " +
                          (int)x +
                          "," +
                          (int)y);

                      accessibility.tap(
                          x,
                          y);

                      waypointIndex++;

                  } catch (Exception ignored) {
                  }
              }

              private void status(
                      String text) {

                  handler.post(
                      () -> {

                          if (console != null) {

                              console.setText(
                                  "DUSTIN BOT V3\n" +
                                  "STATUS: " +
                                  text);
                          }
                      });
              }

              @Override
              public void onCreate() {

                  super.onCreate();

                  if (!Settings
                      .canDrawOverlays(this)) {

                      stopSelf();

                      return;
                  }

                  windowManager =
                      (WindowManager)
                          getSystemService(
                              WINDOW_SERVICE);

                  overlay =
                      new LinearLayout(this);

                  overlay.setOrientation(
                      LinearLayout.VERTICAL);

                  overlay.setPadding(
                      8,
                      8,
                      8,
                      8);

                  overlay.setBackgroundColor(
                      Color.argb(
                          235,
                          20,
                          20,
                          20));

                  LinearLayout buttons =
                      new LinearLayout(this);

                  buttons.setOrientation(
                      LinearLayout.HORIZONTAL);

                  Button bot =
                      new Button(this);

                  bot.setText("BOT");

                  bot.setOnClickListener(
                      v -> startBot());

                  buttons.addView(bot);

                  Button stop =
                      new Button(this);

                  stop.setText("STOP");

                  stop.setOnClickListener(
                      v -> stopBot());

                  buttons.addView(stop);

                  overlay.addView(
                      buttons);

                  console =
                      new TextView(this);

                  console.setTextColor(
                      Color.WHITE);

                  console.setText(
                      "DUSTIN BOT V3\n" +
                      "STATUS: READY");

                  console.setPadding(
                      10,
                      5,
                      10,
                      5);

                  overlay.addView(
                      console);

                  int type =
                      android.os.Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams
                          .TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams
                          .TYPE_PHONE;

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams
                              .FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);

                  params.gravity =
                      Gravity.TOP |
                      Gravity.LEFT;

                  params.x = 15;
                  params.y = 150;

                  windowManager.addView(
                      overlay,
                      params);
              }

              private void startBot() {

                  if (CaptureService.latest == null) {

                      toast(
                          "เปิด Screen Capture ก่อน");

                      return;
                  }

                  if (BotAccessibilityService
                      .instance == null) {

                      toast(
                          "เปิด Accessibility ก่อน");

                      return;
                  }

                  if (monsterTemplate == null) {

                      monsterTemplate =
                          load(
                              "monster.png");
                  }

                  if (monsterTemplate == null) {

                      toast(
                          "จับภาพ MONSTER ก่อน");

                      return;
                  }

                  running = true;
                  waypointIndex = 0;

                  handler.removeCallbacksAndMessages(
                      null);

                  status(
                      "STARTING");

                  handler.post(
                      botLoop);
              }

              private void stopBot() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null);

                  status(
                      "STOPPED");
              }

              private void toast(
                      String text) {

                  Toast.makeText(
                      this,
                      text,
                      Toast.LENGTH_SHORT)
                      .show();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null);

                  if (monsterTemplate != null) {
                      monsterTemplate.recycle();
                      monsterTemplate = null;
                  }

                  if (itemTemplate != null) {
                      itemTemplate.recycle();
                      itemTemplate = null;
                  }

                  if (overlay != null &&
                      windowManager != null) {

                      try {
                          windowManager.removeView(
                              overlay);
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            find app -type f | sort
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
