          cat > app/src/main/java/com/dustinbot/v42/MainActivity.java <<'EOF'
package com.dustinbot.v42;

import android.app.Activity;
import android.content.Intent;
import android.media.projection.MediaProjectionManager;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.provider.Settings;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

public class MainActivity extends Activity {

    private static final int CAPTURE = 9001;

    private int dp(int n) {

        return (int)
                (
                        n *
                        getResources()
                                .getDisplayMetrics()
                                .density +
                        0.5f
                );
    }

    private TextView label(
            String text,
            int size) {

        TextView v =
                new TextView(this);

        v.setText(text);
        v.setTextSize(size);
        v.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8)
        );

        return v;
    }

    private Button button(
            String text,
            View.OnClickListener click) {

        Button b =
                new Button(this);

        b.setText(text);
        b.setOnClickListener(click);

        return b;
    }

    @Override
    protected void onCreate(
            Bundle state) {

        super.onCreate(state);

        LinearLayout box =
                new LinearLayout(this);

        box.setOrientation(
                LinearLayout.VERTICAL
        );

        box.setPadding(
                dp(12),
                dp(10),
                dp(12),
                dp(20)
        );

        box.addView(
                label(
                        "DUSTIN BOT V4.2",
                        26
                )
        );

        box.addView(
                label(
                        "เดิน → หา Monster → Lock → โจมตี → Loot → วน",
                        15
                )
        );

        box.addView(
                button(
                        "1. ACCESSIBILITY",
                        v ->
                                startActivity(
                                        new Intent(
                                                Settings.ACTION_ACCESSIBILITY_SETTINGS
                                        )
                                )
                )
        );

        box.addView(
                button(
                        "2. OVERLAY",
                        v -> {

                            Intent i =
                                    new Intent(
                                            Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                            Uri.parse(
                                                    "package:" +
                                                    getPackageName()
                                            )
                                    );

                            startActivity(i);
                        }
                )
        );

        box.addView(
                button(
                        "3. SCREEN CAPTURE",
                        v -> requestCapture()
                )
        );

        box.addView(
                button(
                        "4. เปิด BOT PANEL",
                        v -> startOverlay()
                )
        );

        box.addView(
                button(
                        "5. บันทึกเส้นทาง",
                        v -> {

                            startOverlay();

                            new android.os.Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.recordRoute();
                                                }

                                            },
                                            500
                                    );
                        }
                )
        );

        box.addView(
                button(
                        "6. เลือก MONSTER",
                        v -> {

                            startOverlay();

                            new android.os.Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.selectMonster();
                                                }

                                            },
                                            500
                                    );
                        }
                )
        );

        box.addView(
                button(
                        "7. เลือก ITEM",
                        v -> {

                            startOverlay();

                            new android.os.Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.selectItem();
                                                }

                                            },
                                            500
                                    );
                        }
                )
        );

        box.addView(
                button(
                        "8. BOT START",
                        v -> {

                            startOverlay();

                            new android.os.Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.startBot();
                                                }

                                            },
                                            500
                                    );
                        }
                )
        );

        box.addView(
                button(
                        "9. BOT STOP",
                        v -> {

                            if (BotOverlayService.instance != null) {

                                BotOverlayService.instance.stopBot();
                            }
                        }
                )
        );

        box.addView(
                label(
                        "ไม่ใช้ Attack X/Y\n" +
                        "ไม่ต้องกรอก Monster X/Y/W/H\n" +
                        "เลือก Monster และ Item ด้วยการแตะบนหน้าจอ",
                        14
                )
        );

        ScrollView scroll =
                new ScrollView(this);

        scroll.addView(box);

        setContentView(scroll);
    }

    private void startOverlay() {

        Intent i =
                new Intent(
                        this,
                        BotOverlayService.class
                );

        if (Build.VERSION.SDK_INT >= 26) {

            startForegroundService(i);

        } else {

            startService(i);
        }
    }

    private void requestCapture() {

        MediaProjectionManager manager =
                (MediaProjectionManager)
                        getSystemService(
                                MEDIA_PROJECTION_SERVICE
                        );

        startActivityForResult(
                manager.createScreenCaptureIntent(),
                CAPTURE
        );
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (requestCode != CAPTURE ||
            resultCode != RESULT_OK ||
            data == null) {

            return;
        }

        Intent i =
                new Intent(
                        this,
                        CaptureService.class
                );

        i.putExtra(
                "resultCode",
                resultCode
        );

        i.putExtra(
                "data",
                data
        );

        if (Build.VERSION.SDK_INT >= 26) {

            startForegroundService(i);

        } else {

            startService(i);
        }
    }
}
