              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode ==
                      CAPTURE_REQUEST &&
                      resultCode ==
                              RESULT_OK &&
                      data != null) {

                      Intent intent =
                              new Intent(
                                      this,
                                      CaptureService.class
                              );

                      intent.putExtra(
                              "resultCode",
                              resultCode
                      );

                      intent.putExtra(
                              "data",
                              data
                      );

                      if (Build.VERSION.SDK_INT >= 26) {

                          startForegroundService(
                                  intent
                          );

                      } else {

                          startService(
                                  intent
                          );
