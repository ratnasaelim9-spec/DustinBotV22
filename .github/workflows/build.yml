name: Build DustinBot V4.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app gradle build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v43
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV43"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.dustinbot.v43"
              compileSdk 35

              defaultConfig {
                  applicationId "com.dustinbot.v43"
                  minSdk 26
                  targetSdk 35
                  versionCode 43
                  versionName "4.3"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="DustinBot V4.3"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".MainActivity$BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".MainActivity$CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".MainActivity$BotService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v43/MainActivity.java <<'EOF'
          package com.dustinbot.v43;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;

          import android.content.Intent;

          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.PointF;

          import android.hardware.display.DisplayManager;

          import android.media.Image;
          import android.media.ImageReader;

          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;

          import android.net.Uri;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Looper;

          import android.provider.Settings;

          import android.util.DisplayMetrics;

          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;

          import android.view.accessibility.AccessibilityEvent;

          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.nio.ByteBuffer;
          import java.util.ArrayList;

          public class MainActivity extends android.app.Activity {

              static final int CAPTURE = 4301;

              int dp(int n) {
                  return (int)(
                      n *
                      getResources()
                          .getDisplayMetrics()
                          .density
                      + 0.5f
                  );
              }

              Button button(
                      String text,
                      View.OnClickListener listener) {

                  Button b =
                      new Button(this);

                  b.setText(text);
                  b.setOnClickListener(listener);

                  return b;
              }

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  LinearLayout box =
                      new LinearLayout(this);

                  box.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  box.setPadding(
                      dp(12),
                      dp(8),
                      dp(12),
                      dp(20)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "DUSTIN BOT V4.3"
                  );

                  title.setTextSize(25);

                  box.addView(title);

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "เดิน → หา Monster → Lock → โจมตี → Loot → วน"
                  );

                  info.setTextSize(14);

                  box.addView(info);

                  box.addView(
                      button(
                          "1. ACCESSIBILITY",
                          v ->
                              startActivity(
                                  new Intent(
                                      Settings
                                          .ACTION_ACCESSIBILITY_SETTINGS
                                  )
                              )
                      )
                  );

                  box.addView(
                      button(
                          "2. OVERLAY",
                          v -> {

                              Intent i =
                                  new Intent(
                                      Settings
                                          .ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                          "package:" +
                                          getPackageName()
                                      )
                                  );

                              startActivity(i);
                          }
                      )
                  );

                  box.addView(
                      button(
                          "3. SCREEN CAPTURE",
                          v -> requestCapture()
                      )
                  );

                  box.addView(
                      button(
                          "4. เปิด BOT PANEL",
                          v -> startBotService()
                      )
                  );

                  box.addView(
                      button(
                          "5. บันทึกเส้นทาง",
                          v -> {

                              startBotService();

                              new Handler()
                                  .postDelayed(
                                      () -> {

                                          if (
                                              BotService.instance
                                              != null
                                          ) {

                                              BotService.instance
                                                  .routeMode();
                                          }

                                      },
                                      500
                                  );
                          }
                      )
                  );

                  box.addView(
                      button(
                          "6. เลือก MONSTER",
                          v -> {

                              startBotService();

                              new Handler()
                                  .postDelayed(
                                      () -> {

                                          if (
                                              BotService.instance
                                              != null
                                          ) {

                                              BotService.instance
                                                  .select(false);
                                          }

                                      },
                                      500
                                  );
                          }
                      )
                  );

                  box.addView(
                      button(
                          "7. เลือก ITEM",
                          v -> {

                              startBotService();

                              new Handler()
                                  .postDelayed(
                                      () -> {

                                          if (
                                              BotService.instance
                                              != null
                                          ) {

                                              BotService.instance
                                                  .select(true);
                                          }

                                      },
                                      500
                                  );
                          }
                      )
                  );

                  box.addView(
                      button(
                          "8. BOT START",
                          v -> {

                              startBotService();

                              new Handler()
                                  .postDelayed(
                                      () -> {

                                          if (
                                              BotService.instance
                                              != null
                                          ) {

                                              BotService.instance
                                                  .startBot();
                                          }

                                      },
                                      500
                                  );
                          }
                      )
                  );

                  box.addView(
                      button(
                          "9. BOT STOP",
                          v -> {

                              if (
                                  BotService.instance
                                  != null
                              ) {

                                  BotService.instance
                                      .stopBot();
                              }
                          }
                      )
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.addView(box);

                  setContentView(scroll);
              }

              void startBotService() {

                  Intent i =
                      new Intent(
                          this,
                          BotService.class
                      );

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      startForegroundService(i);

                  } else {

                      startService(i);
                  }
              }

              void requestCapture() {

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                          getSystemService(
                              MEDIA_PROJECTION_SERVICE
                          );

                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      CAPTURE
                  );
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data) {

                  super.onActivityResult(
                      request,
                      result,
                      data
                  );

                  if (
                      request != CAPTURE ||
                      result != RESULT_OK ||
                      data == null
                  ) {

                      return;
                  }

                  Intent i =
                      new Intent(
                          this,
                          CaptureService.class
                      );

                  i.putExtra(
                      "resultCode",
                      result
                  );

                  i.putExtra(
                      "data",
                      data
                  );

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      startForegroundService(i);

                  } else {

                      startService(i);
                  }
              }

              public static class BotAccessibilityService
                      extends AccessibilityService {

                  public static volatile
                  BotAccessibilityService instance;

                  int width;
                  int height;

                  @Override
                  public void onServiceConnected() {

                      super.onServiceConnected();

                      instance = this;

                      DisplayMetrics dm =
                          getResources()
                              .getDisplayMetrics();

                      width =
                          dm.widthPixels;

                      height =
                          dm.heightPixels;
                  }

                  public boolean tap(
                          float x,
                          float y) {

                      if (
                          width <= 0 ||
                          height <= 0
                      ) {

                          return false;
                      }

                      x =
                          Math.max(
                              0,
                              Math.min(
                                  x,
                                  width - 1
                              )
                          );

                      y =
                          Math.max(
                              0,
                              Math.min(
                                  y,
                                  height - 1
                              )
                          );

                      Path path =
                          new Path();

                      path.moveTo(x, y);

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              70
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      return dispatchGesture(
                          gesture,
                          null,
                          null
                      );
                  }

                  @Override
                  public void onAccessibilityEvent(
                          AccessibilityEvent event) {
                  }

                  @Override
                  public void onInterrupt() {
                  }

                  @Override
                  public void onDestroy() {

                      instance = null;

                      super.onDestroy();
                  }
              }

              public static class CaptureService
                      extends Service {

                  static volatile Bitmap latest;

                  static volatile int W = 1;
                  static volatile int H = 1;

                  MediaProjection projection;
                  ImageReader reader;

                  android.hardware.display.VirtualDisplay
                      display;

                  HandlerThread thread;
                  Handler handler;

                  @Override
                  public void onCreate() {

                      super.onCreate();

                      NotificationManager nm =
                          (NotificationManager)
                              getSystemService(
                                  NOTIFICATION_SERVICE
                              );

                      nm.createNotificationChannel(
                          new NotificationChannel(
                              "capture43",
                              "Capture",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          )
                      );

                      Notification n =
                          new Notification.Builder(
                              this,
                              "capture43"
                          )
                              .setContentTitle(
                                  "DustinBot V4.3"
                              )
                              .setContentText(
                                  "Screen Capture"
                              )
                              .setSmallIcon(
                                  android.R.drawable
                                      .ic_menu_camera
                              )
                              .build();

                      startForeground(
                          4302,
                          n
                      );

                      thread =
                          new HandlerThread(
                              "capture43"
                          );

                      thread.start();

                      handler =
                          new Handler(
                              thread.getLooper()
                          );
                  }

                  @Override
                  public int onStartCommand(
                          Intent intent,
                          int flags,
                          int id) {

                      if (intent == null) {

                          return START_STICKY;
                      }

                      int result =
                          intent.getIntExtra(
                              "resultCode",
                              0
                          );

                      Intent data;

                      if (
                          Build.VERSION.SDK_INT >= 33
                      ) {

                          data =
                              intent.getParcelableExtra(
                                  "data",
                                  Intent.class
                              );

                      } else {

                          data =
                              intent.getParcelableExtra(
                                  "data"
                              );
                      }

                      if (data != null) {

                          startCapture(
                              result,
                              data
                          );
                      }

                      return START_STICKY;
                  }

                  void startCapture(
                          int result,
                          Intent data) {

                      try {

                          MediaProjectionManager manager =
                              (MediaProjectionManager)
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  );

                          projection =
                              manager.getMediaProjection(
                                  result,
                                  data
                              );

                          DisplayMetrics dm =
                              getResources()
                                  .getDisplayMetrics();

                          W =
                              dm.widthPixels;

                          H =
                              dm.heightPixels;

                          reader =
                              ImageReader.newInstance(
                                  W,
                                  H,
                                  PixelFormat.RGBA_8888,
                                  2
                              );

                          reader.setOnImageAvailableListener(
                              r -> captureFrame(r),
                              handler
                          );

                          display =
                              projection
                                  .createVirtualDisplay(
                                      "DustinBot43",
                                      W,
                                      H,
                                      dm.densityDpi,
                                      DisplayManager
                                          .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                      reader.getSurface(),
                                      null,
                                      handler
                                  );

                      } catch (Exception ignored) {
                      }
                  }

                  void captureFrame(
                          ImageReader r) {

                      Image image = null;

                      try {

                          image =
                              r.acquireLatestImage();

                          if (image == null) {

                              return;
                          }

                          Image.Plane plane =
                              image.getPlanes()[0];

                          ByteBuffer buffer =
                              plane.getBuffer();

                          int pixelStride =
                              plane.getPixelStride();

                          int rowStride =
                              plane.getRowStride();

                          int realWidth =
                              W +
                              (
                                  rowStride -
                                  pixelStride * W
                              ) /
                              pixelStride;

                          Bitmap full =
                              Bitmap.createBitmap(
                                  realWidth,
                                  H,
                                  Bitmap.Config
                                      .ARGB_8888
                              );

                          buffer.rewind();

                          full.copyPixelsFromBuffer(
                              buffer
                          );

                          Bitmap clean =
                              Bitmap.createBitmap(
                                  full,
                                  0,
                                  0,
                                  W,
                                  H
                              );

                          full.recycle();

                          Bitmap old =
                              latest;

                          latest =
                              clean;

                          if (
                              old != null &&
                              !old.isRecycled()
                          ) {

                              old.recycle();
                          }

                      } catch (Exception ignored) {

                      } finally {

                          if (image != null) {

                              image.close();
                          }
                      }
                  }

                  static Bitmap copy() {

                      Bitmap source =
                          latest;

                      if (
                          source == null ||
                          source.isRecycled()
                      ) {

                          return null;
                      }

                      try {

                          return source.copy(
                              Bitmap.Config.ARGB_8888,
                              false
                          );

                      } catch (Exception e) {

                          return null;
                      }
                  }

                  @Override
                  public void onDestroy() {

                      if (display != null) {

                          display.release();
                      }

                      if (reader != null) {

                          reader.close();
                      }

                      if (projection != null) {

                          projection.stop();
                      }

                      if (thread != null) {

                          thread.quitSafely();
                      }

                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(
                          Intent intent) {

                      return null;
                  }
              }

              public static class BotService
                      extends Service {

                  static volatile BotService instance;

                  WindowManager wm;

                  LinearLayout panel;

                  TextView status;
                  TextView target;

                  HandlerThread thread;
                  Handler ai;

                  boolean running;

                  Bitmap monster;
                  Bitmap item;

                  View selector;

                  ArrayList<PointF> route =
                      new ArrayList<>();

                  int routeIndex;

                  final float threshold =
                      75f;

                  int dp(int n) {

                      return (int)(
                          n *
                          getResources()
                              .getDisplayMetrics()
                              .density
                          + .5f
                      );
                  }

                  @Override
                  public void onCreate() {

                      super.onCreate();

                      instance = this;

                      NotificationManager nm =
                          (NotificationManager)
                              getSystemService(
                                  NOTIFICATION_SERVICE
                              );

                      nm.createNotificationChannel(
                          new NotificationChannel(
                              "bot43",
                              "Bot",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          )
                      );

                      Notification n =
                          new Notification.Builder(
                              this,
                              "bot43"
                          )
                              .setContentTitle(
                                  "DustinBot V4.3"
                              )
                              .setContentText(
                                  "Bot Panel"
                              )
                              .setSmallIcon(
                                  android.R.drawable
                                      .ic_media_play
                              )
                              .build();

                      startForeground(
                          4303,
                          n
                      );

                      wm =
                          (WindowManager)
                              getSystemService(
                                  WINDOW_SERVICE
                              );

                      thread =
                          new HandlerThread(
                              "bot43"
                          );

                      thread.start();

                      ai =
                          new Handler(
                              thread.getLooper()
                          );

                      createPanel();
                  }

                  TextView text(
                          String s,
                          int size) {

                      TextView t =
                          new TextView(this);

                      t.setText(s);
                      t.setTextSize(size);
                      t.setTextColor(
                          Color.WHITE
                      );

                      t.setPadding(
                          dp(6),
                          dp(4),
                          dp(6),
                          dp(4)
                      );

                      return t;
                  }

                  void createPanel() {

                      panel =
                          new LinearLayout(this);

                      panel.setOrientation(
                          LinearLayout.VERTICAL
                      );

                      panel.setPadding(
                          dp(8),
                          dp(6),
                          dp(8),
                          dp(6)
                      );

                      panel.setBackgroundColor(
                          0xDD111111
                      );

                      status =
                          text(
                              "STATUS: STOP",
                              14
                          );

                      target =
                          text(
                              "TARGET: -",
                              12
                          );

                      panel.addView(status);
                      panel.addView(target);

                      Button start =
                          new Button(this);

                      start.setText(
                          "BOT START / STOP"
                      );

                      start.setOnClickListener(
                          v -> {

                              if (running) {

                                  stopBot();

                              } else {

                                  startBot();
                              }
                          }
                      );

                      panel.addView(
                          start,
                          new LinearLayout.LayoutParams(
                              -1,
                              dp(45)
                          )
                      );

                      WindowManager.LayoutParams p =
                          new WindowManager.LayoutParams(
                              dp(280),
                              -2,
                              Build.VERSION.SDK_INT >= 26
                                  ?
                                  WindowManager.LayoutParams
                                      .TYPE_APPLICATION_OVERLAY
                                  :
                                  WindowManager.LayoutParams
                                      .TYPE_PHONE,
                              WindowManager.LayoutParams
                                  .FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT
                          );

                      p.gravity =
                          Gravity.TOP |
                          Gravity.RIGHT;

                      p.x = dp(5);
                      p.y = dp(55);

                      wm.addView(
                          panel,
                          p
                      );
                  }

                  void setStatus(
                          String value) {

                      new Handler(
                          Looper.getMainLooper()
                      ).post(
                          () ->
                              status.setText(
                                  "STATUS: " +
                                  value
                              )
                      );
                  }

                  void startBot() {

                      if (
                          BotAccessibilityService
                              .instance == null
                      ) {

                          setStatus(
                              "ACCESSIBILITY OFF"
                          );

                          return;
                      }

                      if (
                          CaptureService.latest
                          == null
                      ) {

                          setStatus(
                              "SCREEN CAPTURE OFF"
                          );

                          return;
                      }

                      if (monster == null) {

                          setStatus(
                              "MONSTER NOT SET"
                          );

                          return;
                      }

                      running = true;

                      setStatus(
                          "SEARCHING"
                      );

                      ai.post(
                          this::loop
                      );
                  }

                  void stopBot() {

                      running = false;

                      setStatus(
                          "STOP"
                      );
                  }

                  void loop() {

                      if (!running) {

                          return;
                      }

                      Bitmap screen =
                          CaptureService.copy();

                      if (screen == null) {

                          next(500);

                          return;
                      }

                      Hit monsterHit =
                          find(
                              screen,
                              monster,
                              threshold
                          );

                      screen.recycle();

                      if (monsterHit.ok) {

                          setStatus(
                              "TARGET LOCK"
                          );

                          target.setText(
                              "TARGET: " +
                              monsterHit.x +
                              "," +
                              monsterHit.y +
                              " SCORE " +
                              String.format(
                                  "%.1f",
                                  monsterHit.score
                              )
                          );

                          BotAccessibilityService a =
                              BotAccessibilityService
                                  .instance;

                          if (a != null) {

                              a.tap(
                                  monsterHit.x,
                                  monsterHit.y
                              );

                              setStatus(
                                  "ATTACKING"
                              );
                          }

                          next(1200);

                          return;
                      }

                      if (item != null) {

                          Bitmap lootScreen =
                              CaptureService.copy();

                          if (
                              lootScreen != null
                          ) {

                              Hit itemHit =
                                  find(
                                      lootScreen,
                                      item,
                                      threshold
                                  );

                              lootScreen.recycle();

                              if (itemHit.ok) {

                                  setStatus(
                                      "LOOTING"
                                  );

                                  BotAccessibilityService a =
                                      BotAccessibilityService
                                          .instance;

                                  if (a != null) {

                                      a.tap(
                                          itemHit.x,
                                          itemHit.y
                                      );
                                  }

                                  next(900);

                                  return;
                              }
                          }
                      }

                      if (!route.isEmpty()) {

                          PointF p =
                              route.get(
                                  routeIndex++
                                  % route.size()
                              );

                          BotAccessibilityService a =
                              BotAccessibilityService
                                  .instance;

                          if (a != null) {

                              a.tap(
                                  p.x,
                                  p.y
                              );
                          }

                          setStatus(
                              "WALKING"
                          );

                          next(1800);

                          return;
                      }

                      setStatus(
                          "SEARCHING"
                      );

                      next(500);
                  }

                  void next(long delay) {

                      if (running) {

                          ai.postDelayed(
                              this::loop,
                              delay
                          );
                      }
                  }

                  static class Hit {

                      boolean ok;
                      float score;
                      int x;
                      int y;
                  }

                  static Hit find(
                          Bitmap screen,
                          Bitmap template,
                          float limit) {

                      Hit out =
                          new Hit();

                      if (
                          screen == null ||
                          template == null
                      ) {

                          return out;
                      }

                      int tw =
                          Math.min(
                              64,
                              template.getWidth()
                          );

                      int th =
                          Math.min(
                              64,
                              template.getHeight()
                          );

                      if (
                          tw < 12 ||
                          th < 12 ||
                          screen.getWidth() < tw ||
                          screen.getHeight() < th
                      ) {

                          return out;
                      }

                      Bitmap small =
                          Bitmap.createScaledBitmap(
                              template,
                              tw,
                              th,
                              false
                          );

                      double best =
                          Double.MAX_VALUE;

                      int bestX = 0;
                      int bestY = 0;

                      for (
                          int y = 0;
                          y <=
                              screen.getHeight() - th;
                          y += 8
                      ) {

                          for (
                              int x = 0;
                              x <=
                                  screen.getWidth() - tw;
                              x += 8
                          ) {

                              double sum = 0;
                              int count = 0;

                              for (
                                  int yy = 4;
                                  yy < th - 4;
                                  yy += 6
                              ) {

                                  for (
                                      int xx = 4;
                                      xx < tw - 4;
                                      xx += 6
                                  ) {

                                      int a =
                                          small.getPixel(
                                              xx,
                                              yy
                                          );

                                      int b =
                                          screen.getPixel(
                                              x + xx,
                                              y + yy
                                          );

                                      sum +=
                                          Math.abs(
                                              Color.red(a) -
                                              Color.red(b)
                                          ) +

                                          Math.abs(
                                              Color.green(a) -
                                              Color.green(b)
                                          ) +

                                          Math.abs(
                                              Color.blue(a) -
                                              Color.blue(b)
                                          );

                                      count++;
                                  }
                              }

                              double score =
                                  sum /
                                  Math.max(
                                      1,
                                      count
                                  );

                              if (
                                  score < best
                              ) {

                                  best = score;

                                  bestX = x;
                                  bestY = y;
                              }
                          }
                      }

                      small.recycle();

                      out.score =
                          (float)best;

                      out.x =
                          bestX +
                          tw / 2;

                      out.y =
                          bestY +
                          th / 2;

                      out.ok =
                          best <= limit;

                      return out;
                  }

                  void select(
                          boolean itemMode) {

                      if (
                          CaptureService.latest
                          == null
                      ) {

                          setStatus(
                              "SCREEN CAPTURE OFF"
                          );

                          return;
                      }

                      if (selector != null) {

                          return;
                      }

                      FrameLayout frame =
                          new FrameLayout(this);

                      TextView title =
                          text(
                              itemMode
                                  ?
                                  "แตะ ITEM"
                                  :
                                  "แตะ MONSTER",
                              16
                          );

                      title.setBackgroundColor(
                          0xCC111111
                      );

                      frame.addView(
                          title,
                          new FrameLayout.LayoutParams(
                              -1,
                              dp(60)
                          )
                      );

                      Button cancel =
                          new Button(this);

                      cancel.setText(
                          "CANCEL"
                      );

                      FrameLayout.LayoutParams cp =
                          new FrameLayout.LayoutParams(
                              dp(110),
                              dp(60)
                          );

                      cp.gravity =
                          Gravity.TOP |
                          Gravity.RIGHT;

                      frame.addView(
                          cancel,
                          cp
                      );

                      View touch =
                          new View(this);

                      frame.addView(
                          touch,
                          new FrameLayout.LayoutParams(
                              -1,
                              -1
                          )
                      );

                      title.bringToFront();
                      cancel.bringToFront();

                      touch.setOnTouchListener(
                          (v,e) -> {

                              if (
                                  e.getAction()
                                  ==
                                  MotionEvent.ACTION_UP
                              ) {

                                  saveTemplate(
                                      e.getX(),
                                      e.getY(),
                                      itemMode
                                  );

                                  return true;
                              }

                              return true;
                          }
                      );

                      cancel.setOnClickListener(
                          v -> closeSelector()
                      );

                      selector = frame;

                      wm.addView(
                          frame,
                          fullParams()
                      );

                      setStatus(
                          itemMode
                              ?
                              "SELECT ITEM"
                              :
                              "SELECT MONSTER"
                      );
                  }

                  void saveTemplate(
                          float x,
                          float y,
                          boolean itemMode) {

                      Bitmap screen =
                          CaptureService.copy();

                      if (screen == null) {

                          closeSelector();

                          return;
                      }

                      int vw =
                          Math.max(
                              1,
                              selector.getWidth()
                          );

                      int vh =
                          Math.max(
                              1,
                              selector.getHeight()
                          );

                      int sx =
                          Math.round(
                              x *
                              screen.getWidth() /
                              (float)vw
                          );

                      int sy =
                          Math.round(
                              y *
                              screen.getHeight() /
                              (float)vh
                          );

                      int size = 64;

                      int left =
                          Math.max(
                              0,
                              Math.min(
                                  screen.getWidth()
                                      - size,
                                  sx -
                                  size / 2
                              )
                          );

                      int top =
                          Math.max(
                              0,
                              Math.min(
                                  screen.getHeight()
                                      - size,
                                  sy -
                                  size / 2
                              )
                          );

                      Bitmap template =
                          Bitmap.createBitmap(
                              screen,
                              left,
                              top,
                              size,
                              size
                          );

                      screen.recycle();

                      if (itemMode) {

                          if (
                              item != null &&
                              !item.isRecycled()
                          ) {

                              item.recycle();
                          }

                          item =
                              template;

                          setStatus(
                              "ITEM READY"
                          );

                      } else {

                          if (
                              monster != null &&
                              !monster.isRecycled()
                          ) {

                              monster.recycle();
                          }

                          monster =
                              template;

                          setStatus(
                              "MONSTER READY"
                          );
                      }

                      closeSelector();
                  }

                  void routeMode() {

                      if (selector != null) {

                          return;
                      }

                      FrameLayout frame =
                          new FrameLayout(this);

                      TextView title =
                          text(
                              "แตะจุดเดิน แล้วกด DONE",
                              15
                          );

                      title.setBackgroundColor(
                          0xCC111111
                      );

                      frame.addView(
                          title,
                          new FrameLayout.LayoutParams(
                              -1,
                              dp(60)
                          )
                      );

                      Button done =
                          new Button(this);

                      done.setText(
                          "DONE"
                      );

                      FrameLayout.LayoutParams dp =
                          new FrameLayout.LayoutParams(
                              dp(110),
                              dp(60)
                          );

                      dp.gravity =
                          Gravity.TOP |
                          Gravity.RIGHT;

                      frame.addView(
                          done,
                          dp
                      );

                      View touch =
                          new View(this);

                      frame.addView(
                          touch,
                          new FrameLayout.LayoutParams(
                              -1,
                              -1
                          )
                      );

                      title.bringToFront();
                      done.bringToFront();

                      route.clear();
                      routeIndex = 0;

                      touch.setOnTouchListener(
                          (v,e) -> {

                              if (
                                  e.getAction()
                                  ==
                                  MotionEvent.ACTION_UP
                              ) {

                                  route.add(
                                      new PointF(
                                          e.getX(),
                                          e.getY()
                                      )
                                  );

                                  return true;
                              }

                              return true;
                          }
                      );

                      done.setOnClickListener(
                          v -> {

                              closeSelector();

                              setStatus(
                                  "ROUTE " +
                                  route.size()
                              );
                          }
                      );

                      selector = frame;

                      wm.addView(
                          frame,
                          fullParams()
                      );

                      setStatus(
                          "RECORD ROUTE"
                      );
                  }

                  WindowManager.LayoutParams
                  fullParams() {

                      return new WindowManager.LayoutParams(
                          -1,
                          -1,
                          Build.VERSION.SDK_INT >= 26
                              ?
                              WindowManager.LayoutParams
                                  .TYPE_APPLICATION_OVERLAY
                              :
                              WindowManager.LayoutParams
                                  .TYPE_PHONE,
                          WindowManager.LayoutParams
                              .FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      );
                  }

                  void closeSelector() {

                      if (selector != null) {

                          try {

                              wm.removeView(
                                  selector
                              );

                          } catch (Exception ignored) {
                          }

                          selector = null;
                      }
                  }

                  @Override
                  public void onDestroy() {

                      running = false;

                      closeSelector();

                      if (panel != null) {

                          try {

                              wm.removeView(
                                  panel
                              );

                          } catch (Exception ignored) {
                          }
                      }

                      if (
                          monster != null &&
                          !monster.isRecycled()
                      ) {

                          monster.recycle();
                      }

                      if (
                          item != null &&
                          !item.isRecycled()
                      ) {

                          item.recycle();
                      }

                      if (thread != null) {

                          thread.quitSafely();
                      }

                      instance = null;

                      super.onDestroy();
                  }

                  @Override
                  public IBinder onBind(
                          Intent intent) {

                      return null;
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.7

          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV4.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
