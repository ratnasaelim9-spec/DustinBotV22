package com.dustinbot.v92;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;
import android.graphics.Bitmap;
import android.graphics.Path;
import android.graphics.ColorSpace;
import android.os.Build;
import android.os.Handler;
import android.os.Looper;
import android.view.Display;
import android.view.Gravity;
import android.view.WindowManager;
import android.graphics.PixelFormat;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class BotAccessibility extends AccessibilityService {

    private static BotAccessibility instance;

    private final Handler handler =
        new Handler(Looper.getMainLooper());

    private final ExecutorService screenshotExecutor =
        Executors.newSingleThreadExecutor();

    private WindowManager windowManager;

    private LinearLayout panel;

    private TextView status;

    private BotEngine engine;

    public static BotAccessibility getInstance() {
        return instance;
    }

    @Override
    protected void onServiceConnected() {
        super.onServiceConnected();

        instance = this;

        windowManager =
            (WindowManager) getSystemService(WINDOW_SERVICE);

        engine = new BotEngine(this);

        createPanel();
    }

    private int dp(float value) {
        return (int) (
            value *
            getResources().getDisplayMetrics().density +
            0.5f
        );
    }

    private void createPanel() {

        if (panel != null) {
            return;
        }

        panel = new LinearLayout(this);

        panel.setOrientation(
            LinearLayout.VERTICAL
        );

        panel.setPadding(
            dp(10),
            dp(8),
            dp(10),
            dp(8)
        );

        panel.setGravity(
            Gravity.CENTER
        );

        panel.setBackgroundColor(
            0xEE111111
        );

        status = new TextView(this);

        status.setText(
            "DUSTIN BOT V9.2\nSTOP"
        );

        status.setTextColor(
            0xFFFFFFFF
        );

        status.setTextSize(12);

        status.setGravity(
            Gravity.CENTER
        );

        Button start = new Button(this);

        start.setText("START");

        start.setOnClickListener(v -> {

            if (engine != null) {
                engine.start();
                updateStatus(true);
            }

        });

        Button stop = new Button(this);

        stop.setText("STOP");

        stop.setOnClickListener(v -> {

            if (engine != null) {
                engine.stop();
                updateStatus(false);
            }

        });

        Button hide = new Button(this);

        hide.setText("HIDE");

        hide.setOnClickListener(v -> {

            if (panel != null) {
                panel.setVisibility(View.GONE);
            }

        });

        panel.addView(
            status,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(42)
            )
        );

        panel.addView(
            start,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(48)
            )
        );

        panel.addView(
            stop,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(48)
            )
        );

        panel.addView(
            hide,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(42)
            )
        );

        WindowManager.LayoutParams params =
            new WindowManager.LayoutParams(
                dp(160),
                dp(220),
                WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                PixelFormat.TRANSLUCENT
            );

        params.gravity =
            Gravity.TOP |
            Gravity.END;

        params.x = dp(8);
        params.y = dp(70);

        windowManager.addView(
            panel,
            params
        );
    }

    private void updateStatus(boolean running) {

        if (status == null) {
            return;
        }

        status.setText(
            running
                ? "DUSTIN BOT V9.2\nAI กำลังทำงาน"
                : "DUSTIN BOT V9.2\nSTOP"
        );
    }

    public void later(
        Runnable runnable,
        long delay
    ) {

        if (runnable == null) {
            return;
        }

        handler.postDelayed(
            runnable,
            delay
        );
    }

    public void tap(
        float x,
        float y
    ) {

        Path path = new Path();

        path.moveTo(x, y);

        GestureDescription.StrokeDescription stroke =
            new GestureDescription.StrokeDescription(
                path,
                0,
                60
            );

        GestureDescription gesture =
            new GestureDescription.Builder()
                .addStroke(stroke)
                .build();

        dispatchGesture(
            gesture,
            null,
            null
        );
    }

    public void swipe(
        float x1,
        float y1,
        float x2,
        float y2,
        long duration
    ) {

        Path path = new Path();

        path.moveTo(x1, y1);

        path.lineTo(x2, y2);

        GestureDescription.StrokeDescription stroke =
            new GestureDescription.StrokeDescription(
                path,
                0,
                duration
            );

        GestureDescription gesture =
            new GestureDescription.Builder()
                .addStroke(stroke)
                .build();

        dispatchGesture(
            gesture,
            null,
            null
        );
    }

    public void screenshot(
        ScreenshotCallback callback
    ) {

        if (Build.VERSION.SDK_INT < 30) {
            callback.onFailure();
            return;
        }

        takeScreenshot(
            Display.DEFAULT_DISPLAY,
            screenshotExecutor,
            new TakeScreenshotCallback() {

                @Override
                public void onSuccess(
                    ScreenshotResult result
                ) {

                    try {

                        android.hardware.HardwareBuffer buffer =
                            result.getHardwareBuffer();

                        if (buffer == null) {
                            callback.onFailure();
                            return;
                        }

                        Bitmap hardwareBitmap =
                            Bitmap.wrapHardwareBuffer(
                                buffer,
                                ColorSpace.get(
                                    ColorSpace.Named.SRGB
                                )
                            );

                        buffer.close();

                        if (hardwareBitmap == null) {
                            callback.onFailure();
                            return;
                        }

                        Bitmap bitmap =
                            hardwareBitmap.copy(
                                Bitmap.Config.ARGB_8888,
                                false
                            );

                        hardwareBitmap.recycle();

                        callback.onSuccess(bitmap);

                    } catch (Throwable e) {

                        callback.onFailure();

                    }
                }

                @Override
                public void onFailure(
                    int errorCode
                ) {

                    callback.onFailure();

                }
            }
        );
    }

    public interface ScreenshotCallback {

        void onSuccess(Bitmap bitmap);

        void onFailure();

    }

    @Override
    public void onAccessibilityEvent(
        android.view.accessibility.AccessibilityEvent event
    ) {
    }

    @Override
    public void onInterrupt() {
    }

    @Override
    public void onDestroy() {

        if (engine != null) {
            engine.stop();
        }

        if (panel != null &&
            windowManager != null) {

            try {
                windowManager.removeView(panel);
            } catch (Throwable ignored) {
            }

        }

        screenshotExecutor.shutdownNow();

        instance = null;

        super.onDestroy();
    }
}
