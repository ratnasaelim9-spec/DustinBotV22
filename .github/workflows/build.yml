package com.dustinbot.v41;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;

import android.content.Intent;

import android.graphics.Bitmap;

import android.hardware.display.DisplayManager;

import android.media.Image;
import android.media.ImageReader;

import android.media.projection.MediaProjection;
import android.media.projection.MediaProjectionManager;

import android.os.Handler;
import android.os.HandlerThread;
import android.os.IBinder;

import android.util.DisplayMetrics;

import java.nio.ByteBuffer;

public class CaptureService extends Service {

    public static volatile Bitmap latest;

    public static volatile int captureWidth = 1;
    public static volatile int captureHeight = 1;

    private MediaProjection projection;

    private ImageReader imageReader;

    private android.hardware.display.VirtualDisplay virtualDisplay;

    private HandlerThread captureThread;

    private Handler captureHandler;


    @Override
    public void onCreate() {

        super.onCreate();


        createNotificationChannel();


        startForeground(
                501,
                createNotification()
        );


        captureThread =
                new HandlerThread(
                        "DustinCapture"
                );

        captureThread.start();


        captureHandler =
                new Handler(
                        captureThread.getLooper()
                );
    }


    private void createNotificationChannel() {

        NotificationManager manager =
                (NotificationManager)
                        getSystemService(
                                NOTIFICATION_SERVICE
                        );


        NotificationChannel channel =
                new NotificationChannel(
                        "dustin_capture_v41",
                        "DustinBot Screen Capture",
                        NotificationManager.IMPORTANCE_LOW
                );


        manager.createNotificationChannel(
                channel
        );
    }


    private Notification createNotification() {

        return new Notification.Builder(
                this,
                "dustin_capture_v41"
        )

                .setContentTitle(
                        "DustinBot V4.1"
                )

                .setContentText(
                        "Screen Capture Active"
                )

                .setSmallIcon(
                        android.R.drawable.ic_menu_camera
                )

                .build();
    }


    @Override
    public int onStartCommand(
            Intent intent,
            int flags,
            int startId) {


        if (intent == null) {
            return START_STICKY;
        }


        int resultCode =
                intent.getIntExtra(
                        "resultCode",
                        0
                );


        Intent data = null;


        if (android.os.Build.VERSION.SDK_INT >= 33) {

            data =
                    intent.getParcelableExtra(
                            "data",
                            Intent.class
                    );

        } else {

            data =
                    intent.getParcelableExtra(
                            "data"
                    );
        }


        if (data != null) {

            startCapture(
                    resultCode,
                    data
            );
        }


        return START_STICKY;
    }


    private void startCapture(
            int resultCode,
            Intent data) {


        try {

            MediaProjectionManager manager =
                    (MediaProjectionManager)
                            getSystemService(
                                    MEDIA_PROJECTION_SERVICE
                            );


            projection =
                    manager.getMediaProjection(
                            resultCode,
                            data
                    );


            DisplayMetrics dm =
                    getResources()
                            .getDisplayMetrics();


            int width =
                    dm.widthPixels;


            int height =
                    dm.heightPixels;


            captureWidth = width;
            captureHeight = height;


            imageReader =
                    ImageReader.newInstance(
                            width,
                            height,
                            android.graphics.PixelFormat.RGBA_8888,
                            2
                    );


            imageReader.setOnImageAvailableListener(

                    reader -> {

                        Image image = null;


                        try {

                            image =
                                    reader.acquireLatestImage();


                            if (image == null) {
                                return;
                            }


                            Image.Plane plane =
                                    image.getPlanes()[0];


                            ByteBuffer buffer =
                                    plane.getBuffer();


                            int pixelStride =
                                    plane.getPixelStride();


                            int rowStride =
                                    plane.getRowStride();


                            int rowPadding =
                                    rowStride -
                                    pixelStride * width;


                            int bitmapWidth =
                                    width +
                                    rowPadding /
                                    pixelStride;


                            Bitmap full =
                                    Bitmap.createBitmap(
                                            bitmapWidth,
                                            height,
                                            Bitmap.Config.ARGB_8888
                                    );


                            buffer.rewind();


                            full.copyPixelsFromBuffer(
                                    buffer
                            );


                            Bitmap clean =
                                    Bitmap.createBitmap(
                                            full,
                                            0,
                                            0,
                                            width,
                                            height
                                    );


                            full.recycle();


                            Bitmap old =
                                    latest;


                            latest = clean;


                            if (old != null &&
                                !old.isRecycled()) {

                                old.recycle();
                            }


                        } catch (Exception ignored) {

                        } finally {

                            if (image != null) {
                                image.close();
                            }
                        }

                    },

                    captureHandler
            );


            virtualDisplay =
                    projection.createVirtualDisplay(

                            "DustinBotV41",

                            width,
                            height,

                            dm.densityDpi,

                            DisplayManager
                                    .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,

                            imageReader.getSurface(),

                            null,

                            captureHandler
                    );


        } catch (Exception ignored) {
        }
    }


    public static Bitmap copyLatest() {

        Bitmap source = latest;


        if (source == null ||
            source.isRecycled()) {

            return null;
        }


        try {

            return source.copy(
                    Bitmap.Config.ARGB_8888,
                    false
            );

        } catch (Exception e) {

            return null;
        }
    }


    @Override
    public void onDestroy() {

        if (virtualDisplay != null) {
            virtualDisplay.release();
            virtualDisplay = null;
        }


        if (imageReader != null) {
            imageReader.close();
            imageReader = null;
        }


        if (projection != null) {
            projection.stop();
            projection = null;
        }


        if (captureThread != null) {
            captureThread.quitSafely();
            captureThread = null;
        }


        Bitmap old = latest;

        latest = null;


        if (old != null &&
            !old.isRecycled()) {

            old.recycle();
        }


        super.onDestroy();
    }


    @Override
    public IBinder onBind(
            Intent intent) {

        return null;
    }
}
