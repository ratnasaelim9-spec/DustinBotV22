package com.dustinbot.v41;

import android.app.Activity;

import android.content.Intent;

import android.graphics.Color;

import android.media.projection.MediaProjectionManager;

import android.net.Uri;

import android.os.Build;
import android.os.Bundle;
import android.os.Handler;

import android.provider.Settings;

import android.view.View;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

public class MainActivity extends Activity {

    private static final int CAPTURE_REQUEST = 7001;


    private LinearLayout content;


    private int dp(int value) {

        return (int)
                (
                        value *
                        getResources()
                                .getDisplayMetrics()
                                .density +
                        0.5f
                );
    }


    @Override
    protected void onCreate(
            Bundle savedInstanceState) {

        super.onCreate(
                savedInstanceState
        );


        buildUI();
    }


    private TextView label(
            String value,
            float size) {

        TextView view =
                new TextView(this);


        view.setText(value);

        view.setTextSize(size);

        view.setTextColor(
                Color.DKGRAY
        );


        view.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8)
        );


        return view;
    }


    private Button makeButton(
            String value,
            View.OnClickListener listener) {

        Button button =
                new Button(this);


        button.setText(value);


        button.setOnClickListener(
                listener
        );


        return button;
    }


    private void buildUI() {

        content =
                new LinearLayout(this);


        content.setOrientation(
                LinearLayout.VERTICAL
        );


        content.setPadding(
                dp(12),
                dp(10),
                dp(12),
                dp(20)
        );


        content.addView(
                label(
                        "DUSTIN BOT V4.1",
                        26
                )
        );


        content.addView(
                label(
                        "เดินหา → ล็อกเป้า → โจมตี → เก็บของ → วน",
                        15
                )
        );


        content.addView(
                label(
                        "ขั้นตอนการตั้งค่า",
                        18
                )
        );


        // ----------------------------------------------------------
        // ACCESSIBILITY
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "1. เปิด ACCESSIBILITY",
                        v -> openAccessibility()
                )
        );


        // ----------------------------------------------------------
        // OVERLAY
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "2. เปิด OVERLAY",
                        v -> openOverlaySettings()
                )
        );


        // ----------------------------------------------------------
        // SCREEN CAPTURE
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "3. เริ่ม SCREEN CAPTURE",
                        v -> requestScreenCapture()
                )
        );


        // ----------------------------------------------------------
        // BOT PANEL
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "4. เปิด BOT PANEL",
                        v -> startOverlay()
                )
        );


        content.addView(
                label(
                        "ตั้งค่า BOT",
                        18
                )
        );


        // ----------------------------------------------------------
        // ROUTE
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "5. บันทึกเส้นทางเดิน",
                        v -> {

                            startOverlay();


                            new Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.recordRoute();
                                                }

                                            },
                                            500
                                    );
                        }
                )
        );


        // ----------------------------------------------------------
        // MONSTER
        // ----------------------------------------------------------

        content.addView(
                makeButton(
                        "6. เลือก MONSTER",
                        v -> {

                            startOverlay();


                            new Handler()
                                    .postDelayed(
                                            () -> {

                                                if (BotOverlayService.instance != null) {

                                                    BotOverlayService.instance.selectMonster();
                                                }

                                            },
                                            500
                                    );
