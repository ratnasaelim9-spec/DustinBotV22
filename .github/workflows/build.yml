                      v -> requestCapture()));

                  ax = field("Attack X", "600");
                  ay = field("Attack Y", "700");

                  delay =
                      field("เดินทุก ms", "1800");

                  scan =
                      field("สแกนทุก ms", "900");

                  root.addView(ax);
                  root.addView(ay);
                  root.addView(delay);
                  root.addView(scan);

                  wp =
                      field(
                          "จุดเดิน x,y;x,y...",
                          waypoints);

                  root.addView(wp);

                  TextView mt =
                      new TextView(this);

                  mt.setText(
                      "\nMonster template\n" +
                      "กำหนดกรอบ X Y W H แล้วกดจับภาพ");

                  root.addView(mt);

                  mx = field("Monster X", "0");
                  my = field("Monster Y", "0");
                  mw = field("Monster W", "60");
                  mh = field("Monster H", "60");

                  root.addView(mx);
                  root.addView(my);
                  root.addView(mw);
                  root.addView(mh);

                  root.addView(button(
                      "จับภาพ Monster",
                      v -> captureTemplate(
                          "monster.png",
                          mx, my, mw, mh)));

                  TextView it =
                      new TextView(this);

                  it.setText(
                      "\nItem template\n" +
                      "กำหนดกรอบ X Y W H แล้วกดจับภาพ");

                  root.addView(it);

                  ix = field("Item X", "0");
                  iy = field("Item Y", "0");
                  iw = field("Item W", "50");
                  ih = field("Item H", "50");

                  root.addView(ix);
                  root.addView(iy);
                  root.addView(iw);
                  root.addView(ih);

                  root.addView(button(
                      "จับภาพ Item",
                      v -> captureTemplate(
                          "item.png",
                          ix, iy, iw, ih)));

                  root.addView(button(
                      "บันทึกค่า",
                      v -> save()));

                  root.addView(button(
                      "เปิดปุ่ม BOT",
                      v -> {

                          save();

                          if (!Settings.canDrawOverlays(this)) {
                              toast(
                                  "ต้องเปิด Overlay ก่อน");
                              return;
                          }

                          startService(
                              new Intent(
                                  this,
                                  BotOverlayService.class));
                      }));

                  status =
                      new TextView(this);

                  status.setText(
                      "\nสถานะ: พร้อม\n" +
                      "เปิด Screen Capture แล้วจับภาพ " +
                      "Monster/Item ก่อนเริ่ม BOT");

                  root.addView(status);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);
                  scrollView.addView(root);

                  setContentView(scrollView);
              }

              Button button(
                      String text,
                      View.OnClickListener listener) {

                  Button b =
                      new Button(this);

                  b.setText(text);
                  b.setOnClickListener(listener);

                  return b;
              }

              EditText field(
                      String hint,
                      String value) {

                  EditText e =
                      new EditText(this);

                  e.setHint(hint);
                  e.setText(value);

                  e.setInputType(
                      InputType.TYPE_CLASS_NUMBER |
                      InputType.TYPE_NUMBER_FLAG_DECIMAL);

                  return e;
              }

              float number(EditText e) {
                  return Float.parseFloat(
                      e.getText().toString().trim());
              }

              long integer(EditText e) {
                  return Long.parseLong(
                      e.getText().toString().trim());
              }

              void save() {

                  try {

                      attackX = number(ax);
                      attackY = number(ay);

                      walkDelay =
                          integer(delay);

                      scanDelay =
                          integer(scan);

                      waypoints =
                          wp.getText().toString().trim();

                      toast("บันทึกแล้ว");

                  } catch (Exception e) {

                      toast(
                          "กรุณาตรวจสอบค่า");
                  }
              }

              void captureTemplate(
                      String name,
                      EditText ex,
                      EditText ey,
                      EditText ew,
                      EditText eh) {

                  try {

                      Bitmap screen =
                          CaptureService
                              .getLatestCopy();

                      if (screen == null) {

                          toast(
                              "ต้องเปิด SCREEN CAPTURE ก่อน");

                          return;
                      }

                      int x =
                          (int) number(ex);

                      int y =
                          (int) number(ey);

                      int w =
                          (int) number(ew);

                      int h =
                          (int) number(eh);

                      if (x < 0 ||
                          y < 0 ||
                          w < 5 ||
                          h < 5 ||
                          x + w > screen.getWidth() ||
                          y + h > screen.getHeight()) {

                          screen.recycle();

                          toast(
                              "กรอบอยู่นอกหน้าจอ");

                          return;
                      }

                      Bitmap crop =
                          Bitmap.createBitmap(
                              screen,
                              x,
                              y,
                              w,
                              h);

                      FileOutputStream out =
                          new FileOutputStream(
                              new File(
                                  getFilesDir(),
                                  name));

                      crop.compress(
                          Bitmap.CompressFormat.PNG,
                          100,
                          out);

                      out.close();

                      crop.recycle();
                      screen.recycle();

                      toast(
                          "บันทึก " + name + " แล้ว");

                      if (status != null)
                          status.setText(
                              "\n" +
                              name +
                              " พร้อมใช้งาน");

                  } catch (Exception e) {

                      toast(
                          "จับภาพไม่สำเร็จ");
                  }
              }

              void requestCapture() {
                  MediaProjectionManagerHelper
                      .request(this);
              }

              void toast(String text) {

                  Toast.makeText(
                      this,
                      text,
                      Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data);

                  if (requestCode == 500 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      Intent i =
                          new Intent(
                              this,
                              CaptureService.class);

                      i.putExtra(
                          "resultCode",
                          resultCode);

                      i.putExtra(
                          "data",
                          data);

                      if (Build.VERSION.SDK_INT >= 26)
                          startForegroundService(i);
                      else
                          startService(i);

                      toast(
                          "กำลังเริ่ม Screen Capture");
                  }
              }
          }
          EOF

