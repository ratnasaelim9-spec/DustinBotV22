package com.dustinbot.v42;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;

import android.content.Intent;

import android.graphics.Bitmap;
import android.graphics.Color;
import android.graphics.PointF;

import android.graphics.PixelFormat;

import android.os.Build;
import android.os.Handler;
import android.os.HandlerThread;
import android.os.IBinder;
import android.os.Looper;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.FrameLayout;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.ArrayList;

public class BotOverlayService extends Service {

    public static volatile BotOverlayService instance;

    private WindowManager wm;

    private LinearLayout panel;

    private TextView status;
    private TextView target;

    private HandlerThread aiThread;
    private Handler ai;

    private boolean running;

    private Bitmap monsterTemplate;
    private Bitmap itemTemplate;

    private final ArrayList<PointF> route =
            new ArrayList<>();

    private int routeIndex;

    private View selector;

    private final float threshold = 75f;

    @Override
    public void onCreate() {

        super.onCreate();

        instance = this;

        NotificationManager manager =
                (NotificationManager)
                        getSystemService(
                                NOTIFICATION_SERVICE
                        );

        manager.createNotificationChannel(
                new NotificationChannel(
                        "bot_v42",
                        "DustinBot",
                        NotificationManager.IMPORTANCE_LOW
                )
        );

        Notification notification =
                new Notification.Builder(
                        this,
                        "bot_v42"
                )
                        .setContentTitle(
                                "DustinBot V4.2"
                        )
                        .setContentText(
                                "Bot Panel"
                        )
                        .setSmallIcon(
                                android.R.drawable.ic_media_play
                        )
                        .build();

        startForeground(
                1002,
                notification
        );

        wm =
                (WindowManager)
                        getSystemService(
                                WINDOW_SERVICE
                        );

        aiThread =
                new HandlerThread(
                        "DustinAI"
                );

        aiThread.start();

        ai =
                new Handler(
                        aiThread.getLooper()
                );

        createPanel();
    }

    private int dp(int n) {

        return (int)
                (
                        n *
                        getResources()
                                .getDisplayMetrics()
                                .density +
                        0.5f
                );
    }

    private TextView text(
            String value,
            float size) {

        TextView t =
                new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(Color.WHITE);

        t.setPadding(
                dp(6),
                dp(4),
                dp(6),
                dp(4)
        );

        return t;
    }

    private void createPanel() {

        panel =
                new LinearLayout(this);

        panel.setOrientation(
                LinearLayout.VERTICAL
        );

        panel.setPadding(
                dp(8),
                dp(6),
                dp(8),
                dp(6)
        );

        panel.setBackgroundColor(
                0xDD111111
        );

        status =
                text(
                        "STATUS: STOP",
                        14
                );

        target =
                text(
                        "TARGET: -",
                        13
                );

        panel.addView(status);
        panel.addView(target);

        Button start =
                new Button(this);

        start.setText(
                "BOT START / STOP"
        );

        start.setOnClickListener(
                v -> {

                    if (running) {
                        stopBot();
                    } else {
                        startBot();
                    }
                }
        );

        panel.addView(
                start,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(45)
                )
        );

        WindowManager.LayoutParams p =
                new WindowManager.LayoutParams(
                        dp(280),
                        -2,
                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        p.gravity =
                Gravity.TOP |
                Gravity.RIGHT;

        p.x = dp(5);
        p.y = dp(55);

        wm.addView(
                panel,
                p
        );
    }

    public void startBot() {

        if (!BotAccessibilityService.ready()) {

            setStatus(
                    "ACCESSIBILITY OFF"
            );

            return;
        }

        if (CaptureService.latest == null) {

            setStatus(
                    "SCREEN CAPTURE OFF"
            );

            return;
        }

        if (monsterTemplate == null) {

            setStatus(
                    "MONSTER NOT SET"
            );

            return;
        }

        running = true;

        setStatus(
                "SEARCHING"
        );

        ai.post(
                this::loop
        );
    }

    public void stopBot() {

        running = false;

        setStatus(
                "STOP"
        );
    }

    private void loop() {

        if (!running) {
            return;
        }

        Bitmap screen =
                CaptureService.copy();

        if (screen == null) {

            next(500);

            return;
        }

        TemplateMatcher.Result monster =
                TemplateMatcher.find(
                        screen,
                        monsterTemplate,
                        threshold
                );

        screen.recycle();

        if (monster.found) {

            setStatus(
                    "TARGET LOCK"
            );

            target.setText(
                    "TARGET: " +
                    monster.x +
                    "," +
                    monster.y +
                    " SCORE " +
                    String.format(
                            "%.1f",
                            monster.score
                    )
            );

            BotAccessibilityService service =
                    BotAccessibilityService.instance;

            if (service != null) {

                service.tapBitmap(
                        monster.x,
                        monster.y,
                        CaptureService.width,
                        CaptureService.height
                );

                setStatus(
                        "ATTACKING"
                );
            }

            next(1200);

            return;
        }

        /*
         * ตรวจ Item
         */

        if (itemTemplate != null) {

            Bitmap itemScreen =
                    CaptureService.copy();

            if (itemScreen != null) {

                TemplateMatcher.Result item =
                        TemplateMatcher.find(
                                itemScreen,
                                itemTemplate,
                                threshold
                        );

                itemScreen.recycle();

                if (item.found) {

                    setStatus(
                            "LOOTING"
                    );

                    target.setText(
                            "ITEM: " +
                            item.x +
                            "," +
                            item.y
                    );

                    BotAccessibilityService service =
                            BotAccessibilityService.instance;

                    if (service != null) {

                        service.tapBitmap(
                                item.x,
                                item.y,
                                CaptureService.width,
                                CaptureService.height
                        );
                    }

                    next(900);

                    return;
                }
            }
        }

        /*
         * เดิน
         */

        if (!route.isEmpty()) {

            PointF p =
                    route.get(
                            routeIndex %
                            route.size()
                    );

            routeIndex++;

            BotAccessibilityService service =
                    BotAccessibilityService.instance;

            if (service != null) {

                service.tap(
                        p.x,
                        p.y
                );
            }

            setStatus(
                    "WALKING"
            );

            next(1800);

            return;
        }

        setStatus(
                "SEARCHING"
        );

        next(500);
    }

    private void next(long delay) {

        if (running) {

            ai.postDelayed(
                    this::loop,
                    delay
            );
        }
    }

    public void selectMonster() {

        select(false);
    }

    public void selectItem() {

        select(true);
    }

    private void select(
            boolean itemMode) {

        if (CaptureService.latest == null) {

            setStatus(
                    "SCREEN CAPTURE OFF"
            );

            return;
        }

        if (selector != null) {
            return;
        }

        FrameLayout frame =
                new FrameLayout(this);

        TextView title =
                text(
                        itemMode
                                ?
                                "แตะ ITEM"
                                :
                                "แตะ MONSTER",
                        16
                );

        title.setBackgroundColor(
                0xCC111111
        );

        frame.addView(
                title,
                new FrameLayout.LayoutParams(
                        -1,
                        dp(60)
                )
        );

        Button cancel =
                new Button(this);

        cancel.setText(
                "CANCEL"
        );

        FrameLayout.LayoutParams cp =
                new FrameLayout.LayoutParams(
                        dp(110),
                        dp(60)
                );

        cp.gravity =
                Gravity.TOP |
                Gravity.RIGHT;

        frame.addView(
                cancel,
                cp
        );

        View touch =
                new View(this);

        frame.addView(
                touch,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );

        title.bringToFront();
        cancel.bringToFront();

        touch.setOnTouchListener(
                (v, event) -> {

                    if (event.getAction() ==
                            MotionEvent.ACTION_UP) {

                        saveTemplate(
                                event.getX(),
                                event.getY(),
                                itemMode
                        );

                        return true;
                    }

                    return true;
                }
        );

        cancel.setOnClickListener(
                v -> closeSelector()
        );

        selector = frame;

        WindowManager.LayoutParams p =
                new WindowManager.LayoutParams(
                        -1,
                        -1,
                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,
                        WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                        PixelFormat.TRANSLUCENT
                );

        wm.addView(
                frame,
                p
        );

        setStatus(
                itemMode
                        ?
                        "SELECT ITEM"
                        :
                        "SELECT MONSTER"
        );
    }

    private void saveTemplate(
            float x,
            float y,
            boolean itemMode) {

        Bitmap screen =
                CaptureService.copy();

        if (screen == null) {

            closeSelector();

            return;
        }

        int vw =
                Math.max(
                        1,
                        selector.getWidth()
                );

        int vh =
                Math.max(
                        1,
                        selector.getHeight()
                );

        int sx =
                Math.round(
                        x *
                        screen.getWidth() /
                        (float) vw
                );

        int sy =
                Math.round(
                        y *
                        screen.getHeight() /
                        (float) vh
                );

        int size = 64;

        int left =
                Math.max(
                        0,
                        Math.min(
                                screen.getWidth() - size,
                                sx - size / 2
                        )
                );

        int top =
                Math.max(
                        0,
                        Math.min(
                                screen.getHeight() - size,
                                sy - size / 2
                        )
                );

        Bitmap template =
                Bitmap.createBitmap(
                        screen,
                        left,
                        top,
                        size,
                        size
                );

        screen.recycle();

        if (itemMode) {

            if (itemTemplate != null &&
                !itemTemplate.isRecycled()) {

                itemTemplate.recycle();
            }

            itemTemplate = template;

            setStatus(
                    "ITEM READY"
            );

        } else {

            if (monsterTemplate != null &&
                !monsterTemplate.isRecycled()) {

                monsterTemplate.recycle();
            }

            monsterTemplate = template;

            setStatus(
                    "MONSTER READY"
            );
        }

        closeSelector();
    }

    public void recordRoute() {

        if (selector != null) {
            return;
        }

        FrameLayout frame =
                new FrameLayout(this);

        TextView title =
                text(
                        "แตะจุดเดิน แล้วกด DONE",
                        15
                );

        title.setBackgroundColor(
                0xCC111111
        );

        frame.addView(
                title,
                new FrameLayout.LayoutParams(
                        -1,
                        dp(60)
                )
        );

        Button done =
                new Button(this);

        done.setText(
                "DONE"
        );

        FrameLayout.LayoutParams dp =
                new FrameLayout.LayoutParams(
                        dp(110),
                        dp(60)
                );

        dp.gravity =
                Gravity.TOP |
                Gravity.RIGHT;

        frame.addView(
                done,
                dp
        );

        View touch =
                new View(this);

        frame.addView(
                touch,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );

        title.bringToFront();
        done.bringToFront();

        route.clear();
        routeIndex = 0;

        touch.setOnTouchListener(
                (v, event) -> {

                    if (event.getAction() ==
                            MotionEvent.ACTION_UP) {

                        route.add(
                                new PointF(
                                        event.getX(),
                                        event.getY()
                                )
                        );

                        return true;
                    }

                    return true;
                }
        );

        done.setOnClickListener(
                v -> {

                    closeSelector();

                    setStatus(
                            "ROUTE " +
                            route.size()
                    );
                }
        );

        selector = frame;

        WindowManager.LayoutParams p =
                new WindowManager.LayoutParams(
                        -1,
                        -1,
                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,
                        WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                        PixelFormat.TRANSLUCENT
                );

        wm.addView(
                frame,
                p
        );

        setStatus(
                "RECORD ROUTE"
        );
    }

    private void closeSelector() {

        if (selector != null) {

            try {
                wm.removeView(selector);
            } catch (Exception ignored) {
            }

            selector = null;
        }
    }

    private void setStatus(
            String value) {

        new Handler(
                Looper.getMainLooper()
        ).post(
                () ->
                        status.setText(
                                "STATUS: " +
                                value
                        )
        );
    }

    @Override
    public void onDestroy() {

        running = false;

        closeSelector();

        if (monsterTemplate != null &&
            !monsterTemplate.isRecycled()) {

            monsterTemplate.recycle();
        }

        if (itemTemplate != null &&
            !itemTemplate.isRecycled()) {

            itemTemplate.recycle();
        }

        if (panel != null) {

            try {
                wm.removeView(panel);
            } catch (Exception ignored) {
            }
        }

        if (aiThread != null) {
            aiThread.quitSafely();
        }

        instance = null;

        super.onDestroy();
    }

    @Override
    public IBinder onBind(
            Intent intent) {

        return null;
    }
}
