package com.dustinbot.v42;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Intent;
import android.graphics.Bitmap;
import android.hardware.display.DisplayManager;
import android.media.Image;
import android.media.ImageReader;
import android.media.projection.MediaProjection;
import android.media.projection.MediaProjectionManager;
import android.os.Handler;
import android.os.HandlerThread;
import android.os.IBinder;
import android.util.DisplayMetrics;

import java.nio.ByteBuffer;

public class CaptureService extends Service {

    public static volatile Bitmap latest;

    public static volatile int width = 1;
    public static volatile int height = 1;

    private MediaProjection projection;
    private ImageReader reader;
    private android.hardware.display.VirtualDisplay display;

    private HandlerThread thread;
    private Handler handler;

    @Override
    public void onCreate() {
        super.onCreate();

        NotificationManager manager =
                (NotificationManager)
                        getSystemService(NOTIFICATION_SERVICE);

        manager.createNotificationChannel(
                new NotificationChannel(
                        "capture_v42",
                        "DustinBot Capture",
                        NotificationManager.IMPORTANCE_LOW
                )
        );

        Notification notification =
                new Notification.Builder(
                        this,
                        "capture_v42"
                )
                        .setContentTitle("DustinBot V4.2")
                        .setContentText("Screen Capture")
                        .setSmallIcon(
                                android.R.drawable.ic_menu_camera
                        )
                        .build();

        startForeground(
                1001,
                notification
        );

        thread =
                new HandlerThread("CaptureThread");

        thread.start();

        handler =
                new Handler(thread.getLooper());
    }

    @Override
    public int onStartCommand(
            Intent intent,
            int flags,
            int startId) {

        if (intent == null) {
            return START_STICKY;
        }

        int resultCode =
                intent.getIntExtra(
                        "resultCode",
                        0
                );

        Intent data;

        if (android.os.Build.VERSION.SDK_INT >= 33) {
            data =
                    intent.getParcelableExtra(
                            "data",
                            Intent.class
                    );
        } else {
            data =
                    intent.getParcelableExtra("data");
        }

        if (data != null) {
            startCapture(
                    resultCode,
                    data
            );
        }

        return START_STICKY;
    }

    private void startCapture(
            int resultCode,
            Intent data) {

        try {

            MediaProjectionManager manager =
                    (MediaProjectionManager)
                            getSystemService(
                                    MEDIA_PROJECTION_SERVICE
                            );

            projection =
                    manager.getMediaProjection(
                            resultCode,
                            data
                    );

            DisplayMetrics dm =
                    getResources()
                            .getDisplayMetrics();

            width = dm.widthPixels;
            height = dm.heightPixels;

            reader =
                    ImageReader.newInstance(
                            width,
                            height,
                            android.graphics.PixelFormat.RGBA_8888,
                            2
                    );

            reader.setOnImageAvailableListener(
                    r -> captureFrame(r),
                    handler
            );

            display =
                    projection.createVirtualDisplay(
                            "DustinBotV42",
                            width,
                            height,
                            dm.densityDpi,
                            DisplayManager
                                    .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                            reader.getSurface(),
                            null,
                            handler
                    );

        } catch (Exception ignored) {
        }
    }

    private void captureFrame(
            ImageReader imageReader) {

        Image image = null;

        try {

            image =
                    imageReader.acquireLatestImage();

            if (image == null) {
                return;
            }

            Image.Plane plane =
                    image.getPlanes()[0];

            ByteBuffer buffer =
                    plane.getBuffer();

            int pixelStride =
                    plane.getPixelStride();

            int rowStride =
                    plane.getRowStride();

            int padding =
                    rowStride -
                    pixelStride * width;

            int realWidth =
                    width +
                    padding / pixelStride;

            Bitmap full =
                    Bitmap.createBitmap(
                            realWidth,
                            height,
                            Bitmap.Config.ARGB_8888
                    );

            buffer.rewind();

            full.copyPixelsFromBuffer(buffer);

            Bitmap clean =
                    Bitmap.createBitmap(
                            full,
                            0,
                            0,
                            width,
                            height
                    );

            full.recycle();

            Bitmap old = latest;

            latest = clean;

            if (old != null &&
                !old.isRecycled()) {

                old.recycle();
            }

        } catch (Exception ignored) {

        } finally {

            if (image != null) {
                image.close();
            }
        }
    }

    public static Bitmap copy() {

        Bitmap source = latest;

        if (source == null ||
            source.isRecycled()) {

            return null;
        }

        try {

            return source.copy(
                    Bitmap.Config.ARGB_8888,
                    false
            );

        } catch (Exception e) {

            return null;
        }
    }

    @Override
    public void onDestroy() {

        if (display != null) {
            display.release();
        }

        if (reader != null) {
            reader.close();
        }

        if (projection != null) {
            projection.stop();
        }

        if (thread != null) {
            thread.quitSafely();
        }

        super.onDestroy();
    }

    @Override
    public IBinder onBind(Intent intent) {
        return null;
    }
}
