name: Build DustinBot V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV3"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v2'
                  minSdk 26
                  targetSdk 35
                  versionCode 30
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Dustin Bot V3</string>
              <string name="accessibility_description">Dustin Bot V3 control service</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>

                  <service
                      android:name=".BotOverlayService"
                      android:exported="false"/>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v2/BotAccessibilityService.java <<'EOF'
          package com.dustinbot.v2;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService extends AccessibilityService {

              public static volatile BotAccessibilityService instance;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  if (instance == this) instance = null;
                  super.onDestroy();
              }

              public boolean tap(float x, float y) {
                  if (instance == null) return false;

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path, 0, 70))
                          .build();

                  return dispatchGesture(gesture, null, null);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/CaptureService.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;

          import java.nio.ByteBuffer;

          public class CaptureService extends Service {

              public static volatile Bitmap latest;
              public static volatile boolean running = false;

              private MediaProjection projection;
              private VirtualDisplay display;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler handler;

              private static final String CHANNEL = "dustin_capture";

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {

                  createChannel();

                  Notification n =
                      new Notification.Builder(this, CHANNEL)
                          .setContentTitle("Dustin Bot V3")
                          .setContentText("Screen capture active")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build();

                  startForeground(20, n);

                  if (projection == null && intent != null) {

                      int result =
                          intent.getIntExtra("resultCode", 0);

                      Intent data =
                          intent.getParcelableExtra("data");

                      if (data != null) {

                          MediaProjectionManager m =
                              (MediaProjectionManager)
                                  getSystemService(MEDIA_PROJECTION_SERVICE);

                          projection =
                              m.getMediaProjection(result, data);

                          if (projection != null)
                              startCapture();
                      }
                  }

                  return START_NOT_STICKY;
              }

              private void startCapture() {

                  DisplayMetrics dm =
                      getResources().getDisplayMetrics();

                  final int w = dm.widthPixels;
                  final int h = dm.heightPixels;
                  final int d = dm.densityDpi;

                  thread =
                      new HandlerThread("DustinCapture");

                  thread.start();

                  handler =
                      new Handler(thread.getLooper());

                  reader =
                      ImageReader.newInstance(
                          w,
                          h,
                          android.graphics.PixelFormat.RGBA_8888,
                          2);

                  projection.registerCallback(
                      new MediaProjection.Callback() {
                          @Override
                          public void onStop() {
                              stopCapture();
                          }
                      },
                      handler);

                  reader.setOnImageAvailableListener(r -> {

                      Image image = null;

                      try {

                          image = r.acquireLatestImage();

                          if (image == null)
                              return;

                          Image.Plane plane =
                              image.getPlanes()[0];

                          ByteBuffer buffer =
                              plane.getBuffer();

                          int pixelStride =
                              plane.getPixelStride();

                          int rowStride =
                              plane.getRowStride();

                          int rowPadding =
                              rowStride -
                              pixelStride * w;

                          Bitmap full =
                              Bitmap.createBitmap(
                                  w + rowPadding / pixelStride,
                                  h,
                                  Bitmap.Config.ARGB_8888);

                          full.copyPixelsFromBuffer(buffer);

                          Bitmap crop =
                              Bitmap.createBitmap(
                                  full,
                                  0,
                                  0,
                                  w,
                                  h);

                          full.recycle();

                          Bitmap old = latest;
                          latest = crop;

                          if (old != null)
                              old.recycle();

                          running = true;

                      } catch (Exception ignored) {

                      } finally {

                          if (image != null)
                              image.close();
                      }

                  }, handler);

                  display =
                      projection.createVirtualDisplay(
                          "DustinBotCapture",
                          w,
                          h,
                          d,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(),
                          null,
                          handler);
              }

              public static Bitmap getLatestCopy() {

                  Bitmap b = latest;

                  if (b == null)
                      return null;

                  return b.copy(
                      Bitmap.Config.ARGB_8888,
                      false);
              }

              private void stopCapture() {

                  running = false;

                  if (display != null) {
                      display.release();
                      display = null;
                  }

                  if (reader != null) {
                      reader.close();
                      reader = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  if (thread != null) {
                      thread.quitSafely();
                      thread = null;
                  }
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel c =
                          new NotificationChannel(
                              CHANNEL,
                              "Dustin Bot Capture",
                              NotificationManager.IMPORTANCE_LOW);

                      ((NotificationManager)
                          getSystemService(NOTIFICATION_SERVICE))
                          .createNotificationChannel(c);
                  }
              }

              @Override
              public void onDestroy() {
                  stopCapture();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/TemplateMatcher.java <<'EOF'
          package com.dustinbot.v2;

          import android.graphics.Bitmap;
          import android.graphics.Rect;

          public class TemplateMatcher {

              public static Rect find(
                      Bitmap screen,
                      Bitmap tpl,
                      int step,
                      double threshold) {

                  if (screen == null || tpl == null)
                      return null;

                  int tw = tpl.getWidth();
                  int th = tpl.getHeight();

                  if (tw < 5 ||
                      th < 5 ||
                      tw >= screen.getWidth() ||
                      th >= screen.getHeight())
                      return null;

                  int sampleStep =
                      Math.max(2, Math.min(tw, th) / 10);

                  double best =
                      Double.MAX_VALUE;

                  int bx = -1;
                  int by = -1;

                  int scanStep =
                      Math.max(4, step);

                  for (int y = 0;
                       y <= screen.getHeight() - th;
                       y += scanStep) {

                      for (int x = 0;
                           x <= screen.getWidth() - tw;
                           x += scanStep) {

                          double sum = 0;
                          int n = 0;

                          for (int ty = 0;
                               ty < th;
                               ty += sampleStep) {

                              for (int tx = 0;
                                   tx < tw;
                                   tx += sampleStep) {

                                  int a =
                                      tpl.getPixel(tx, ty);

                                  int b =
                                      screen.getPixel(
                                          x + tx,
                                          y + ty);

                                  int ar = (a >> 16) & 255;
                                  int ag = (a >> 8) & 255;
                                  int ab = a & 255;

                                  int br = (b >> 16) & 255;
                                  int bg = (b >> 8) & 255;
                                  int bb = b & 255;

                                  int diff =
                                      Math.abs(ar - br) +
                                      Math.abs(ag - bg) +
                                      Math.abs(ab - bb);

                                  sum += diff / 3.0;
                                  n++;
                              }
                          }

                          double score =
                              sum / Math.max(1, n);

                          if (score < best) {
                              best = score;
                              bx = x;
                              by = y;
                          }
                      }
                  }

                  if (bx < 0)
                      return null;

                  if (best > threshold)
                      return null;

                  return new Rect(
                      bx,
                      by,
                      bx + tw,
                      by + th);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MediaProjectionManagerHelper.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Context;
          import android.media.projection.MediaProjectionManager;

          public class MediaProjectionManagerHelper {

              public static void request(Activity a) {

                  MediaProjectionManager m =
                      (MediaProjectionManager)
                          a.getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);

                  a.startActivityForResult(
                      m.createScreenCaptureIntent(),
                      500);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android
