          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {

              public static float attackX = 600;
              public static float attackY = 700;

              public static long walkDelay = 1800;
              public static long scanDelay = 900;
              public static long attackDelay = 250;

              public static String waypoints =
                  "300,500;500,500;700,500;700,800;500,800;300,800";

              EditText ax, ay, delay, scan, wp;
              EditText mx, my, mw, mh;
              EditText ix, iy, iw, ih;
              TextView status;

              @Override
              protected void onCreate(Bundle b) {

                  super.onCreate(b);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL);

                  root.setPadding(
                      18, 18, 18, 18);

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "DUSTIN BOT V2.1\n" +
                      "ตรวจภาพ Monster / Item");

                  title.setTextSize(22);

                  root.addView(title);

                  root.addView(button(
                      "1. เปิด ACCESSIBILITY",
                      v -> startActivity(
                          new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS))));

                  root.addView(button(
                      "2. อนุญาต OVERLAY",
