          package com.dustinbot.v2;

          import android.app.*;
          import android.content.*;
          import android.graphics.Bitmap;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.*;
          import android.util.DisplayMetrics;
          import java.nio.ByteBuffer;

          public class CaptureService extends Service {

              public static volatile Bitmap latest;
              public static volatile boolean running = false;

              private MediaProjection projection;
              private VirtualDisplay display;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler handler;

              private static final String CHANNEL = "dustin_capture";

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {

                  createChannel();

                  Notification n =
                      new Notification.Builder(this, CHANNEL)
                          .setContentTitle("Dustin Bot V2.1")
                          .setContentText("Screen capture active")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build();

                  startForeground(20, n);

                  if (projection == null && intent != null) {

                      int result =
                          intent.getIntExtra("resultCode", 0);

                      Intent data =
                          intent.getParcelableExtra("data");

                      if (data != null) {

                          MediaProjectionManager m =
                              (MediaProjectionManager)
                              getSystemService(
                                  MEDIA_PROJECTION_SERVICE);

                          projection =
                              m.getMediaProjection(result, data);

                          if (projection != null)
                              startCapture();
                      }
                  }

                  return START_NOT_STICKY;
              }

              private void startCapture() {

                  DisplayMetrics dm =
                      getResources().getDisplayMetrics();

                  int w = dm.widthPixels;
                  int h = dm.heightPixels;
                  int d = dm.densityDpi;

                  thread =
                      new HandlerThread("DustinCapture");

                  thread.start();

                  handler =
                      new Handler(thread.getLooper());

                  reader =
                      ImageReader.newInstance(
                          w,
                          h,
                          android.graphics.PixelFormat.RGBA_8888,
                          2);

                  projection.registerCallback(
                      new MediaProjection.Callback() {
                          @Override
                          public void onStop() {
                              stopCapture();
                          }
                      },
                      handler);

                  reader.setOnImageAvailableListener(r -> {

                      Image image = null;

                      try {

                          image =
                              r.acquireLatestImage();

                          if (image == null)
                              return;

                          Image.Plane plane =
                              image.getPlanes()[0];

                          ByteBuffer buffer =
                              plane.getBuffer();

                          int pixelStride =
                              plane.getPixelStride();

                          int rowStride =
                              plane.getRowStride();

                          int rowPadding =
                              rowStride -
                              pixelStride * w;

                          Bitmap full =
                              Bitmap.createBitmap(
                                  w + rowPadding /
                                      pixelStride,
                                  h,
                                  Bitmap.Config.ARGB_8888);

                          full.copyPixelsFromBuffer(buffer);

                          Bitmap crop =
                              Bitmap.createBitmap(
                                  full,
                                  0,
                                  0,
                                  w,
                                  h);

                          full.recycle();

                          Bitmap old = latest;

                          latest = crop;

                          if (old != null)
                              old.recycle();

                          running = true;

                      } catch (Exception ignored) {

                      } finally {

                          if (image != null)
                              image.close();
                      }

                  }, handler);

                  display =
                      projection.createVirtualDisplay(
                          "DustinBotCapture",
                          w,
                          h,
                          d,
                          DisplayManager
                              .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(),
                          null,
                          handler);
              }

              public static Bitmap getLatestCopy() {

                  Bitmap b = latest;

                  if (b == null)
                      return null;

                  return b.copy(
                      Bitmap.Config.ARGB_8888,
                      false);
              }

              private void stopCapture() {

                  running = false;

                  if (display != null) {
                      display.release();
                      display = null;
                  }

                  if (reader != null) {
                      reader.close();
                      reader = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  if (thread != null) {
                      thread.quitSafely();
                      thread = null;
                  }
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel c =
                          new NotificationChannel(
                              CHANNEL,
                              "Dustin Bot Capture",
                              NotificationManager
                                  .IMPORTANCE_LOW);

                      ((NotificationManager)
                          getSystemService(
                              NOTIFICATION_SERVICE))
                          .createNotificationChannel(c);
                  }
              }

              @Override
              public void onDestroy() {
                  stopCapture();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/TemplateMatcher.java <<'EOF'
          package com.dustinbot.v2;

          import android.graphics.Bitmap;
          import android.graphics.Rect;

          public class TemplateMatcher {

              public static Rect find(
                      Bitmap screen,
                      Bitmap tpl,
                      int step,
                      double threshold) {

                  if (screen == null || tpl == null)
                      return null;

                  int tw = tpl.getWidth();
                  int th = tpl.getHeight();

                  if (tw < 5 ||
                      th < 5 ||
                      tw >= screen.getWidth() ||
                      th >= screen.getHeight())
                      return null;

                  int sampleStep =
                      Math.max(
                          1,
                          Math.min(tw, th) / 10);

                  double best =
                      Double.MAX_VALUE;

                  int bx = -1;
                  int by = -1;

                  for (
                      int y = 0;
                      y <= screen.getHeight() - th;
                      y += Math.max(2, step)) {

                      for (
                          int x = 0;
                          x <= screen.getWidth() - tw;
                          x += Math.max(2, step)) {

                          double sum = 0;
                          int n = 0;

                          for (
                              int ty = 0;
                              ty < th;
                              ty += sampleStep) {

                              for (
                                  int tx = 0;
                                  tx < tw;
                                  tx += sampleStep) {

                                  int a =
                                      tpl.getPixel(tx, ty);

                                  int b =
                                      screen.getPixel(
                                          x + tx,
                                          y + ty);

                                  int dr =
                                      Math.abs(
                                          ((a >> 16) & 255) -
                                          ((b >> 16) & 255));

                                  int dg =
                                      Math.abs(
                                          ((a >> 8) & 255) -
                                          ((b >> 8) & 255));

                                  int db =
                                      Math.abs(
                                          (a & 255) -
                                          (b & 255));

                                  sum +=
                                      (dr + dg + db)
                                      / 3.0;

                                  n++;
                              }
                          }

                          double score =
                              sum / Math.max(1, n);

                          if (score < best) {
                              best = score;
                              bx = x;
                              by = y;
                          }
                      }
                  }

                  if (bx < 0)
                      return null;

                  if (best > threshold)
                      return null;

                  return new Rect(
                      bx,
                      by,
                      bx + tw,
                      by + th);
              }
          }
          EOF

