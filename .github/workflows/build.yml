          cat > app/src/main/java/com/dustinbot/v4/BotAccessibilityService.java <<'EOG'
          package com.dustinbot.v4;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService extends AccessibilityService {

              public static volatile BotAccessibilityService instance;

              private int displayWidth;
              private int displayHeight;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();

                  instance = this;

                  DisplayMetrics dm = getResources().getDisplayMetrics();

                  displayWidth = dm.widthPixels;
                  displayHeight = dm.heightPixels;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  if (instance == this) {
                      instance = null;
                  }

                  super.onDestroy();
              }

              public static boolean ready() {
                  return instance != null;
              }

              public boolean tapBitmap(
                      float bitmapX,
                      float bitmapY,
                      int bitmapWidth,
                      int bitmapHeight) {

                  if (bitmapWidth <= 0 ||
                      bitmapHeight <= 0 ||
                      displayWidth <= 0 ||
                      displayHeight <= 0) {

                      return false;
                  }

                  float x =
                          bitmapX *
                          displayWidth /
                          (float) bitmapWidth;

                  float y =
                          bitmapY *
                          displayHeight /
                          (float) bitmapHeight;

                  return tapScreen(x, y);
              }

              public boolean tapScreen(float x, float y) {

                  if (x < 0) x = 0;
                  if (y < 0) y = 0;

                  if (x >= displayWidth) {
                      x = displayWidth - 1;
                  }

                  if (y >= displayHeight) {
                      y = displayHeight - 1;
                  }

                  Path path = new Path();

                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  60
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  return dispatchGesture(
                          gesture,
                          null,
                          null
                  );
              }
          }
          EOG

          cat > app/src/main/java/com/dustinbot/v4/CaptureService.java <<'EOG'
          package com.dustinbot.v4;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.hardware.display.DisplayManager;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;

          import java.nio.ByteBuffer;

          public class CaptureService extends Service {

              public static volatile Bitmap latest;

              public static volatile int captureW;
              public static volatile int captureH;

              private MediaProjection projection;
              private ImageReader reader;
              private android.hardware.display.VirtualDisplay display;

              private HandlerThread thread;
              private Handler handler;

              private static final int NOTIFICATION_ID = 401;

              @Override
              public void onCreate() {

                  super.onCreate();

                  createChannel();

                  startForeground(
                          NOTIFICATION_ID,
                          createNotification()
                  );

                  thread =
                          new HandlerThread("DustinCapture");

                  thread.start();

                  handler =
                          new Handler(thread.getLooper());
              }

              private void createChannel() {

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE
                                  );

                  NotificationChannel channel =
                          new NotificationChannel(
                                  "dustin_capture",
                                  "DustinBot Capture",
                                  NotificationManager.IMPORTANCE_LOW
                          );

                  manager.createNotificationChannel(channel);
              }

              private Notification createNotification() {

                  return new Notification.Builder(
                          this,
                          "dustin_capture"
                  )
                          .setContentTitle(
                                  "DustinBot V4"
                          )
                          .setContentText(
                                  "Screen Capture Active"
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_menu_camera
                          )
                          .build();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  if (intent != null &&
                      intent.hasExtra("resultCode")) {

                      int resultCode =
                              intent.getIntExtra(
                                      "resultCode",
                                      0
                              );

                      Intent data =
                              intent.getParcelableExtra(
                                      "data"
                              );

                      if (data != null) {
                          startProjection(
                                  resultCode,
                                  data
                          );
                      }
                  }

                  return START_STICKY;
              }

              private void startProjection(
                      int resultCode,
                      Intent data) {

                  try {

                      MediaProjectionManager manager =
                              (MediaProjectionManager)
                                      getSystemService(
                                              MEDIA_PROJECTION_SERVICE
                                      );

                      projection =
                              manager.getMediaProjection(
                                      resultCode,
                                      data
                              );

                      DisplayMetrics dm =
                              getResources()
                                      .getDisplayMetrics();

                      int width =
                              dm.widthPixels;

                      int height =
                              dm.heightPixels;

                      captureW = width;
                      captureH = height;

                      reader =
                              ImageReader.newInstance(
                                      width,
                                      height,
                                      android.graphics.PixelFormat.RGBA_8888,
                                      2
                              );

                      reader.setOnImageAvailableListener(
                              imageReader -> {

                                  Image image = null;

                                  try {

                                      image =
                                              imageReader
                                                      .acquireLatestImage();

                                      if (image == null) {
                                          return;
                                      }

                                      Image.Plane plane =
                                              image.getPlanes()[0];

                                      ByteBuffer buffer =
                                              plane.getBuffer();

                                      int pixelStride =
                                              plane.getPixelStride();

                                      int rowStride =
                                              plane.getRowStride();

                                      int rowPadding =
                                              rowStride -
                                              pixelStride *
                                              width;

                                      Bitmap bitmap =
                                              Bitmap.createBitmap(
                                                      width +
                                                              rowPadding /
                                                                      pixelStride,
                                                      height,
                                                      Bitmap.Config.ARGB_8888
                                              );

                                      buffer.rewind();

                                      bitmap.copyPixelsFromBuffer(
                                              buffer
                                      );

                                      Bitmap clean =
                                              Bitmap.createBitmap(
                                                      bitmap,
                                                      0,
                                                      0,
                                                      width,
                                                      height
                                              );

                                      bitmap.recycle();

                                      Bitmap old =
                                              latest;

                                      latest =
                                              clean;

                                      if (old != null &&
                                          !old.isRecycled()) {

                                          old.recycle();
                                      }

                                  } catch (Exception ignored) {

                                  } finally {

                                      if (image != null) {
                                          image.close();
                                      }
                                  }

                              },
                              handler
                      );

                      display =
                              projection.createVirtualDisplay(
                                      "DustinBotScreen",
                                      width,
                                      height,
                                      dm.densityDpi,
                                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                      reader.getSurface(),
                                      null,
                                      handler
                              );

                  } catch (Exception ignored) {
                  }
              }

              public static Bitmap copyLatest() {

                  Bitmap bitmap =
                          latest;

                  if (bitmap == null ||
                      bitmap.isRecycled()) {

                      return null;
                  }

                  return bitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          false
                  );
              }

              @Override
              public void onDestroy() {

                  if (display != null) {
                      display.release();
                  }

                  if (reader != null) {
                      reader.close();
                  }

                  if (projection != null) {
                      projection.stop();
                  }

                  if (thread != null) {
                      thread.quitSafely();
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOG

          cat > app/src/main/java/com/dustinbot/v4/TemplateMatcher.java <<'EOG'
          package com.dustinbot.v4;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class TemplateMatcher {

              public static class Result {

                  public boolean found;
                  public float score;

                  public int cx;
                  public int cy;

                  public int w;
                  public int h;
              }

              public static Result find(
                      Bitmap screen,
                      Bitmap template,
                      int threshold) {

                  Result result =
                          new Result();

                  if (screen == null ||
                      template == null ||
                      screen.isRecycled() ||
                      template.isRecycled()) {

                      return result;
                  }

                  int tw =
                          Math.min(
                                  96,
                                  template.getWidth()
                          );

                  int th =
                          Math.min(
                                  96,
                                  template.getHeight()
                          );

                  if (tw < 16 ||
                      th < 16 ||
                      screen.getWidth() < tw ||
                      screen.getHeight() < th) {

                      return result;
                  }

                  Bitmap smallTemplate =
                          Bitmap.createScaledBitmap(
                                  template,
                                  tw,
                                  th,
                                  false
                          );

                  int scanStep = 5;
                  int featureStep = 4;

                  int sw =
                          screen.getWidth();

                  int sh =
                          screen.getHeight();

                  double bestScore =
                          Double.MAX_VALUE;

                  int bestX = 0;
                  int bestY = 0;

                  for (
                          int y = 0;
                          y <= sh - th;
                          y += scanStep
                  ) {

                      for (
                              int x = 0;
                              x <= sw - tw;
                              x += scanStep
                      ) {

                          double score = 0;

                          int count = 0;

                          for (
                                  int gy = featureStep;
                                  gy < th - featureStep;
                                  gy += featureStep
                          ) {

                              for (
                                      int gx = featureStep;
                                      gx < tw - featureStep;
                                      gx += featureStep
                              ) {

                                  int tc =
                                          smallTemplate.getPixel(
                                                  gx,
                                                  gy
                                          );

                                  int sc =
                                          screen.getPixel(
                                                  x + gx,
                                                  y + gy
                                          );

                                  int tg =
                                          gray(tc);

                                  int sg =
                                          gray(sc);

                                  int tgx =
                                          gray(
                                                  smallTemplate.getPixel(
                                                          gx + 1,
                                                          gy
                                                  )
                                          ) -
                                          gray(
                                                  smallTemplate.getPixel(
                                                          gx - 1,
                                                          gy
                                                  )
                                          );

                                  int sgx =
                                          gray(
                                                  screen.getPixel(
                                                          x + gx + 1,
                                                          y + gy
                                                  )
                                          ) -
                                          gray(
                                                  screen.getPixel(
                                                          x + gx - 1,
                                                          y + gy
                                                  )
                                          );

                                  int tgy =
                                          gray(
                                                  smallTemplate.getPixel(
                                                          gx,
                                                          gy + 1
                                                  )
                                          ) -
                                          gray(
                                                  smallTemplate.getPixel(
                                                          gx,
                                                          gy - 1
                                                  )
                                          );

                                  int sgy =
                                          gray(
                                                  screen.getPixel(
                                                          x + gx,
                                                          y + gy + 1
                                                  )
                                          ) -
                                          gray(
                                                  screen.getPixel(
                                                          x + gx,
                                                          y + gy - 1
                                                  )
                                          );

                                  score +=
                                          Math.abs(
                                                  tgx - sgx
                                          ) +
                                          Math.abs(
                                                  tgy - sgy
                                          );

                                  score +=
                                          Math.abs(
                                                  tg - sg
                                          ) *
                                          0.15;

                                  count++;
                              }
                          }

                          score /=
                                  Math.max(
                                          1,
                                          count
                                  );

                          if (score <
                              bestScore) {

                              bestScore =
                                      score;

                              bestX = x;
                              bestY = y;
                          }
                      }
                  }

                  smallTemplate.recycle();

                  result.score =
                          (float) bestScore;

                  result.cx =
                          bestX + tw / 2;

                  result.cy =
                          bestY + th / 2;

                  result.w = tw;
                  result.h = th;

                  result.found =
                          bestScore <= threshold;

                  return result;
              }

              private static int gray(int color) {

                  return (
                          Color.red(color) * 30 +
                          Color.green(color) * 59 +
                          Color.blue(color) * 11
                  ) / 100;
              }
          }
          EOG

          cat > app/src/main/java/com/dustinbot/v4/BotOverlayService.java <<'EOG'
          package com.dustinbot.v4;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.PointF;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayDeque;
          import java.util.ArrayList;

          public class BotOverlayService extends Service {

              public static volatile BotOverlayService instance;

              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView status;
              private TextView target;
              private TextView console;

              private View selector;

              private HandlerThread botThread;
              private Handler botHandler;

              private boolean running = false;

              private Bitmap monsterTemplate;
              private Bitmap itemTemplate;

              private final ArrayList<PointF> route =
                      new ArrayList<>();

              private int routeIndex = 0;

              private final ArrayDeque<String> log =
                      new ArrayDeque<>();

              private int threshold = 70;

              private int scanDelay = 450;

              private int attackDelay = 1100;

              private int lootDelay = 700;

              @Override
              public void onCreate() {

                  super.onCreate();

                  instance = this;

                  createNotificationChannel();

                  startForeground(
                          402,
                          createNotification()
                  );

                  windowManager =
                          (WindowManager)
                                  getSystemService(
                                          WINDOW_SERVICE
                                  );

                  buildPanel();

                  botThread =
                          new HandlerThread(
                                  "DustinBotAI"
                          );

                  botThread.start();

                  botHandler =
                          new Handler(
                                  botThread.getLooper()
                          );
              }

              private int dp(int value) {

                  return (int)
                          (
                                  value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density +
                                  0.5f
                          );
              }

              private void createNotificationChannel() {

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE
                                  );

                  NotificationChannel channel =
                          new NotificationChannel(
                                  "dustin_bot",
                                  "DustinBot",
                                  NotificationManager.IMPORTANCE_LOW
                          );

                  manager.createNotificationChannel(
                          channel
                  );
              }

              private Notification createNotification() {

                  return new Notification.Builder(
                          this,
                          "dustin_bot"
                  )
                          .setContentTitle(
                                  "DustinBot V4"
                          )
                          .setContentText(
                                  "Bot Panel Active"
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_media_play
                          )
                          .build();
              }

              private TextView text(
                      String text,
                      float size) {

                  TextView view =
                          new TextView(this);

                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(
                          Color.WHITE
                  );

                  view.setPadding(
                          dp(6),
                          dp(3),
                          dp(6),
                          dp(3)
                  );

                  return view;
              }

              private void buildPanel() {

                  panel =
                          new LinearLayout(this);

                  panel.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                          dp(8),
                          dp(5),
                          dp(8),
                          dp(5)
                  );

                  panel.setBackgroundColor(
                          0xDD111111
                  );

                  status =
                          text(
                                  "STATUS: STOP",
                                  14
                          );

                  target =
                          text(
                                  "TARGET: -",
                                  13
                          );

                  console =
                          text(
                                  "READY",
                                  11
                          );

                  console.setMaxLines(6);

                  panel.addView(status);
                  panel.addView(target);
                  panel.addView(console);

                  Button button =
                          new Button(this);

                  button.setText(
                          "BOT START / STOP"
                  );

                  button.setOnClickListener(
                          v -> toggleBot()
                  );

                  panel.addView(
                          button,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(44)
                          )
                  );

                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(
                                  dp(270),
                                  -2,
                                  Build.VERSION.SDK_INT >= 26
                                          ?
                                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                          :
                                          WindowManager.LayoutParams.TYPE_PHONE,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT
                          );

                  params.gravity =
                          Gravity.TOP |
                          Gravity.RIGHT;

                  params.x = dp(6);
                  params.y = dp(60);

                  windowManager.addView(
                          panel,
                          params
                  );
              }

              private void toggleBot() {

                  if (running) {
                      stopBot();
                  } else {
                      startBot();
                  }
              }

              public void startBot() {

                  if (!BotAccessibilityService.ready()) {

                      say(
                              "ERROR: เปิด Accessibility"
                      );

                      return;
                  }

                  if (CaptureService.latest == null) {

                      say(
                              "ERROR: เปิด Screen Capture"
                      );

                      return;
                  }

                  if (monsterTemplate == null) {

                      say(
                              "ERROR: เลือก Monster ก่อน"
                      );

                      return;
                  }

                  running = true;

                  status.setText(
                          "STATUS: SEARCHING"
                  );

                  say(
                          "BOT START"
                  );

                  botHandler.post(
                          this::botLoop
                  );
              }

              public void stopBot() {

                  running = false;

                  status.setText(
                          "STATUS: STOP"
                  );

                  say(
                          "BOT STOP"
                  );
              }

              private void botLoop() {

                  if (!running) {
                      return;
                  }

                  Bitmap screen =
                          CaptureService.copyLatest();

                  if (screen == null) {

                      botHandler.postDelayed(
                              this::botLoop,
                              scanDelay
                      );

                      return;
                  }

                  TemplateMatcher.Result monster =
                          TemplateMatcher.find(
                                  screen,
                                  monsterTemplate,
                                  threshold
                          );

                  screen.recycle();

                  if (monster.found) {

                      target.setText(
                              String.format(
                                      "TARGET: %d,%d  score %.1f",
                                      monster.cx,
                                      monster.cy,
                                      monster.score
                              )
                      );

                      status.setText(
                              "STATUS: TARGET LOCK"
                      );

                      say(
                              "TARGET FOUND " +
                              monster.cx +
                              "," +
                              monster.cy
                      );

                      BotAccessibilityService accessibility =
                              BotAccessibilityService.instance;

                      if (accessibility != null) {

                          accessibility.tapBitmap(
                                  monster.cx,
                                  monster.cy,
                                  CaptureService.captureW,
                                  CaptureService.captureH
                          );

                          status.setText(
                                  "STATUS: ATTACKING"
                          );

                          say(
                                  "ATTACK"
                          );
                      }

                      botHandler.postDelayed(
                              this::botLoop,
                              attackDelay
                      );

                      return;
                  }

                  /*
                   * ไม่มี Monster
                   * ตรวจหา Item ก่อน
                   */
                  if (itemTemplate != null) {

                      Bitmap itemScreen =
                              CaptureService.copyLatest();

                      if (itemScreen != null) {

                          TemplateMatcher.Result item =
                                  TemplateMatcher.find(
                                          itemScreen,
                                          itemTemplate,
                                          threshold
                                  );

                          itemScreen.recycle();

                          if (item.found) {

                              target.setText(
                                      String.format(
                                              "ITEM: %d,%d score %.1f",
                                              item.cx,
                                              item.cy,
                                              item.score
                                      )
                              );

                              status.setText(
                                      "STATUS: LOOTING"
                              );

                              say(
                                      "ITEM FOUND " +
                                      item.cx +
                                      "," +
                                      item.cy
                              );

                              BotAccessibilityService accessibility =
                                      BotAccessibilityService.instance;

                              if (accessibility != null) {

                                  accessibility.tapBitmap(
                                          item.cx,
                                          item.cy,
                                          CaptureService.captureW,
                                          CaptureService.captureH
                                  );
                              }

                              botHandler.postDelayed(
                                      this::botLoop,
                                      lootDelay
                              );

                              return;
                          }
                      }
                  }

                  /*
                   * ไม่มี Monster / Item
                   * เดินตามเส้นทางที่บันทึกไว้
                   */
                  if (!route.isEmpty()) {

                      PointF point =
                              route.get(
                                      routeIndex %
                                      route.size()
                              );

                      routeIndex++;

                      BotAccessibilityService accessibility =
                              BotAccessibilityService.instance;

                      if (accessibility != null) {

                          accessibility.tapScreen(
                                  point.x,
                                  point.y
                          );

                          status.setText(
                                  "STATUS: WALKING"
                          );

                          say(
                                  "WALK POINT " +
                                  (
                                          routeIndex %
                                          route.size()
                                  )
                          );
                      }

                      botHandler.postDelayed(
                              this::botLoop,
                              1800
                      );

                  } else {

                      status.setText(
                              "STATUS: SEARCHING"
                      );

                      botHandler.postDelayed(
                              this::botLoop,
                              scanDelay
                      );
                  }
              }

              public void recordRoute() {

                  if (CaptureService.latest == null) {

                      say(
                              "เปิด Screen Capture ก่อน"
                      );

                      return;
                  }

                  route.clear();
                  routeIndex = 0;

                  FrameLayout box =
                          new FrameLayout(this);

                  View touchView =
                          new View(this);

                  touchView.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  box.addView(
                          touchView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  TextView hint =
                          text(
                                  "แตะจุดเดินทีละจุด",
                                  14
                          );

                  hint.setBackgroundColor(
                          0xCC111111
                  );

                  FrameLayout.LayoutParams hintParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(55)
                          );

                  hintParams.gravity =
                          Gravity.TOP;

                  box.addView(
                          hint,
                          hintParams
                  );

                  Button done =
                          new Button(this);

                  done.setText(
                          "DONE"
                  );

                  FrameLayout.LayoutParams doneParams =
                          new FrameLayout.LayoutParams(
                                  dp(110),
                                  dp(55)
                          );

                  doneParams.gravity =
                          Gravity.TOP |
                          Gravity.RIGHT;

                  box.addView(
                          done,
                          doneParams
                  );

                  hint.bringToFront();
                  done.bringToFront();

                  touchView.setOnTouchListener(
                          (view, event) -> {

                              if (event.getAction() ==
                                  MotionEvent.ACTION_UP) {

                                  route.add(
                                          new PointF(
                                                  event.getX(),
                                                  event.getY()
                                          )
                                  );

                                  say(
                                          "ROUTE POINT " +
                                          route.size()
                                  );

                                  return true;
                              }

                              return true;
                          }
                  );

                  done.setOnClickListener(
                          v -> {

                              windowManager.removeView(
                                      box
                              );

                              selector = null;

                              status.setText(
                                      "STATUS: ROUTE " +
                                      route.size()
                              );

                              say(
                                      "ROUTE READY"
                              );
                          }
                  );

                  selector = box;

                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(
                                  -1,
                                  -1,
                                  Build.VERSION.SDK_INT >= 26
                                          ?
                                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                          :
                                          WindowManager.LayoutParams.TYPE_PHONE,
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT
                          );

                  windowManager.addView(
                          box,
                          params
                  );

                  status.setText(
                          "STATUS: RECORD ROUTE"
                  );

                  say(
                          "แตะจุดเดิน แล้วกด DONE"
                  );
              }

              public void selectMonster() {

                  selectTemplate(false);
              }

              public void selectItem() {

                  selectTemplate(true);
              }

              private void selectTemplate(
                      boolean item) {

                  if (CaptureService.latest == null) {

                      say(
                              "เปิด Screen Capture ก่อน"
                      );

                      return;
                  }

                  final boolean itemMode =
                          item;

                  selector =
                          new View(this) {

                              android.graphics.Paint paint =
                                      new android.graphics.Paint();

                              @Override
                              protected void onDraw(
                                      android.graphics.Canvas canvas) {

                                  paint.setStyle(
                                          android.graphics.Paint.Style.STROKE
                                  );

                                  paint.setStrokeWidth(
                                          dp(2)
                                  );

                                  paint.setColor(
                                          itemMode
                                                  ?
                                                  0xAAFFD000
                                                  :
                                                  0xAA00FF66
                                  );

                                  canvas.drawRect(
                                          getWidth() / 2 -
                                                  dp(35),
                                          getHeight() / 2 -
                                                  dp(35),
                                          getWidth() / 2 +
                                                  dp(35),
                                          getHeight() / 2 +
                                                  dp(35),
                                          paint
                                  );
                              }
                          };

                  selector.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  selector.setOnTouchListener(
                          (view, event) -> {

                              if (event.getAction() ==
                                  MotionEvent.ACTION_UP) {

                                  captureTemplateAt(
                                          (int) event.getX(),
                                          (int) event.getY(),
                                          itemMode
                                  );

                                  return true;
                              }

                              return true;
                          }
                  );

                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(
                                  -1,
                                  -1,
                                  Build.VERSION.SDK_INT >= 26
                                          ?
                                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                          :
                                          WindowManager.LayoutParams.TYPE_PHONE,
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT
                          );

                  windowManager.addView(
                          selector,
                          params
                  );

                  status.setText(
                          itemMode
                                  ?
                                  "STATUS: TAP ITEM"
                                  :
                                  "STATUS: TAP MONSTER"
                  );

                  say(
                          itemMode
                                  ?
                                  "แตะ Item 1 ครั้ง"
                                  :
                                  "แตะ Monster 1 ครั้ง"
                  );
              }

              private void captureTemplateAt(
                      int x,
                      int y,
                      boolean item) {

                  Bitmap screen =
                          CaptureService.copyLatest();

                  if (screen == null) {

                      closeSelector();

                      return;
                  }

                  int viewWidth =
                          Math.max(
                                  1,
                                  selector.getWidth()
                          );

                  int viewHeight =
                          Math.max(
                                  1,
                                  selector.getHeight()
                          );

                  int sx =
                          Math.round(
                                  x *
                                  CaptureService.captureW /
                                  (float) viewWidth
                          );

                  int sy =
                          Math.round(
                                  y *
                                  CaptureService.captureH /
                                  (float) viewHeight
                          );

                  int size =
                          Math.min(
                                  96,
                                  Math.min(
                                          screen.getWidth(),
                                          screen.getHeight()
                                  )
                          );

                  int left =
                          Math.max(
                                  0,
                                  Math.min(
                                          screen.getWidth() -
                                                  size,
                                          sx -
                                                  size / 2
                                  )
                          );

                  int top =
                          Math.max(
                                  0,
                                  Math.min(
                                          screen.getHeight() -
                                                  size,
                                          sy -
                                                  size / 2
                                  )
                          );

                  Bitmap template =
                          Bitmap.createBitmap(
                                  screen,
                                  left,
                                  top,
                                  size,
                                  size
                          );

                  screen.recycle();

                  if (item) {

                      if (itemTemplate != null &&
                          !itemTemplate.isRecycled()) {

                          itemTemplate.recycle();
                      }

                      itemTemplate =
                              template;

                      say(
                              "ITEM TEMPLATE READY"
                      );

                      status.setText(
                              "STATUS: ITEM READY"
                      );

                  } else {

                      if (monsterTemplate != null &&
                          !monsterTemplate.isRecycled()) {

                          monsterTemplate.recycle();
                      }

                      monsterTemplate =
                              template;

                      say(
                              "MONSTER TEMPLATE READY"
                      );

                      status.setText(
                              "STATUS: MONSTER READY"
                      );
                  }

                  closeSelector();
              }

              private void closeSelector() {

                  if (selector != null) {

                      try {
                          windowManager.removeView(
                                  selector
                          );
                      } catch (Exception ignored) {
                      }

                      selector = null;
                  }
              }

              private void say(String message) {

                  log.addFirst(message);

                  while (log.size() > 6) {
                      log.removeLast();
                  }

                  StringBuilder builder =
                          new StringBuilder();

                  for (String line : log) {

                      builder.append(
                              line
                      );

                      builder.append(
                              "\n"
                      );
                  }

                  new Handler(
                          Looper.getMainLooper()
                  ).post(
                          () ->
                                  console.setText(
                                          builder
                                                  .toString()
                                                  .trim()
                                  )
                  );
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  running = false;

                  closeSelector();

                  if (panel != null) {

                      try {
                          windowManager.removeView(
                                  panel
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  if (monsterTemplate != null &&
                      !monsterTemplate.isRecycled()) {

                      monsterTemplate.recycle();
                  }

                  if (itemTemplate != null &&
                      !itemTemplate.isRecycled()) {

                      itemTemplate.recycle();
                  }

                  if (botThread != null) {
                      botThread.quitSafely();
                  }

                  instance = null;

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }
          }
