name: Build DustinBot V4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app gradle build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v4
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOG'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'DustinBotV4'
          include ':app'
          EOG

          cat > build.gradle <<'EOG'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOG

          cat > gradle.properties <<'EOG'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOG

          cat > app/build.gradle <<'EOG'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v4'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v4'
                  minSdk 26
                  targetSdk 35
                  versionCode 40
                  versionName '4.0'
              }
          }
          EOG

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOG'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true" />
          EOG

          cat > app/src/main/res/values/styles.xml <<'EOG'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOG

          cat > app/src/main/AndroidManifest.xml <<'EOG'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="DustinBot V4"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".CaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

                  <service
                      android:name=".BotOverlayService"
                      android:exported="false" />

              </application>

          </manifest>
