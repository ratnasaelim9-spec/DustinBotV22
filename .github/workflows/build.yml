          package com.dustinbot.v2;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import java.io.File;

          public class BotOverlayService extends Service {

              private WindowManager wm;
              private LinearLayout box;
              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private volatile boolean running = false;

              private int waypointIndex = 0;

              private Bitmap monster;
              private Bitmap item;

              private final Runnable loop =
                  new Runnable() {

                      @Override
                      public void run() {

                          if (!running)
                              return;

                          try {

                              Bitmap screen =
                                  CaptureService
                                      .getLatestCopy();

                              BotAccessibilityService access =
                                  BotAccessibilityService
                                      .instance;

                              if (screen != null &&
                                  access != null) {

                                  if (monster == null)
                                      monster =
                                          load(
                                              "monster.png");

                                  if (item == null)
                                      item =
                                          load(
                                              "item.png");

                                  boolean acted = false;

                                  if (monster != null) {

                                      Rect target =
                                          TemplateMatcher.find(
                                              screen,
                                              monster,
                                              12,
                                              55);

                                      if (target != null) {

                                          access.tap(
                                              target.centerX(),
                                              target.centerY());

                                          handler.postDelayed(
                                              () -> {

                                                  if (running &&
                                                      BotAccessibilityService
                                                          .instance != null) {

                                                      BotAccessibilityService
                                                          .instance.tap(
                                                              MainActivity.attackX,
                                                              MainActivity.attackY);
                                                  }

                                              },
                                              MainActivity.attackDelay);

                                          acted = true;
                                      }
                                  }

                                  if (!acted &&
                                      item != null) {

                                      Rect target =
                                          TemplateMatcher.find(
                                              screen,
                                              item,
                                              12,
                                              55);

                                      if (target != null) {

                                          access.tap(
                                              target.centerX(),
                                              target.centerY());

                                          acted = true;
                                      }
                                  }

                                  if (!acted)
                                      walk(access);

                                  screen.recycle();
                              }

                          } catch (Exception ignored) {
                          }

                          handler.postDelayed(
                              this,
                              Math.max(
                                  300,
                                  MainActivity.scanDelay));
                      }
                  };

              private Bitmap load(String name) {

                  try {

                      return BitmapFactory.decodeFile(
                          new File(
                              getFilesDir(),
                              name)
                              .getAbsolutePath());

                  } catch (Exception e) {

                      return null;
                  }
              }

              private void walk(
                      BotAccessibilityService access) {

                  if (MainActivity.waypoints == null)
                      return;

                  String[] points =
                      MainActivity.waypoints
                          .split(";");

                  if (points.length == 0)
                      return;

                  try {

                      String[] p =
                          points[
                              waypointIndex %
                              points.length]
                          .trim()
                          .split(",");

                      if (p.length == 2) {

                          access.tap(
                              Float.parseFloat(p[0]),
                              Float.parseFloat(p[1]));

                          waypointIndex++;
                      }

                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onCreate() {

                  super.onCreate();

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE);

                  box =
                      new LinearLayout(this);

                  box.setOrientation(
                      LinearLayout.HORIZONTAL);

                  box.setPadding(
                      8, 8, 8, 8);

                  box.setBackgroundColor(
                      Color.argb(
                          230,
                          20,
                          20,
                          20));

                  Button bot =
                      new Button(this);

                  bot.setText("BOT");

                  bot.setOnClickListener(
                      v -> startBot());

                  box.addView(bot);

                  Button stop =
                      new Button(this);

                  stop.setText("STOP");

                  stop.setOnClickListener(
                      v -> stopBot());

                  box.addView(stop);

                  int type =
                      android.os.Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams
                          .TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams
                          .TYPE_PHONE;

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams
                              .FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.LEFT;

                  lp.x = 15;
                  lp.y = 150;

                  wm.addView(box, lp);
              }

              private void startBot() {

                  if (CaptureService.latest == null) {

                      Toast.makeText(
                          this,
                          "ต้องเปิด Screen Capture ก่อน",
                          Toast.LENGTH_LONG).show();

                      return;
                  }

                  if (BotAccessibilityService.instance == null) {

                      Toast.makeText(
                          this,
                          "ต้องเปิด Accessibility ก่อน",
                          Toast.LENGTH_LONG).show();

                      return;
                  }

                  running = true;
                  waypointIndex = 0;

                  handler.removeCallbacks(loop);
                  handler.post(loop);
              }

              private void stopBot() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null);
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  stopBot();

                  if (monster != null)
                      monster.recycle();

                  if (item != null)
                      item.recycle();

                  if (box != null)
                      wm.removeView(box);

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
