          cat > app/src/main/java/com/dustinbot/v92/BotEngine.java <<'EOF'
package com.dustinbot.v92;

import android.graphics.Bitmap;
import android.graphics.Color;
import android.os.Handler;
import android.os.Looper;

import java.util.Random;

public class BotEngine {

    private final BotAccessibility service;

    private final Handler handler =
        new Handler(Looper.getMainLooper());

    private final Random random =
        new Random();

    private boolean running = false;

    private int W = 0;
    private int H = 0;

    private int lastDirection = -1;

    private int attackCount = 0;

    private int noTargetCount = 0;

    private int lootCount = 0;

    /*
     * SCREEN RATIOS
     *
     * The game is normally landscape.
     */

    private static final float MENU_X = 0.755f;
    private static final float MENU_Y = 0.075f;

    private static final float AUTO_LOCK_X = 0.755f;
    private static final float AUTO_LOCK_Y = 0.155f;

    private static final float ATTACK_X = 0.850f;
    private static final float ATTACK_Y = 0.815f;

    private static final float LOOT_X = 0.850f;
    private static final float LOOT_Y = 0.915f;

    private static final float JOY_X = 0.135f;
    private static final float JOY_Y = 0.790f;

    private static final float PLAYER_X = 0.500f;
    private static final float PLAYER_Y = 0.470f;

    public BotEngine(
        BotAccessibility service
    ) {

        this.service = service;
    }

    public void start() {

        if (running) {
            return;
        }

        running = true;

        attackCount = 0;
        noTargetCount = 0;
        lootCount = 0;

        lastDirection = -1;

        later(
            this::autoLock,
            400
        );
    }

    public void stop() {

        running = false;

        handler.removeCallbacksAndMessages(null);
    }

    private void autoLock() {

        if (!running) {
            return;
        }

        service.tap(
            MENU_X * W_SAFE(),
            MENU_Y * H_SAFE()
        );

        later(
            () -> {

                if (!running) {
                    return;
                }

                service.tap(
                    AUTO_LOCK_X * W_SAFE(),
                    AUTO_LOCK_Y * H_SAFE()
                );

                later(
                    this::scan,
                    700
                );

            },
            300
        );
    }

    private int W_SAFE() {

        if (W > 0) {
            return W;
        }

        return 1842;
    }

    private int H_SAFE() {

        if (H > 0) {
            return H;
        }

        return 832;
    }

    private void scan() {

        if (!running) {
            return;
        }

        service.screenshot(
            new BotAccessibility.ScreenshotCallback() {

                @Override
                public void onSuccess(
                    Bitmap bitmap
                ) {

                    try {

                        if (bitmap == null) {
                            randomSearch();
                            return;
                        }

                        W = bitmap.getWidth();
                        H = bitmap.getHeight();

                        Target target =
                            Vision.findTarget(bitmap);

                        if (target != null) {

                            noTargetCount = 0;

                            moveToTarget(
                                target
                            );

                        } else {

                            noTargetCount++;

                            if (attackCount > 0) {

                                attackCount = 0;

                                finishLoot();

                            } else {

                                randomSearch();

                            }
                        }

                    } finally {

                        if (!bitmap.isRecycled()) {
                            bitmap.recycle();
                        }

                    }
                }

                @Override
                public void onFailure() {

                    if (running) {

                        later(
                            BotEngine.this::randomSearch,
                            400
                        );

                    }
                }
            }
        );
    }

    private void moveToTarget(
        Target target
    ) {

        if (!running) {
            return;
        }

        if (W <= 0 || H <= 0) {
            randomSearch();
            return;
        }

        float tx =
            target.x / (float) W;

        float ty =
            target.y / (float) H;

        float dx =
            tx - PLAYER_X;

        float dy =
            ty - PLAYER_Y;

        float distance =
            (float) Math.sqrt(
                dx * dx +
                dy * dy
            );

        /*
         * Target is close enough.
         * Attack instead of continuing to walk.
         */

        if (distance < 0.075f) {

            attack();

            return;
        }

        /*
         * Target is not close.
         * Move toward it.
         */

        float length =
            (float) Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (length < 0.001f) {

            attack();

            return;
        }

        dx /= length;
        dy /= length;

        joystick(
            dx,
            dy,
            380
        );

        later(
            this::scan,
            500
        );
    }

    private void attack() {

        if (!running) {
            return;
        }

        attackCount++;

        service.tap(
            ATTACK_X * W_SAFE(),
            ATTACK_Y * H_SAFE()
        );

        /*
         * Do not attack forever.
         * If the target remains after several attempts,
         * treat it as an unsuitable/unreachable target
         * and go search somewhere else.
         */

        if (attackCount >= 8) {

            attackCount = 0;

            randomSearch();

            return;
        }

        later(
            this::scan,
            650
        );
    }

    private void finishLoot() {

        if (!running) {
            return;
        }

        lootCount = 0;

        lootStep();
    }

    private void lootStep() {

        if (!running) {
            return;
        }

        lootCount++;

        service.tap(
            LOOT_X * W_SAFE(),
            LOOT_Y * H_SAFE()
        );

        /*
         * Small movement around the character.
         * This helps collect items that are not exactly
         * under the character.
         */

        int direction =
            lootCount % 4;

        float dx = 0;
        float dy = 0;

        switch (direction) {

            case 0:
                dx = 0;
                dy = -1;
                break;

            case 1:
                dx = 1;
                dy = 0;
                break;

            case 2:
                dx = 0;
                dy = 1;
                break;

            case 3:
                dx = -1;
                dy = 0;
                break;
        }

        joystick(
            dx,
            dy,
            180
        );

        if (lootCount < 6) {

            later(
                this::lootStep,
                280
            );

        } else {

            lootCount = 0;

            later(
                this::randomSearch,
                450
            );
        }
    }

    private void randomSearch() {

        if (!running) {
            return;
        }

        /*
         * Random 8-direction movement.
         *
         * 0 = up
         * 1 = up-right
         * 2 = right
         * 3 = down-right
         * 4 = down
         * 5 = down-left
         * 6 = left
         * 7 = up-left
         */

        int direction;

        do {

            direction =
                random.nextInt(8);

        } while (
            direction == lastDirection &&
            random.nextBoolean()
        );

        lastDirection = direction;

        float[][] directions = {

            { 0f, -1f },

            { 0.707f, -0.707f },

            { 1f, 0f },

            { 0.707f, 0.707f },

            { 0f, 1f },

            { -0.707f, 0.707f },

            { -1f, 0f },

            { -0.707f, -0.707f }

        };

        float dx =
            directions[direction][0];

        float dy =
            directions[direction][1];

        int duration =
            550 +
            random.nextInt(950);

        joystick(
            dx,
            dy,
            duration
        );

        /*
         * After each random movement,
         * immediately scan for a target.
         */

        later(
            this::scan,
            350
        );
    }

    private void joystick(
        float dx,
        float dy,
        long duration
    ) {

        if (!running) {
            return;
        }

        int width =
            W_SAFE();

        int height =
            H_SAFE();

        float centerX =
            width * JOY_X;

        float centerY =
            height * JOY_Y;

        float radius =
            Math.min(
                width,
                height
            ) * 0.105f;

        float endX =
            centerX +
            dx * radius;

        float endY =
            centerY +
            dy * radius;

        service.swipe(
            centerX,
            centerY,
            endX,
            endY,
            duration
        );

        /*
         * Release joystick.
         */

        later(
            () -> {

                if (!running) {
                    return;
                }

                service.tap(
                    centerX,
                    centerY
                );

            },
            duration + 40
        );
    }

    /*
     * THIS WAS THE MISSING METHOD
     * IN BUILD #33.
     *
     * V9.1 called later(...) from many places,
     * but BotEngine did not contain the method.
     */

    private void later(
        Runnable runnable,
        long delay
    ) {

        if (runnable == null) {
            return;
        }

        handler.postDelayed(
            runnable,
            delay
        );
    }

    private static class Target {

        final float x;
        final float y;

        Target(
            float x,
            float y
        ) {

            this.x = x;
            this.y = y;
        }
    }

    private static class Vision {

        /*
         * Detect the white target marker/arrow
         * above a monster.
         *
         * The search deliberately ignores:
         *
         * - top menu area
         * - bottom controls
         * - extreme left/right edges
         *
         * so UI buttons are less likely to become
         * false targets.
         */

        static Target findTarget(
            Bitmap bitmap
        ) {

            int width =
                bitmap.getWidth();

            int height =
                bitmap.getHeight();

            int startX =
                (int) (width * 0.12f);

            int endX =
                (int) (width * 0.88f);

            int startY =
                (int) (height * 0.18f);

            int endY =
                (int) (height * 0.70f);

            /*
             * Step size keeps screenshot processing
             * light enough for a phone.
             */

            int step = 4;

            Target best = null;

            int bestScore = 0;

            for (
                int y = startY;
                y < endY;
                y += step
            ) {

                for (
                    int x = startX;
                    x < endX;
                    x += step
                ) {

                    int score =
                        arrowScore(
                            bitmap,
                            x,
                            y
                        );

                    if (
                        score > bestScore
                    ) {

                        bestScore = score;

                        /*
                         * The detected bright marker
                         * is above the monster.
                         *
                         * Aim a little below it.
                         */

                        best =
                            new Target(
                                x,
                                Math.min(
                                    height - 1,
                                    y + 38
                                )
                            );
                    }
                }
            }

            if (bestScore < 18) {
                return null;
            }

            return best;
        }

        private static int arrowScore(
            Bitmap bitmap,
            int cx,
            int cy
        ) {

            int width =
                bitmap.getWidth();

            int height =
                bitmap.getHeight();

            int score = 0;

            /*
             * Small downward triangle pattern.
             */

            int[][] rows = {

                { 1, 1 },

                { 3, 1 },

                { 5, 2 },

                { 7, 3 },

                { 9, 4 }

            };

            for (
                int[] row : rows
            ) {

                int y =
                    cy + row[0];

                int radius =
                    row[1];

                for (
                    int x =
                        cx - radius;
                    x <=
                        cx + radius;
                    x++
                ) {

                    if (
                        x < 0 ||
                        y < 0 ||
                        x >= width ||
                        y >= height
                    ) {
                        continue;
                    }

                    int color =
                        bitmap.getPixel(
                            x,
                            y
                        );

                    int r =
                        Color.red(color);

                    int g =
                        Color.green(color);

                    int b =
                        Color.blue(color);

                    /*
                     * White/near-white pixel.
                     */

                    if (
                        r > 210 &&
                        g > 210 &&
                        b > 210
                    ) {

                        int max =
                            Math.max(
                                r,
                                Math.max(g, b)
                            );

                        int min =
                            Math.min(
                                r,
                                Math.min(g, b)
                            );

                        if (
                            max - min < 35
                        ) {

                            score++;
                        }
                    }
                }
            }

            /*
             * Require dark-ish area below
             * the marker to reduce false positives.
             */

            int darkCount = 0;

            for (
                int yy = cy + 8;
                yy < cy + 28 &&
                yy < height;
                yy += 3
            ) {

                int xx =
                    Math.max(
                        0,
                        Math.min(
                            width - 1,
                            cx
                        )
                    );

                int color =
                    bitmap.getPixel(
                        xx,
                        yy
                    );

                int r =
                    Color.red(color);

                int g =
                    Color.green(color);

                int b =
                    Color.blue(color);

                if (
                    r < 150 ||
                    g < 150 ||
                    b < 150
                ) {

                    darkCount++;
                }
            }

            if (darkCount >= 3) {
                score += 5;
            }

            return score;
        }
    }
}
