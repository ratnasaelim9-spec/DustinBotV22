package com.dustinbot.v41;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;

import android.content.Intent;

import android.graphics.Bitmap;
import android.graphics.Color;
import android.graphics.PointF;

import android.graphics.PixelFormat;

import android.os.Build;
import android.os.Handler;
import android.os.HandlerThread;
import android.os.IBinder;
import android.os.Looper;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.FrameLayout;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.ArrayDeque;
import java.util.ArrayList;

public class BotOverlayService extends Service {

    public static volatile BotOverlayService instance;


    private WindowManager windowManager;

    private LinearLayout panel;

    private TextView statusView;

    private TextView targetView;

    private TextView logView;


    private HandlerThread aiThread;

    private Handler aiHandler;


    private boolean running = false;


    private Bitmap monsterTemplate;

    private Bitmap itemTemplate;


    private final ArrayList<PointF> route =
            new ArrayList<>();


    private int routeIndex = 0;


    private final ArrayDeque<String> logs =
            new ArrayDeque<>();


    /*
     * Template matching threshold.
     * Lower = stricter.
     */

    private float matchThreshold = 70f;


    private long scanDelay = 500;

    private long attackDelay = 1200;

    private long lootDelay = 900;

    private long walkDelay = 1800;


    private View selectionView;


    @Override
    public void onCreate() {

        super.onCreate();


        instance = this;


        createNotificationChannel();


        startForeground(
                502,
                createNotification()
        );


        windowManager =
                (WindowManager)
                        getSystemService(
                                WINDOW_SERVICE
                        );


        aiThread =
                new HandlerThread(
                        "DustinBotAI"
                );

        aiThread.start();


        aiHandler =
                new Handler(
                        aiThread.getLooper()
                );


        createPanel();
    }


    private int dp(int value) {

        return (int)
                (
                        value *
                        getResources()
                                .getDisplayMetrics()
                                .density +
                        0.5f
                );
    }


    private void createNotificationChannel() {

        NotificationManager manager =
                (NotificationManager)
                        getSystemService(
                                NOTIFICATION_SERVICE
                        );


        NotificationChannel channel =
                new NotificationChannel(
                        "dustin_bot_v41",
                        "DustinBot V4.1",
                        NotificationManager.IMPORTANCE_LOW
                );


        manager.createNotificationChannel(
                channel
        );
    }


    private Notification createNotification() {

        return new Notification.Builder(
                this,
                "dustin_bot_v41"
        )

                .setContentTitle(
                        "DustinBot V4.1"
                )

                .setContentText(
                        "Bot running"
                )

                .setSmallIcon(
                        android.R.drawable.ic_media_play
                )

                .build();
    }


    private TextView text(
            String value,
            float size) {

        TextView view =
                new TextView(this);


        view.setText(value);

        view.setTextSize(size);

        view.setTextColor(
                Color.WHITE
        );


        view.setPadding(
                dp(6),
                dp(3),
                dp(6),
                dp(3)
        );


        return view;
    }


    private void createPanel() {

        panel =
                new LinearLayout(this);


        panel.setOrientation(
                LinearLayout.VERTICAL
        );


        panel.setPadding(
                dp(8),
                dp(5),
                dp(8),
                dp(5)
        );


        panel.setBackgroundColor(
                0xDD111111
        );


        statusView =
                text(
                        "STATUS: STOP",
                        14
                );


        targetView =
                text(
                        "TARGET: -",
                        13
                );


        logView =
                text(
                        "READY",
                        10
                );


        logView.setMaxLines(6);


        panel.addView(
                statusView
        );


        panel.addView(
                targetView
        );


        panel.addView(
                logView
        );


        Button startStop =
                new Button(this);


        startStop.setText(
                "BOT START / STOP"
        );


        startStop.setOnClickListener(
                v -> toggleBot()
        );


        panel.addView(
                startStop,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(45)
                )
        );


        WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(

                        dp(285),

                        -2,

                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,

                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,

                        PixelFormat.TRANSLUCENT
                );


        params.gravity =
                Gravity.TOP |
                Gravity.RIGHT;


        params.x = dp(5);

        params.y = dp(55);


        windowManager.addView(
                panel,
                params
        );
    }


    private void toggleBot() {

        if (running) {

            stopBot();

        } else {

            startBot();
        }
    }


    public void startBot() {

        if (!BotAccessibilityService.isReady()) {

            log(
                    "ERROR: ACCESSIBILITY"
            );

            return;
        }


        if (CaptureService.latest == null) {

            log(
                    "ERROR: SCREEN CAPTURE"
            );

            return;
        }


        if (monsterTemplate == null) {

            log(
                    "ERROR: MONSTER NOT SET"
            );

            return;
        }


        running = true;


        setStatus(
                "SEARCHING"
        );


        log(
                "BOT START"
        );


        aiHandler.post(
                this::botLoop
        );
    }


    public void stopBot() {

        running = false;


        setStatus(
                "STOP"
        );


        log(
                "BOT STOP"
        );
    }


    private void botLoop() {

        if (!running) {
            return;
        }


        Bitmap screen =
                CaptureService.copyLatest();


        if (screen == null) {

            scheduleScan(
                    scanDelay
            );

            return;
        }


        TemplateMatcher.Result monster =
                TemplateMatcher.find(
                        screen,
                        monsterTemplate,
                        matchThreshold
                );


        screen.recycle();


        if (monster.found) {

            targetView(
                    "MONSTER " +
                    monster.centerX +
                    "," +
                    monster.centerY +
                    "  SCORE " +
                    String.format(
                            "%.1f",
                            monster.score
                    )
            );


            setStatus(
                    "TARGET LOCK"
            );


            log(
                    "TARGET FOUND"
            );


            BotAccessibilityService service =
                    BotAccessibilityService.instance;


            if (service != null) {

                service.tapBitmap(

                        monster.centerX,

                        monster.centerY,

                        CaptureService.captureWidth,

                        CaptureService.captureHeight
                );


                setStatus(
                        "ATTACKING"
                );


                log(
                        "ATTACK"
                );
            }


            scheduleScan(
                    attackDelay
            );


            return;
        }


        /*
         * Monster not found.
         * Try item.
         */

        if (itemTemplate != null) {

            Bitmap itemScreen =
                    CaptureService.copyLatest();


            if (itemScreen != null) {

                TemplateMatcher.Result item =
                        TemplateMatcher.find(

                                itemScreen,

                                itemTemplate,

                                matchThreshold
                        );


                itemScreen.recycle();


                if (item.found) {

                    targetView(
                            "ITEM " +
                            item.centerX +
                            "," +
                            item.centerY
                    );


                    setStatus(
                            "LOOTING"
                    );


                    log(
                            "ITEM FOUND"
                    );


                    BotAccessibilityService service =
                            BotAccessibilityService.instance;


                    if (service != null) {

                        service.tapBitmap(

                                item.centerX,

                                item.centerY,

                                CaptureService.captureWidth,

                                CaptureService.captureHeight
                        );
                    }


                    scheduleScan(
                            lootDelay
                    );


                    return;
                }
            }
        }


        /*
         * No monster.
         * Walk route.
         */

        if (!route.isEmpty()) {

            PointF point =
                    route.get(
                            routeIndex %
                            route.size()
                    );


            routeIndex++;


            BotAccessibilityService service =
                    BotAccessibilityService.instance;


            if (service != null) {

                service.tapScreen(
                        point.x,
                        point.y
                );


                setStatus(
                        "WALKING"
                );


                log(
                        "WALKING"
                );
            }


            scheduleScan(
                    walkDelay
            );


            return;
        }


        setStatus(
                "SEARCHING"
        );


        scheduleScan(
                scanDelay
        );
    }


    private void scheduleScan(
            long delay) {

        if (!running) {
            return;
        }


        aiHandler.postDelayed(
                this::botLoop,
                delay
        );
    }


    public void selectMonster() {

        openSelector(
                false
        );
    }


    public void selectItem() {

        openSelector(
                true
        );
    }


    private void openSelector(
            boolean itemMode) {

        if (CaptureService.latest == null) {

            log(
                    "SCREEN CAPTURE OFF"
            );

            return;
        }


        if (selectionView != null) {
            return;
        }


        FrameLayout frame =
                new FrameLayout(this);


        TextView instruction =
                text(
                        itemMode
                                ?
                                "แตะ ITEM ที่ต้องการ"
                                :
                                "แตะ MONSTER ที่ต้องการ",
                        16
                );


        instruction.setBackgroundColor(
                0xCC111111
        );


        FrameLayout.LayoutParams instructionParams =
                new FrameLayout.LayoutParams(
                        -1,
                        dp(60)
                );


        instructionParams.gravity =
                Gravity.TOP;


        frame.addView(
                instruction,
                instructionParams
        );


        Button cancel =
                new Button(this);


        cancel.setText(
                "CANCEL"
        );


        FrameLayout.LayoutParams cancelParams =
                new FrameLayout.LayoutParams(
                        dp(110),
                        dp(60)
                );


        cancelParams.gravity =
                Gravity.TOP |
                Gravity.RIGHT;


        frame.addView(
                cancel,
                cancelParams
        );


        View touch =
                new View(this);


        touch.setBackgroundColor(
                Color.TRANSPARENT
        );


        FrameLayout.LayoutParams touchParams =
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                );


        frame.addView(
                touch,
                touchParams
        );


        instruction.bringToFront();

        cancel.bringToFront();


        touch.setOnTouchListener(
                (view, event) -> {

                    if (event.getAction() ==
                            MotionEvent.ACTION_UP) {

                        captureTemplate(
                                event.getX(),
                                event.getY(),
                                itemMode
                        );


                        return true;
                    }


                    return true;
                }
        );


        cancel.setOnClickListener(
                v -> closeSelector()
        );


        selectionView = frame;


        WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(

                        -1,

                        -1,

                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,

                        WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,

                        PixelFormat.TRANSLUCENT
                );


        windowManager.addView(
                frame,
                params
        );


        setStatus(
                itemMode
                        ?
                        "SELECT ITEM"
                        :
                        "SELECT MONSTER"
        );
    }


    private void captureTemplate(
            float screenX,
            float screenY,
            boolean itemMode) {


        Bitmap screen =
                CaptureService.copyLatest();


        if (screen == null) {

            closeSelector();

            return;
        }


        int viewWidth =
                Math.max(
                        1,
                        selectionView.getWidth()
                );


        int viewHeight =
                Math.max(
                        1,
                        selectionView.getHeight()
                );


        int x =
                Math.round(
                        screenX *
                        screen.getWidth() /
                        (float) viewWidth
                );


        int y =
                Math.round(
                        screenY *
                        screen.getHeight() /
                        (float) viewHeight
                );


        int size = 80;


        int left =
                Math.max(
                        0,
                        Math.min(
                                screen.getWidth() - size,
                                x - size / 2
                        )
                );


        int top =
                Math.max(
                        0,
                        Math.min(
                                screen.getHeight() - size,
                                y - size / 2
                        )
                );


        Bitmap template =
                Bitmap.createBitmap(
                        screen,
                        left,
                        top,
                        size,
                        size
                );


        screen.recycle();


        if (itemMode) {

            if (itemTemplate != null &&
                !itemTemplate.isRecycled()) {

                itemTemplate.recycle();
            }


            itemTemplate =
                    template;


            log(
                    "ITEM READY"
            );


            setStatus(
                    "ITEM READY"
            );

        } else {

            if (monsterTemplate != null &&
                !monsterTemplate.isRecycled()) {

                monsterTemplate.recycle();
            }


            monsterTemplate =
                    template;


            log(
                    "MONSTER READY"
            );


            setStatus(
                    "MONSTER READY"
            );
        }


        closeSelector();
    }


    public void recordRoute() {

        if (selectionView != null) {
            return;
        }


        FrameLayout frame =
                new FrameLayout(this);


        TextView instruction =
                text(
                        "แตะจุดเดินตามลำดับ แล้วกด DONE",
                        15
                );


        instruction.setBackgroundColor(
                0xCC111111
        );


        FrameLayout.LayoutParams instructionParams =
                new FrameLayout.LayoutParams(
                        -1,
                        dp(60)
                );


        instructionParams.gravity =
                Gravity.TOP;


        frame.addView(
                instruction,
                instructionParams
        );


        Button done =
                new Button(this);


        done.setText(
                "DONE"
        );


        FrameLayout.LayoutParams doneParams =
                new FrameLayout.LayoutParams(
                        dp(110),
                        dp(60)
                );


        doneParams.gravity =
                Gravity.TOP |
                Gravity.RIGHT;


        frame.addView(
                done,
                doneParams
        );


        View touch =
                new View(this);


        touch.setBackgroundColor(
                Color.TRANSPARENT
        );


        frame.addView(
                touch,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );


        instruction.bringToFront();

        done.bringToFront();


        route.clear();

        routeIndex = 0;


        touch.setOnTouchListener(
                (view, event) -> {

                    if (event.getAction() ==
                            MotionEvent.ACTION_UP) {

                        route.add(
                                new PointF(
                                        event.getX(),
                                        event.getY()
                                )
                        );


                        log(
                                "ROUTE " +
                                route.size()
                        );


                        return true;
                    }


                    return true;
                }
        );


        done.setOnClickListener(
                v -> {

                    closeSelector();


                    setStatus(
                            "ROUTE " +
                            route.size()
                    );


                    log(
                            "ROUTE READY"
                    );
                }
        );


        selectionView = frame;


        WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(

                        -1,

                        -1,

                        Build.VERSION.SDK_INT >= 26
                                ?
                                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                :
                                WindowManager.LayoutParams.TYPE_PHONE,

                        WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,

                        PixelFormat.TRANSLUCENT
                );


        windowManager.addView(
                frame,
                params
        );


        setStatus(
                "RECORD ROUTE"
        );
    }


    private void closeSelector() {

        if (selectionView != null) {

            try {

                windowManager.removeView(
                        selectionView
                );

            } catch (Exception ignored) {
            }


            selectionView = null;
        }
    }


    private void setStatus(
            String value) {

        new Handler(
                Looper.getMainLooper()
        ).post(
                () ->
                        statusView.setText(
                                "STATUS: " +
                                value
                        )
        );
    }


    private void targetView(
            String value) {

        new Handler(
                Looper.getMainLooper()
        ).post(
                () ->
                        targetView.setText(
                                "TARGET: " +
                                value
                        )
        );
    }


    private void log(
            String message) {

        synchronized (logs) {

            logs.addFirst(
                    message
            );


            while (logs.size() > 6) {

                logs.removeLast();
            }
        }


        StringBuilder builder =
                new StringBuilder();


        synchronized (logs) {

            for (String line : logs) {

                builder.append(
                        line
                );

                builder.append(
                        "\n"
                );
            }
        }


        String output =
                builder.toString().trim();


        new Handler(
                Looper.getMainLooper()
        ).post(
                () ->
                        logView.setText(
                                output
                        )
        );
    }


    @Override
    public int onStartCommand(
            Intent intent,
            int flags,
            int startId) {

        return START_STICKY;
    }


    @Override
    public void onDestroy() {

        running = false;


        closeSelector();


        if (monsterTemplate != null &&
            !monsterTemplate.isRecycled()) {

            monsterTemplate.recycle();
        }


        if (itemTemplate != null &&
            !itemTemplate.isRecycled()) {

            itemTemplate.recycle();
        }


        if (panel != null) {

            try {

                windowManager.removeView(
                        panel
                );

            } catch (Exception ignored) {
            }
        }


        if (aiThread != null) {

            aiThread.quitSafely();

            aiThread = null;
        }


        instance = null;


        super.onDestroy();
    }


    @Override
    public IBinder onBind(
            Intent intent) {

        return null;
    }
}
